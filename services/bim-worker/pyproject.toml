[project]
name = "bim-worker"
version = "0.1.0"
description = "BIM (IFC) 匯入解析器 —— 見 sql/080_bim_ingest_worker_service_account.sql 與 ADR-09"
requires-python = ">=3.11"
dependencies = [
    "ifcopenshell>=0.8.5",
    "psycopg[binary]>=3.3",
    "boto3>=1.34",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bim_worker*"]
