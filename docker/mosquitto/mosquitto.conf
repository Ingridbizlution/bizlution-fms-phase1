# =============================================================================
# Mosquitto — 本機 IoT 遙測與下行命令測試用
# =============================================================================
# 僅供開發：允許匿名連線。正式環境的 IoT 閘道必須使用 fms.api_clients 簽發的
# 憑證，並限制 allowed_cidrs（見 002_identity_directory_rbac.sql）。
# =============================================================================

listener 1883
protocol mqtt

listener 9001
protocol websockets

allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

# 建議的主題規劃（與 devices.address 對應）：
#   fms/<facility_code>/<floor>/<device_code>/telemetry   上行遙測
#   fms/<facility_code>/<floor>/<device_code>/state       上行狀態與心跳
#   fms/<facility_code>/<floor>/<device_code>/command     下行命令（device_commands）
#   fms/<facility_code>/<floor>/<device_code>/command/ack 命令回覆
