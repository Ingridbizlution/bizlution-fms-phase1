openapi: 3.1.0
info:
  title: Facility Management System Platform API
  version: 1.0.0-phase1
  summary: 多領域設施與設備管理系統 — 第一階段後端契約
  description: |
    集團客戶共用的 FMS 後端 API。前端團隊（企業、影城、校園、廠務等各垂直領域）
    以此契約為唯一整合依據；領域專屬的聚合邏輯放在各自的 BFF，不進入本層。

    ## 一致性規範
    * **Context 標頭**：所有請求必須帶 `X-Tenant-ID`；操作特定場館時帶 `X-Facility-ID`。
      伺服端會以此設定資料庫 session 變數並套用 Row-Level Security。
    * **分頁**：cursor-based。回應 `page.next_cursor` 為 null 表示已到底。
    * **排序**：`sort=-created_at,name`（`-` 為降冪）。
    * **稀疏欄位**：`fields=id,name,status`。
    * **過濾**：`filter[status]=OPEN&filter[priority]=HIGH,URGENT`（逗號為 OR）。
    * **錯誤**：RFC 9457 Problem Details，並附 `code` 供前端做 i18n 對照。
    * **樂觀鎖**：具 `version` 的資源在寫入時必須帶 `If-Match: "<version>"`。
    * **冪等**：所有建立類 POST 支援 `Idempotency-Key`，24 小時內重放回傳原結果。
    * **時間**：一律 RFC 3339 with offset。伺服端不接受無時區的時間字串。
  contact:
    name: Bizlution Platform Team
    email: rainer@bizlution.com
  license:
    name: Proprietary

servers:
  - url: https://api.fms.bizlution.com/api/v1
    description: Production
  - url: https://api-staging.fms.bizlution.com/api/v1
    description: Staging
  - url: http://localhost:8000/api/v1
    description: Local

security:
  - bearerAuth: []

tags:
  - name: Auth & Identity
    description: 登入、SSO/AD 身分來源、SCIM 供裝
  - name: Tenancy
    description: 租戶、組織、設施
  - name: Spatial
    description: 空間節點與 BIM
  - name: Assets
    description: 設備資產、型錄、計量
  - name: Maintenance
    description: 保養範本與預防性維護計畫
  - name: Service Catalogue
    description: 軟性服務目錄（Soft FM）
  - name: Work Orders
    description: 統一工單（維修 + 服務請求）
  - name: Reservations
    description: 空間與設備預約
  - name: Calendar
    description: Microsoft 365／Google Workspace 日曆聯邦（ADR-14）
  - name: IoT
    description: 裝置、遙測、告警
  - name: Admin
    description: 角色、權限、稽核
  - name: Reporting
    description: 儀表板與報表

paths:
  # ---------------------------------------------------------------------------
  # Auth & Identity
  # ---------------------------------------------------------------------------
  /auth/token:
    post:
      tags: [Auth & Identity]
      operationId: issueToken
      summary: 取得存取權杖
      description: |
        支援三種 grant：
        * `password` — LOCAL 身分來源（外包技師、Kiosk）
        * `authorization_code` — OIDC/SAML 回跳後換發（Entra ID、地端 AD 經 ADFS）
        * `client_credentials` — 機器帳號（IoT 閘道、客戶 ERP）
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: 權杖發放成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/token/refresh:
    post:
      tags: [Auth & Identity]
      operationId: refreshToken
      summary: 更新存取權杖
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/sso/{providerCode}/authorize:
    get:
      tags: [Auth & Identity]
      operationId: ssoAuthorize
      summary: 取得 OIDC 授權網址
      security: []
      description: |
        不需認證（使用者還沒登入）。

        ### `tenant_code` 是必填 —— 契約原本沒有這個參數

        002 的唯一鍵是 `(tenant_id, lower(code))`，**provider code 只在租戶內
        唯一**。沒有租戶判別就定位不到身分來源，而「猜第一個符合的」會讓 A 租戶
        的登入跳到 B 租戶的 IdP —— 使用者會把密碼輸入到別人的身分來源裡。

        走 migration 014 的 `resolve_tenant_by_code`，與 password grant 同一個機制。

        ### 回 200 + `authorize_url`，不回 302

        契約寫「回傳 302 或 authorize_url」。選 200：一個 302 在 `fetch()` 裡會被
        自動跟隨，於是瀏覽器對 IdP 發出 XHR 而不是導航，結果是 CORS 錯誤而不是
        登入畫面。前端拿到網址自己 `location.assign()`。

        ### `redirect_uri` 由部署設定組出，**不接受請求提供**

        接受呼叫端給的值就是一個開放轉址器：攻擊者把它指向自己的網站，IdP 就會
        把授權碼送到那裡。它由 `PUBLIC_BASE_URL` 組出來；未設定時回 501 並說明
        要設什麼（不猜 —— 猜出來的值 IdP 那邊沒有註冊）。

        ### 產生的伺服器端狀態

        每次呼叫在 `sso_auth_requests` 寫一列，帶 `state`（CSRF）、`nonce`
        （id_token 重放）、PKCE `code_verifier`（授權碼攔截），有效期 10 分鐘。
        三者都**不能**放在 cookie 或 URL 裡。

        授權端點取自 IdP 的 discovery 文件（不從 issuer 硬拼 —— OIDC 允許它在
        任何路徑上），而那次出站請求過 SSRF 閘門。
      parameters:
        - name: providerCode
          in: path
          required: true
          schema: { type: string }
        - name: tenant_code
          in: query
          required: true
          schema: { type: string }
          description: 必填，見上方說明。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [authorize_url, state, expires_at, redirect_uri]
                properties:
                  authorize_url: { type: string, format: uri }
                  state: { type: string }
                  expires_at: { type: string, format: date-time }
                  redirect_uri: { type: string, format: uri }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 身分來源不是 ACTIVE，或取不到 discovery 文件。
          $ref: '#/components/responses/Conflict'
        '422': { $ref: '#/components/responses/ValidationError' }
        '501':
          description: |
            非 OIDC 的身分來源（SAML2 需要 metadata 解析與斷言簽章驗證，
            兩者都需要 Phase 1 沒有的密鑰解析器），或部署未設定 `PUBLIC_BASE_URL`。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /auth/sso/{providerCode}/callback:
    get:
      tags: [Auth & Identity]
      operationId: ssoCallback
      summary: OIDC 回跳處理（**目前只完成 state 驗證**）
      security: []
      description: |
        不需認證。**這支端點目前完成前半，後半回 501。**

        ### 完成的部分：state 的驗證與一次性消耗

        那是這條流程的安全核心（CSRF 與重放防護）。`state` 一經使用即失效
        （條件式 `UPDATE ... WHERE consumed_at IS NULL`，原子），而四種結果**分開
        回報**：

        | 情況 | 回應 | 為什麼要分開 |
        |---|---|---|
        | 有效 | 走到下一步 | — |
        | 已使用 | 409 | **可能是重放** —— 值得調查 |
        | 已過期 | 409（不同訊息） | 使用者在 IdP 上待太久，正常情況 |
        | 不存在 | 401 | 通常是設定錯誤 |

        合併成一個「無效的 state」會讓可能的攻擊與正常的逾時在日誌裡長得一樣。

        IdP 回 `error=`（使用者按拒絕）時**state 仍然被消耗** —— 它已經曝光在
        瀏覽器的位址欄裡，不該還能再用一次。

        ### 未完成的部分：token 交換與 id_token 驗證 → **501**

        缺兩樣東西，而兩者都是結構性的，不是「還沒排到」：

        1. **client_secret** —— `identity_providers.client_secret_ref` 是密鑰管理
           服務的**參照**，而 Phase 1 沒有解析器。伺服器手上沒有能換 token 的密鑰。
        2. **可對接的 IdP** —— id_token 的簽章要用 JWKS 驗證，而沒有真實 IdP 可以
           產生一張真的 id_token 來驗證那段程式碼。

        兩者與 `POST /identity-providers/{id}/test-connection` 驗不到 LDAP bind
        是**同一個根本原因**。

        **回 501 而不是一個假的成功是刻意的**：一支核發身分卻沒有驗證 id_token 的
        callback 會是這個系統裡最危險的程式碼 —— 任何人拿到一個 state 就能變成
        任何人。回應裡沒有任何 token 欄位，而收到的授權碼不會被回顯（它是憑證）。
      parameters:
        - name: providerCode
          in: path
          required: true
          schema: { type: string }
        - name: code
          in: query
          schema: { type: string }
        - name: state
          in: query
          required: true
          schema: { type: string }
        - name: error
          in: query
          schema: { type: string }
          description: IdP 在使用者拒絕授權時回這個，而不是 code。
        - name: error_description
          in: query
          schema: { type: string }
      responses:
        '401':
          description: state 不存在，或 IdP 回報授權失敗。
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: state 已使用（可能是重放）或已過期 —— 兩者訊息不同。
          $ref: '#/components/responses/Conflict'
        '422': { $ref: '#/components/responses/ValidationError' }
        '501':
          description: |
            state 已驗證並消耗，但無法完成登入。`detail` 逐條列出缺什麼。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ===========================================================================
  # SCIM 2.0 供裝端點
  # ===========================================================================
  # 這一組刻意不遵守本契約其他地方的慣例，每一項偏離都由 RFC 7643/7644 決定：
  #
  #   * 錯誤是 SCIM 的 Error 結構，**不是** RFC 7807 problem+json。
  #     Entra ID 解析的是前者 —— 回 problem+json 它只會顯示「未知錯誤」。
  #   * 回應沒有 `{data, meta}` 封裝：清單是 `ListResponse`，單筆是裸資源。
  #   * 欄位名是 camelCase（`userName`、`displayName`、`externalId`）。
  #   * 分頁是 `startIndex`（**1-based**）與 `count`，不是游標。
  #   * 認證是 `scimToken`，且**沒有** `X-Tenant-ID`（Entra 送不出來）——
  #     token 本身就是租戶與身分來源的判別依據。
  #
  # 路徑大小寫敏感：`Users`／`Groups` 的首字大寫是規範定義的。
  #
  # ## 讀寫範圍限定在發出請求的那個身分來源
  #
  # `GET /scim/v2/Users` 只回**有該 provider 的 user_identities 列**的使用者。
  # 回整個租戶的後果很具體：Entra 建立前會先用 `userName eq` 查一次，若我們把
  # 一個本地帳號回給它，它會認為那是自己管的，接著就能改該帳號的狀態 ——
  # 包含租戶管理員。**外部目錄不該能接管它沒有佈建的帳號。**
  #
  # ## 沒有實作的部分（不是遺漏，是刻意的範圍）
  #
  #   * `PUT`（整體替換）—— 契約只列 GET/POST/PATCH/DELETE；Entra 預設用 PATCH。
  #   * `/ServiceProviderConfig`、`/Schemas`、`/ResourceTypes` —— Entra 不讀。
  #   * 完整 filter 文法（`and`／`or`／`co`／`sw`／括號）—— 只支援
  #     `attr eq "value"` 與 `members[value eq "<uuid>"]`，也就是 Entra 實際會送
  #     的全部。其他形式回 400 `invalidFilter`，**不靜默忽略** ——
  #     忽略 filter 會讓「查一個人」變成「回傳全部人」。
  #   * `sortBy`／`sortOrder`、`Bulk`、ETag。
  #   * 巢狀成員（群組屬於群組）—— `user_directory_groups` 只接受使用者。
  /scim/v2/Users:
    get:
      tags: [Auth & Identity]
      operationId: scimListUsers
      summary: SCIM 使用者清單
      security: [{ scimToken: [] }]
      description: |
        只回此身分來源佈建的使用者，且排除 `DEPROVISIONED`
        （`DELETE` 之後的後續 GET 因此是 404，符合 RFC 7644 §3.6）。
      parameters:
        - name: filter
          in: query
          required: false
          schema: { type: string }
          description: |
            只支援 `userName eq "…"` 與 `externalId eq "…"`。
            其他文法或屬性回 400 `invalidFilter`。
        - name: startIndex
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
          description: '**1-based**（RFC 7644 §3.4.2.4）。小於 1 的值視為 1。'
        - name: count
          in: query
          required: false
          schema: { type: integer, minimum: 0, maximum: 200, default: 200 }
      responses:
        '200':
          description: OK
          content:
            application/scim+json:
              schema: { $ref: '#/components/schemas/ScimListResponse' }
        '400':
          description: filter 文法不支援。
          content:
            application/scim+json:
              schema: { $ref: '#/components/schemas/ScimError' }
        '401':
          description: SCIM token 缺少、無效、已撤銷，或該來源未啟用供裝（四者不區分）。
          content:
            application/scim+json:
              schema: { $ref: '#/components/schemas/ScimError' }
    post:
      tags: [Auth & Identity]
      operationId: scimCreateUser
      summary: SCIM 建立使用者
      security: [{ scimToken: [] }]
      description: |
        `userName` 必填。`displayName` 未提供時依序退化為
        「givenName familyName」→ `userName`（`users.display_name` 是 NOT NULL）。

        `active: false` 對應 `SUSPENDED`（可復原），不是 `DEPROVISIONED`。

        使用者名稱已被一個**不由此來源管理**的帳號佔用時回 409 `uniqueness`，
        且 detail 會說出那件事 —— 不會自動接管該帳號。
      requestBody:
        required: true
        content:
          application/scim+json:
            schema: { $ref: '#/components/schemas/ScimUser' }
      responses:
        '201':
          description: Created
          content:
            application/scim+json:
              schema: { $ref: '#/components/schemas/ScimUser' }
        '400':
          description: '`userName` 缺少或屬性值不合法。'
          content:
            application/scim+json:
              schema: { $ref: '#/components/schemas/ScimError' }
        '401':
          description: SCIM token 未通過認證。
          content:
            application/scim+json:
              schema: { $ref: '#/components/schemas/ScimError' }
        '409':
          description: '`userName` 已存在（`scimType: uniqueness`）。'
          content:
            application/scim+json:
              schema: { $ref: '#/components/schemas/ScimError' }

  /scim/v2/Users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: 本系統的 `users.id`（即 SCIM 資源的 `id`）。
    get:
      tags: [Auth & Identity]
      operationId: scimGetUser
      summary: SCIM 讀取單一使用者
      security: [{ scimToken: [] }]
      responses:
        '200':
          description: OK
          content:
            application/scim+json:
              schema: { $ref: '#/components/schemas/ScimUser' }
        '401':
          description: SCIM token 未通過認證。
          content:
            application/scim+json:
              schema: { $ref: '#/components/schemas/ScimError' }
        '404':
          description: 不存在、不屬於此身分來源，或已被 SCIM 刪除。
          content:
            application/scim+json:
              schema: { $ref: '#/components/schemas/ScimError' }
    patch:
      tags: [Auth & Identity]
      operationId: scimPatchUser
      summary: SCIM 修改使用者
      security: [{ scimToken: [] }]
      description: |
        可改的路徑：`active`、`displayName`、`name.givenName`、
        `name.familyName`、`name`（整個物件）、`title`。

        **不支援的路徑回 400 `invalidPath`，不靜默略過** ——
        略過會讓 Entra 的同步報告顯示成功，而那個屬性從未被寫入。

        兩種真實世界的形式都接受：
        `{"op":"replace","path":"active","value":false}` 以及
        `{"op":"replace","value":{"active":false}}`（沒有 path）。
        `active` 也接受字串 `"True"`／`"False"` —— 不合規範，但 Entra 會送。
      requestBody:
        required: true
        content:
          application/scim+json:
            schema: { $ref: '#/components/schemas/ScimPatchOp' }
      responses:
        '200':
          description: OK
          content:
            application/scim+json:
              schema: { $ref: '#/components/schemas/ScimUser' }
        '400':
          description: 'op／path 不支援，或值不合法（`invalidPath`／`invalidValue`／`invalidSyntax`）。'
          content:
            application/scim+json:
              schema: { $ref: '#/components/schemas/ScimError' }
        '401':
          description: SCIM token 未通過認證。
          content:
            application/scim+json:
              schema: { $ref: '#/components/schemas/ScimError' }
        '404':
          description: 不存在或不屬於此身分來源。
          content:
            application/scim+json:
              schema: { $ref: '#/components/schemas/ScimError' }
    delete:
      tags: [Auth & Identity]
      operationId: scimDeleteUser
      summary: SCIM 刪除使用者（狀態改為 DEPROVISIONED）
      security: [{ scimToken: [] }]
      description: |
        **不是實體刪除，也不設 `deleted_at`。** 狀態改成 `DEPROVISIONED`，
        與 `POST /users/{userId}:suspend` 對「離職」的既有詞彙一致。

        那一列留著是因為工單、勞務紀錄與稽核軌都引用它 —— 真的刪掉會讓
        「這張單是誰做的」變成 NULL。SCIM 那一側看到的仍然是刪除：
        後續的 GET 是 404（RFC 7644 §3.6）。
      responses:
        '204': { description: No Content }
        '401':
          description: SCIM token 未通過認證。
          content:
            application/scim+json:
              schema: { $ref: '#/components/schemas/ScimError' }
        '404':
          description: 不存在或不屬於此身分來源。
          content:
            application/scim+json:
              schema: { $ref: '#/components/schemas/ScimError' }

  /scim/v2/Groups:
    get:
      tags: [Auth & Identity]
      operationId: scimListGroups
      summary: SCIM 群組清單
      security: [{ scimToken: [] }]
      description: 只回此身分來源的 `directory_groups`。
      parameters:
        - name: filter
          in: query
          required: false
          schema: { type: string }
          description: 只支援 `displayName eq "…"` 與 `externalId eq "…"`。
        - name: startIndex
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: count
          in: query
          required: false
          schema: { type: integer, minimum: 0, maximum: 200, default: 200 }
      responses:
        '200':
          description: OK
          content:
            application/scim+json:
              schema: { $ref: '#/components/schemas/ScimListResponse' }
        '400':
          description: filter 文法不支援。
          content:
            application/scim+json:
              schema: { $ref: '#/components/schemas/ScimError' }
        '401':
          description: SCIM token 未通過認證。
          content:
            application/scim+json:
              schema: { $ref: '#/components/schemas/ScimError' }
    post:
      tags: [Auth & Identity]
      operationId: scimCreateGroup
      summary: SCIM 建立群組
      security: [{ scimToken: [] }]
      description: |
        `displayName` 必填。`externalId` 未提供時產生一個 uuid 當
        `external_group_id`（002 的該欄位是 NOT NULL 且與 provider 組唯一鍵）。

        `members` 裡的每個 `value` 必須是**此身分來源佈建的**使用者 id。
        有任何一個不是就整批拒絕（400）—— 只加入一部分會讓 Entra 顯示成功，
        而漏掉的那個人永遠拿不到群組對應的角色（058）。
      requestBody:
        required: true
        content:
          application/scim+json:
            schema: { $ref: '#/components/schemas/ScimGroup' }
      responses:
        '201':
          description: Created
          content:
            application/scim+json:
              schema: { $ref: '#/components/schemas/ScimGroup' }
        '400':
          description: '`displayName` 缺少，或成員不屬於此身分來源。'
          content:
            application/scim+json:
              schema: { $ref: '#/components/schemas/ScimError' }
        '401':
          description: SCIM token 未通過認證。
          content:
            application/scim+json:
              schema: { $ref: '#/components/schemas/ScimError' }
        '409':
          description: '`externalId` 已存在（`scimType: uniqueness`）。'
          content:
            application/scim+json:
              schema: { $ref: '#/components/schemas/ScimError' }

  /scim/v2/Groups/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: 本系統的 `directory_groups.id`。
    get:
      tags: [Auth & Identity]
      operationId: scimGetGroup
      summary: SCIM 讀取單一群組
      security: [{ scimToken: [] }]
      responses:
        '200':
          description: OK
          content:
            application/scim+json:
              schema: { $ref: '#/components/schemas/ScimGroup' }
        '401':
          description: SCIM token 未通過認證。
          content:
            application/scim+json:
              schema: { $ref: '#/components/schemas/ScimError' }
        '404':
          description: 不存在或不屬於此身分來源。
          content:
            application/scim+json:
              schema: { $ref: '#/components/schemas/ScimError' }
    patch:
      tags: [Auth & Identity]
      operationId: scimPatchGroup
      summary: SCIM 修改群組（含成員增刪）
      security: [{ scimToken: [] }]
      description: |
        支援的操作：

          * `add` / `replace` `members` —— `replace` 的語意是「成員就是這一組」，
            因此會先清空。
          * `remove` `members` —— 兩種形式：`path: "members"` 加 value 清單，
            或 `path: "members[value eq \"<uuid>\"]"`（Entra 移除成員時用後者，
            不支援它等於「移除永遠不生效」）。`path: "members"` 且沒有 value
            時清空全部成員。
          * `replace` `displayName`。

        其他路徑回 400 `invalidPath`。成員必須屬於此身分來源，否則整批拒絕。
      requestBody:
        required: true
        content:
          application/scim+json:
            schema: { $ref: '#/components/schemas/ScimPatchOp' }
      responses:
        '200':
          description: OK
          content:
            application/scim+json:
              schema: { $ref: '#/components/schemas/ScimGroup' }
        '400':
          description: 'op／path 不支援，或成員不屬於此身分來源。'
          content:
            application/scim+json:
              schema: { $ref: '#/components/schemas/ScimError' }
        '401':
          description: SCIM token 未通過認證。
          content:
            application/scim+json:
              schema: { $ref: '#/components/schemas/ScimError' }
        '404':
          description: 不存在或不屬於此身分來源。
          content:
            application/scim+json:
              schema: { $ref: '#/components/schemas/ScimError' }
    delete:
      tags: [Auth & Identity]
      operationId: scimDeleteGroup
      summary: SCIM 刪除群組（實體刪除）
      security: [{ scimToken: [] }]
      description: |
        **這裡是真的刪除**，與使用者不同：`directory_groups` 沒有 `deleted_at`
        欄位，而群組本身不被工單或稽核軌引用。

        後果要說清楚：**由這個群組授予的角色會一併消失**
        （`directory_role_mappings` 是 ON DELETE CASCADE）。那是正確的行為 ——
        群組被移出供裝範圍就代表它不再授權任何人。
      responses:
        '204': { description: No Content }
        '401':
          description: SCIM token 未通過認證。
          content:
            application/scim+json:
              schema: { $ref: '#/components/schemas/ScimError' }
        '404':
          description: 不存在或不屬於此身分來源。
          content:
            application/scim+json:
              schema: { $ref: '#/components/schemas/ScimError' }
  /auth/logout:
    post:
      tags: [Auth & Identity]
      operationId: logout
      summary: 撤銷一個 refresh token
      description: |
        撤銷 body 裡那**一個** refresh token（migration 070 的黑名單）。

        兩件事客戶端必須知道：

        * **access token 不受影響。** 它沒有做成可撤銷的（撤銷它就要在每一個
          請求上加一次資料庫查詢），因此登出後仍有效至過期 ——
          回應的 `access_token_remains_valid_for_seconds` 是那個上界。
          客戶端必須自己清掉本機那一份。
        * **只撤銷這一個。** 同一個帳號在其他裝置上的 refresh token 不受影響。

        重複呼叫是幂等的：回 200 且 `already_revoked: true`。

        refresh token 無法驗證（簽章錯或已過期）時回 401 —— 此時沒有可撤銷的
        對象。已過期的 token 本來就不能再換發，客戶端直接丟掉即可。
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              additionalProperties: false
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: 已撤銷
          content:
            application/json:
              schema:
                type: object
                required:
                  - revoked
                  - already_revoked
                  - access_token_remains_valid_for_seconds
                properties:
                  revoked:
                    type: boolean
                    description: 這個 token 現在處於撤銷狀態。幂等，因此永遠是 true。
                  already_revoked:
                    type: boolean
                    description: 這次呼叫之前就已經被撤銷過（重複登出／客戶端重試）。
                  access_token_remains_valid_for_seconds:
                    type: integer
                    format: int64
                    description: |
                      access token 的 TTL，是**上界**而不是剩餘秒數 ——
                      這支端點看不到客戶端手上那張 access token 的簽發時間。
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/password/change:
    post:
      tags: [Auth & Identity]
      operationId: changePassword
      summary: 變更自己的本地帳號密碼
      description: |
        需要 `current_password`：access token 可能是從一台沒鎖的機器上取得的，
        而改密碼會把帳號的控制權交出去。

        **不會登出其他裝置。** 撤銷的粒度是單一 refresh token，而這個請求手上
        沒有其他裝置的 token —— 回應的 `other_sessions_remain_valid` 永遠是
        true，刻意做成欄位而不是文件裡的一句話。

        最短長度來自 `tenants.settings.password_min_length`（管理者可設，
        範圍 8–128，未設定時 12），回應的 `min_length_applied` 是這次套用的值。

        只能改**本地**密碼。帳號的 `password_hash` 為 NULL（只能經目錄來源
        登入）時回 409 —— 在那裡建一組本地密碼會憑空造出一條繞過管理者所選
        身分來源的登入途徑。
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              additionalProperties: false
              properties:
                current_password: { type: string }
                new_password: { type: string }
      responses:
        '200':
          description: 已變更
          content:
            application/json:
              schema:
                type: object
                required: [changed, other_sessions_remain_valid, min_length_applied]
                properties:
                  changed: { type: boolean }
                  other_sessions_remain_valid:
                    type: boolean
                    description: 永遠 true。見上方說明 —— 這是機制的邊界，不是狀態。
                  min_length_applied:
                    type: integer
                    description: 這次套用的最短長度政策。
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/me:
    get:
      tags: [Auth & Identity]
      operationId: getCurrentUser
      summary: 取得目前使用者、可用場館與有效權限
      description: 前端啟動時呼叫一次，用以建構選單與權限守衛。
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /identity-providers:
    get:
      tags: [Auth & Identity]
      operationId: listIdentityProviders
      summary: 列出租戶的身分來源（Entra ID / 地端 AD / 本地）
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/IdentityProvider' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Auth & Identity]
      operationId: createIdentityProvider
      summary: 新增身分來源
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IdentityProviderCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdentityProvider' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /identity-providers/{providerId}:
    patch:
      tags: [Auth & Identity]
      operationId: updateIdentityProvider
      summary: 修改身分來源
      description: |
        需要 `identity_provider:write`（TENANT 範圍）。

        **`code` 與 `provider_type` 不可變更。** 前者是
        `/auth/sso/{providerCode}` 的路徑鍵，後者決定必填欄位的組合
        （`ck_idp_oidc_fields` / `ck_idp_ldap_fields`）—— 換型別實際上是換一個
        來源。連同其他不可變更的欄位一起列在回應的 `meta.not_patchable_fields`。

        請求裡出現任何不可變更的欄位時，**整個請求被拒**（422），不會只忽略
        那幾個。回 200 而其中一半沒生效，管理者會以為都寫進去了。

        必填欄位的檢查對**合併後**的值進行：`{"issuer": null}` 送給一個 OIDC
        來源會被擋，錯誤訊息會說「這次修改會把其中一個清空」。

        可為 null 的欄位用 JSON `null` 表示**清空**，不提供該欄位表示不動。

        ### 回應會列出「填了但目前沒有人讀」的欄位

        `identity_providers` 在 Phase 1 幾乎整張表都還沒有消費者：抓外部目錄
        成員關係那一半不存在（沒有 LDAP／Graph 客戶端），`/auth/sso/*` 也尚未
        實作。因此填完 `issuer` 與 `client_id` 之後 SSO 仍然是 404。

        `meta.fields_with_no_consumer_yet` 列出**這次請求真的改到**的那些欄位。
        它不是免責聲明 —— 它是「你剛剛設的這幾個還不會生效」的清單。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: providerId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                name: { type: string }
                status: { type: string, enum: [ACTIVE, DISABLED, TESTING] }
                is_default:
                  type: boolean
                  description: |
                    一個租戶只能有一個預設來源（部分唯一索引
                    `uq_identity_providers_default`）。設第二個會回 409。
                jit_provisioning: { type: boolean }
                sync_enabled: { type: boolean }
                issuer: { type: [string, 'null'] }
                discovery_url: { type: [string, 'null'] }
                client_id: { type: [string, 'null'] }
                client_secret_ref:
                  type: [string, 'null']
                  description: |
                    密鑰管理服務裡的**參照名稱**，不是密鑰本身。看起來像明文
                    密鑰的值會被擋掉（它會進資料庫、備份與稽核紀錄）。
                ldap_host: { type: [string, 'null'] }
                ldap_base_dn: { type: [string, 'null'] }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/IdentityProvider' }
                  meta:
                    type: object
                    required: [fields_with_no_consumer_yet, not_patchable_fields]
                    properties:
                      fields_with_no_consumer_yet:
                        type: array
                        description: 這次請求改到、但目前沒有任何程式碼讀取的欄位。
                        items:
                          type: object
                          properties:
                            field: { type: string }
                            reason: { type: string }
                      not_patchable_fields:
                        type: array
                        items:
                          type: object
                          properties:
                            field: { type: string }
                            reason: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /identity-providers/{providerId}/test-connection:
    post:
      tags: [Auth & Identity]
      operationId: testIdentityProviderConnection
      summary: 測試身分來源的連線
      description: |
        需要 `identity_provider:write`（TENANT 範圍）—— **讀權限不夠**：
        這支端點會讓伺服器對外發出網路請求，那是一個副作用。

        目標取自**儲存的設定**，不是 request body。那本身是一層限制：要換目標
        得先 `PATCH`，而那需要 `identity_provider:write` 並留下稽核軌。

        這支端點是整個系統第一段真的去跟設定好的 IdP 說話的程式碼 ——
        在它之前，`identity_providers` 的每一個連線欄位都沒有讀者。
        它**不寫任何東西**（`meta.read_only: true`）。

        ### 出站請求的閘門

        `discovery_url` 與 `ldap_host` 都是呼叫端填的字串，因此兩條路徑都會過
        同一道閘門：強制 https（LDAP 是 host:port 檢查）、自己解析 DNS 並
        **逐一檢查每一個位址**、連線時 pin 住已檢查的那個 IP（防 DNS
        rebinding）、不跟隨轉址。任何一項不通就回一格
        `target_is_permitted: FAILED`，並在 `detail` 說出是哪一類問題。

        ### 每一種型別驗得到什麼

        | provider_type | 檢查 | 驗不到 |
        |---|---|---|
        | OIDC | discovery 文件可取得、必要端點齊全、**文件的 issuer 與設定相符**（OIDC Discovery §4.3） | — |
        | LDAP | TCP 可達、bind 憑證設定是否完整 | `ldap_bind`、`tls_handshake` |
        | SAML2 | — | `saml_metadata_fetch` |
        | LOCAL | — | `external_connection` |

        **驗不到的項目一律列在 `checks_not_performed` 並附理由**，不會偽裝成
        通過。LDAP bind 之所以驗不到有兩個獨立原因：Phase 1 沒有 LDAP 客戶端，
        而 `ldap_bind_secret_ref` 是密鑰管理服務的參照、尚無解析器 ——
        也就是說伺服器手上沒有可以 bind 的密碼。

        `result` 是 `PASSED` / `FAILED` / `NOT_TESTABLE`。
        **沒有任何檢查可做時是 `NOT_TESTABLE`，不是 `PASSED`** ——
        後者會讓「測試通過」這句話失去意義。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: providerId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: |
            測試已執行。**`200` 不代表通過** —— 結果看 `result`。
            連線失敗、位址被閘門擋下、issuer 不符都是 `200` + `FAILED`：
            那些是被測目標的狀態，不是這個請求本身的錯誤。
          content:
            application/json:
              schema:
                type: object
                required: [provider_type, result, checks, checks_not_performed, target, meta]
                properties:
                  provider_type: { type: string, enum: [OIDC, SAML2, LDAP, LOCAL] }
                  result: { type: string, enum: [PASSED, FAILED, NOT_TESTABLE] }
                  checks:
                    type: array
                    items:
                      type: object
                      required: [name, status, detail]
                      properties:
                        name: { type: string }
                        status: { type: string, enum: [PASSED, FAILED] }
                        detail: { type: string }
                  checks_not_performed:
                    type: array
                    description: |
                      **沒有做**的檢查，附理由。空陣列也照樣回 ——
                      少了這個欄位，客戶端會以為 `checks` 就是全部，
                      而對 LDAP 來說最重要的資訊正是「bind 沒有被驗證」。
                    items:
                      type: object
                      required: [name, reason]
                      properties:
                        name: { type: string }
                        reason: { type: string }
                  target:
                    description: |
                      實際要連的目標，含解析後的位址。
                      `allowed_by_private_target_allowlist` 為 true 表示這個
                      目標是私有位址、因為在部署白名單裡才通過 ——
                      那與一般的成功不同。
                    oneOf:
                      - type: 'null'
                      - type: object
                  meta:
                    type: object
                    properties:
                      read_only: { type: boolean }
                      outbound_guard: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /identity-providers/{providerId}/sync:
    post:
      tags: [Auth & Identity]
      operationId: triggerDirectorySync
      summary: 觸發目錄同步（AD 群組 → FMS 角色）
      description: |
        回傳 `202` 與 `sync_run_id`；歷程與統計用
        `GET /identity-providers/{providerId}/sync-runs` 查（原本這裡指向一支
        契約裡不存在的 path，已補上）。

        **實作上是同步完成的，仍然回 202。** 原本的描述寫「非同步作業」，
        而非同步的理由是「要連外部目錄，那很慢」—— 但 Phase 1 的對帳
        **不連 AD／Entra**：它從 `user_directory_groups`（成員關係，由 SCIM
        或未來的 connector 放進來）與 `directory_role_mappings`（規則）
        算出 `user_role_assignments`，是純集合運算、毫秒級完成。

        為一個瞬間完成的操作套一層 outbox 與 worker，只會讓「好了沒」
        多一次往返。等 LDAP／Graph connector 進來時，**抓成員關係那一半**
        才需要非同步。

        回應的 `status` 因此通常已經是 `SUCCEEDED` 或 `PARTIAL`
        —— `PARTIAL` 代表有對應被提權防護擋下（見 `DirectorySyncRun.error_summary`）。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: providerId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                run_type:
                  type: string
                  enum: [FULL, DELTA]
                  default: DELTA
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  sync_run_id: { type: string, format: uuid }
                  status: { type: string, example: RUNNING }
        '404': { $ref: '#/components/responses/NotFound' }

  /identity-providers/{providerId}/sync-runs:
    get:
      tags: [Auth & Identity]
      operationId: listDirectorySyncRuns
      summary: 同步歷程與統計
      description: |
        需要 `identity_provider:read`。

        **契約原本沒有這一支。** `POST /{id}/sync` 的說明寫著「可用
        `GET /identity-providers/{providerId}/sync-runs/{syncRunId}` 追蹤結果」
        —— 而那個 path **不存在於契約裡**。202 之後沒有下文，
        與 role-assignments、audit-export 那兩次是同一類不一致。

        回傳清單而不是單筆：值班的人要問的是「上一次同步做了什麼」，
        而他手上通常沒有 `syncRunId`。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: providerId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/DirectorySyncRun' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------------------
  # Tenancy
  # ---------------------------------------------------------------------------
  /tenant:
    get:
      tags: [Tenancy]
      operationId: getTenant
      summary: 目前租戶設定與功能開關
      description: |
        需要 `tenant:read`（TENANT 範圍 —— 這不是場域層級的資料）。

        回傳**全部**欄位，包含合約那組（方案、配額、合約期間）。讀得到自己買了
        什麼是合理的；只是改不了。`meta.read_only_fields` 逐一列出改不了的欄位
        與理由，讓前端不必自己維護一份唯讀清單 —— 那份清單會與後端分歧，
        而症狀是一個永遠回 422 的表單。
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: 租戶設定
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Tenant' }
                  meta:
                    type: object
                    properties:
                      read_only_fields:
                        type: array
                        items:
                          type: object
                          properties:
                            field: { type: string }
                            reason: { type: string }
    patch:
      tags: [Tenancy]
      operationId: updateTenant
      summary: 更新租戶設定
      description: |
        需要 `tenant:update`。

        **只有租戶自己擁有的欄位可以改**：`name`、`legal_name`、
        `default_timezone`、`default_locale`、`default_currency`、`settings`。

        合約與授權那組一律拒絕，整個請求回 `422`：

        | 欄位 | 理由 |
        |---|---|
        | `plan_tier`、`isolation_mode`、`status` | 由合約決定 |
        | `quota_api_rps`、`quota_assets`、`quota_users` | 配額由合約決定 |
        | `contract_start_date`、`contract_end_date` | 合約期間由平台方管理 |
        | `feature_flags` | 功能開關由合約決定 |
        | `id`、`code`、`industry` | 識別與開通時的設定，不可變更 |

        **`quota_assets` 可寫等於讓客戶自己解除配額上限，`plan_tier` 可寫等於
        自己升級方案。** 那些欄位的名字看起來就是「設定」，所以這條界線是刻意
        寫下來並被測試釘住的。

        **拒絕會出聲，不會靜默忽略。** 回 200 而什麼也沒改，客戶會以為設定生效
        了，然後在配額擋住他的時候回來問為什麼。錯誤指名是哪個欄位、以及為什麼
        —— 這與「不認識的欄位」（打錯字）是不同的訊息。

        `legal_name` 送 `null` 是**清空**，不送則是不動。其餘欄位不送即不動。

        `settings` 的形狀由資料庫的 `ck_tenants_settings` 驗（migration 067）：
        只認已知的鍵與型別，未知的鍵放行 —— 這個欄位會長大，每加一個鍵改一次
        migration 沒有意義。違反時回 422 並說出哪個鍵要什麼型別。
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 200 }
                legal_name:
                  type: [string, 'null']
                  description: null = 清空；不送 = 不動
                default_timezone: { type: string, maxLength: 64 }
                default_locale: { type: string, maxLength: 16 }
                default_currency:
                  type: string
                  minLength: 3
                  maxLength: 3
                  description: ISO 4217，三個大寫字母
                settings:
                  type: object
                  description: 已知的鍵見 migration 067；未知的鍵放行
      responses:
        '200':
          description: 更新後的租戶設定
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Tenant' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /organizations:
    get:
      tags: [Tenancy]
      operationId: listOrganizations
      summary: 列出組織（支援子樹查詢）
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: parent_id
          in: query
          schema: { type: string, format: uuid }
        - name: subtree_of
          in: query
          description: 回傳該組織及其所有下層（利用 ltree 子樹查詢）
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Organization' }
    post:
      tags: [Tenancy]
      operationId: createOrganization
      summary: 建立組織
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /organizations/{organizationId}:
    get:
      tags: [Tenancy]
      operationId: getOrganization
      summary: 讀取單一組織
      description: 需要 `organization:read`。軟刪除的組織回 `404`。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: organizationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 組織
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        '404': { description: 找不到這個組織 }
    patch:
      tags: [Tenancy]
      operationId: updateOrganization
      summary: 更新組織
      description: |
        需要 `organization:write`。

        **`code` 與 `parent_id` 都可以改** —— migration 001 的觸發器會在那兩者
        變動時用一個 UPDATE 把整棵子樹的 `org_path` 重編。

        **但搬到自己的後代底下會回 `422`（`code: TREE_CYCLE`）。**
        那個守衛是 migration 069 補的：在它之前這種搬移不會報錯，只會讓兩者
        互為祖先 —— 量出來的結果是

        ```
        CYC_A | CYC_A.CYC_B.CYC_A       | parent = CYC_B
        CYC_B | CYC_A.CYC_B.CYC_A.CYC_B | parent = CYC_A
        ```

        而 `<@` 從此回錯的答案（`GET /reports/group-rollup` 就是用它算集團彙總的）。
        守衛放在觸發器裡而不是這一層，因為 re-path 本身就是觸發器做的 ——
        任何寫入者都會經過它。

        `org_path` 與 `depth` 不可指定（`422`，`code: DERIVED`）：那兩個是觸發器
        從 `parent_id` 與 `code` 算出來的，手動指定會讓它們與樹的實際結構不一致。

        `parent_id`、`cost_center`、`manager_user_id` 送 `null` 是清空
        （`parent_id: null` = 升為根節點），不送是不動。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: organizationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string, maxLength: 50 }
                name: { type: string, maxLength: 200 }
                org_type:
                  type: string
                  enum: [GROUP, COMPANY, DIVISION, DEPARTMENT, TEAM, COST_CENTER]
                status: { type: string, enum: [ACTIVE, INACTIVE] }
                parent_id:
                  type: [string, 'null']
                  format: uuid
                  description: null = 升為根節點
                cost_center: { type: [string, 'null'] }
                manager_user_id: { type: [string, 'null'], format: uuid }
      responses:
        '200':
          description: 更新後的組織
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        '404': { description: 找不到這個組織 }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Tenancy]
      operationId: deleteOrganization
      summary: 刪除組織（軟刪除）
      description: |
        需要 `organization:write`。**軟刪除**（設 `deleted_at`）。

        不硬刪的理由是量出來的：`desk_assignments.org_id` 的外鍵是 `CASCADE`、
        `users.primary_org_id` 是 `SET NULL` —— 硬刪會靜默地改動別的資料，
        而回應只會是一個 204。

        **有子組織或設施時回 `409`，並把兩個數字都說出來**：子組織要先搬走
        （樹中間少一層會讓子樹查詢看到斷開的兩段），設施要先移到別的組織。
        兩者要做的處理完全不同，所以只回一個沒有內容的 409 會讓呼叫者一個一個猜。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: organizationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 已刪除
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      deleted: { type: boolean }
                  meta:
                    type: object
                    properties:
                      soft_delete: { type: boolean }
                      users_still_referencing: { type: integer }
                      why_soft: { type: string }
        '404': { description: 找不到這個組織 }
        '409': { description: 還有子組織或設施掛在上面 }

  /spatial-nodes/{nodeId}:
    get:
      tags: [Spatial & BIM]
      operationId: getSpatialNode
      summary: 讀取單一空間節點
      description: 需要該節點所在場域的 `spatial_node:read`。軟刪除的節點回 `404`。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: nodeId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 空間節點
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpatialNode' }
        '404': { description: 找不到這個空間節點 }
    patch:
      tags: [Spatial & BIM]
      operationId: updateSpatialNode
      summary: 更新空間節點
      description: |
        需要該節點所在場域的 `spatial_node:write`。

        與 `PATCH /organizations/{id}` 同一套規則：`code` 與 `parent_id` 可改
        （003 的觸發器重編整棵子樹），搬到自己的後代底下回 `422`
        （`TREE_CYCLE`，migration 069 的守衛）。

        **`facility_id` 不可變更**（`422`，`code: DERIVED`）：節點的路徑是相對於
        場域根節點的，而 re-path 觸發器用 `WHERE facility_id = NEW.facility_id`
        找子樹 —— 換場域會讓子節點留在舊場域而父節點跑到新場域，兩邊的路徑都不
        再一致。`node_path`／`depth` 同樣不可指定。

        `node_type_code` 會對 `spatial_node_types` 驗一次（那一欄沒有外鍵，
        所以打錯字不會被資料庫擋）。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: nodeId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string, maxLength: 60 }
                name: { type: string, maxLength: 200 }
                node_type_code: { type: string }
                capacity: { type: integer, minimum: 0 }
                is_bookable: { type: boolean }
                is_active: { type: boolean }
                parent_id: { type: [string, 'null'], format: uuid }
                floor_level: { type: [integer, 'null'] }
                floor_label: { type: [string, 'null'] }
                area_sqm: { type: [number, 'null'] }
                bim_element_id: { type: [string, 'null'] }
      responses:
        '200':
          description: 更新後的節點
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpatialNode' }
        '404': { description: 找不到這個空間節點 }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Spatial & BIM]
      operationId: deleteSpatialNode
      summary: 刪除空間節點（軟刪除）
      description: |
        需要該節點所在場域的 `spatial_node:write`。**軟刪除**。

        不硬刪的理由是量出來的：`spatial_nodes` 被 12 個地方參照，其中**四個是
        `CASCADE`** —— `bookable_resources`、`desk_assignments`、
        `maintenance_plans`、`visitor_access_grants`。硬刪一個房間會連帶刪掉它的
        可預約資源與保養計畫（含排程），而回應只會是一個 204。

        **三種阻擋物各自回報數字**（`409`）：子節點、未結工單、啟用中的可預約
        資源。三者要做的處理完全不同（搬走／結案／停用），所以只回一個沒有內容
        的 409 會讓呼叫者一個一個猜。

        成功時 `meta` 回報**還有什麼指著它** —— 那正是軟刪除的重點：那些東西
        沒有被連帶毀掉。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: nodeId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 已刪除
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      deleted: { type: boolean }
                  meta:
                    type: object
                    properties:
                      soft_delete: { type: boolean }
                      assets_still_referencing: { type: integer }
                      maintenance_plans_still_referencing: { type: integer }
                      why_soft: { type: string }
        '404': { description: 找不到這個空間節點 }
        '409': { description: 還有子節點、未結工單或啟用中的可預約資源 }

  /facilities:
    get:
      tags: [Tenancy]
      operationId: listFacilities
      summary: 列出目前使用者可存取的設施
      parameters:
