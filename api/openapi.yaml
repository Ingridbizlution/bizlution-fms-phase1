          application/json:
            schema: { $ref: '#/components/schemas/SpatialNodeCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpatialNode' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /uploads/presign:
    post:
      tags: [Spatial]
      operationId: presignUpload
      summary: 取得檔案直傳預簽網址
      description: |
        已登入即可。回傳一個短期有效的 `PUT` 網址與 `storage_key`，
        客戶端把檔案**直傳儲存體**，再用 `storage_key` 呼叫註冊端點
        （目前唯一的消費者是 `POST /facilities/{facilityId}/bim-models`）。

        **契約原本沒有這一支**（只在 `api/ENDPOINTS.md` 列著），
        而 BIM 註冊端點的說明指向它 —— 又一個「指向不存在的地方」。

        ## 為什麼 BIM 用直傳，而附件不用

        `POST /attachments` 是把 bytes 收進 API 再寫儲存體。對照片與 PDF
        （幾 MB）那樣做沒問題。**但一個 IFC 動輒數百 MB** ——
        塞過 API 伺服器會佔住連線好幾分鐘、吃記憶體，而逾時的失敗模式
        對客戶端只是「連線中斷」。

        ## `content_type` 是簽章的一部分

        預簽時指定的 `Content-Type` 會被簽進去，客戶端**必須**送出相同的值。
        少了它，一個把 IFC 標成 `text/html` 的上傳會被瀏覽器當網頁開啟 ——
        而那個物件是預簽可讀的。

        ## `content_length` 用來擋明顯選錯的檔案

        客戶端回報的檔案大小，超過上限（1 GiB）直接在這一步拒絕，不必等
        直傳完成、註冊失敗才知道選錯檔案。
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [file_name, content_type, content_length]
              properties:
                file_name: { type: string }
                content_type: { type: string, example: application/octet-stream }
                content_length:
                  type: integer
                  format: int64
                  description: 檔案位元組數，上限 1 GiB（1073741824）
                purpose:
                  type: string
                  enum: [BIM_MODEL]
                  default: BIM_MODEL
                  description: 決定物件鍵的前綴；目前只有 BIM 模型走直傳
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  upload_url:
                    type: string
                    description: 短期有效的 PUT 網址
                  storage_key:
                    type: string
                    description: 上傳完成後拿它去呼叫註冊端點
                  content_type:
                    type: string
                    description: 上傳時**必須**送出這個值，否則儲存體會拒絕
                  expires_in_seconds: { type: integer }
        '422': { $ref: '#/components/responses/ValidationError' }

  /spatial-node-types:
    get:
      tags: [Spatial & BIM]
      operationId: listSpatialNodeTypes
      summary: 節點型別（平台 + 租戶自訂）
      description: |
        需要 `spatial_node:read`（不指定場域 —— 型別目錄是租戶層級的）。

        `spatial_nodes.node_type_code` **沒有外鍵**，所以這支端點是客戶端唯一能
        知道「哪些值是合法的」的地方 —— 少了它，前端只能硬編一份會過期的清單。

        **`allowed_child_codes` 目前沒有任何執行者。** 後端不會擋「把 ROOM 掛在
        DESK 底下」，`POST /facilities/{id}/spatial-nodes` 也不檢查它。原樣回傳讓
        前端可以自己擋，但那不是後端的保證 ——
        `meta.allowed_child_codes_is_advisory_only` 把這件事說出來。
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: 型別清單
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        code: { type: string }
                        name: { type: string }
                        level_hint:
                          type: integer
                          description: 建議深度（SITE=0、BUILDING=1、…）
                        is_bookable: { type: boolean }
                        is_leaf_default: { type: boolean }
                        allowed_child_codes:
                          type: array
                          items: { type: string }
                          description: 僅供參考 —— 後端不強制
                        icon: { type: [string, 'null'] }
                        is_platform:
                          type: boolean
                          description: true = 平台預設（不可改）
                  meta:
                    type: object
                    properties:
                      count: { type: integer }
                      tenant_defined: { type: integer }
                      no_foreign_key_on_node_type_code: { type: boolean }
                      allowed_child_codes_is_advisory_only: { type: boolean }

  /facilities/{facilityId}/spatial-nodes:bulk-import:
    post:
      tags: [Spatial & BIM]
      operationId: bulkImportSpatialNodes
      summary: 批次匯入樓層/房間
      description: |
        需要該場域的 `spatial_node:write`。

        ## 父節點用 `parent_code` 而不是 uuid，而順序不重要

        匯入檔通常是從別的系統匯出的，裡面不會有我們的 uuid，順序也不由呼叫者
        決定。一份檔案可以這樣寫：

        ```json
        {"rows": [
          {"code": "FL03", "parent_code": "BLDG_A", "node_type_code": "FLOOR", "name": "3F"},
          {"code": "BLDG_A", "node_type_code": "BUILDING", "name": "A 棟"}
        ]}
        ```

        `FL03` 引用了還沒出現的 `BLDG_A` —— 要求呼叫者自己做拓撲排序是把問題丟
        回去。所以這裡**多趟解析**：每一趟建立所有父節點已知的列，直到沒有進展。
        剩下的回 `UNRESOLVED_PARENT` 並說明是「父節點不存在」還是「這幾列互相
        引用成環」。

        `parent_code` 也可以指向**這個場域裡既有的節點**，所以匯入檔可以掛在既有
        的樹上。

        ## `dry_run` 預設是 `true`

        與 `POST /assets:bulk-import` 同一個判斷：匯入是破壞性的，預設不寫入讓
        呼叫者先看結果。要真的寫入必須明確送 `false`。

        **dry-run 仍然跑完全部的 INSERT 再整批回捲**，所以路徑、唯一性、型別與
        循環守衛（migration 069）全都真的驗過了 —— 一份 dry-run 通過的檔案不會
        在真跑時才炸。

        ## 四個計數分開回

        `created`／`failed`／`unresolved_parent` 加上 `requested`。只回「成功 N
        筆」會讓「父節點解不開」與「撞唯一索引」混成同一件事，而那兩者要做的處理
        完全不同。

        檔案內部的 `code` 重複直接回 `422`（`DUPLICATE_IN_FILE`）——
        那與「資料庫裡已經有這個 code」是不同的錯誤。一次最多 1000 列。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: facilityId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rows]
              properties:
                dry_run: { type: boolean, default: true }
                rows:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items:
                    type: object
                    required: [code, name, node_type_code]
                    properties:
                      code: { type: string, maxLength: 60 }
                      name: { type: string, maxLength: 200 }
                      node_type_code: { type: string }
                      parent_code:
                        type: [string, 'null']
                        description: 父節點的 code；null = 場域根節點
                      floor_level: { type: [integer, 'null'] }
                      floor_label: { type: [string, 'null'] }
                      area_sqm: { type: [number, 'null'] }
                      capacity: { type: [integer, 'null'] }
                      is_bookable: { type: [boolean, 'null'] }
      responses:
        '200':
          description: 逐列結果
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        code: { type: string }
                        status:
                          type: string
                          enum: [CREATED, WOULD_CREATE, FAILED, UNRESOLVED_PARENT]
                        id: { type: string, format: uuid }
                        node_path: { type: string }
                        error: { type: string }
                        error_code:
                          type: string
                          enum: [DUPLICATE_CODE, TREE_CYCLE, DB_ERROR, UNRESOLVED_PARENT]
                  meta:
                    type: object
                    properties:
                      dry_run: { type: boolean }
                      requested: { type: integer }
                      created: { type: integer }
                      failed: { type: integer }
                      unresolved_parent: { type: integer }
                      parents_may_appear_after_children: { type: boolean }
                      dry_run_validates_everything: { type: string }
        '422': { $ref: '#/components/responses/ValidationError' }

  /facilities/{facilityId}/floor-view:
    get:
      tags: [Spatial & BIM]
      operationId: getFloorView
      summary: 逐層檢視資料（節點 + 設備 + 告警 + 幾何 + 即時佔用 + 設備連線）
      description: |
        需要該場域的 `spatial_node:read`。給樓層圖儀表板用的單一端點 ——
        每個節點已經帶好幾何、告警、即時佔用、設備連線，不需要額外拼接
        `GET /occupancy` 或 `GET /devices` 的結果。

        **沒有推播通道。** 這支端點回的是查詢當下的快照，狀態變了不會主動
        通知 —— 儀表板要自己輪詢（例如每 10-30 秒），輪詢間隔自行拿捏，
        沒有伺服器端建議值。

        **`geometry` 為 `{}` 的節點畫不出來。** 那不是「這個房間沒有形狀」，
        是還沒有人匯入過幾何（BIM 模型還在排隊解析，或這個節點本來就是
        手動建立）。`meta.nodes_without_geometry` 讓那個數字看得見，否則
        前端只會畫出一張缺了一半房間的圖而不知道為什麼。

        `worst_alarm_severity` 用 `max(severity)`，而那是**字典序**不是嚴重度序
        —— 排序或做顏色漸層請用 `worst_alarm_rank`，不要自己重新排
        `worst_alarm_severity`。

        `occupancy_state` 為 `null` 代表這個節點不是可預約資源 ——
        不是「目前沒有資料」。`device_count`／`devices_offline_count`
        不能直接相減得到在線數，見 `FloorViewNode.device_count` 的說明。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: facilityId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: floor_level
          in: query
          required: false
          schema: { type: integer }
          description: 只回這一層；省略時回全部樓層
      responses:
        '200':
          description: 逐層資料
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/FloorViewNode' }
                  meta:
                    type: object
                    properties:
                      node_count: { type: integer }
                      floors:
                        type: array
                        items: { type: integer }
                      nodes_without_geometry: { type: integer }
                      geometry_comes_from: { type: string }
                      alarm_severity_order:
                        type: array
                        items: { type: string }

  /spatial-nodes/{floorNodeId}/floor-plan-markers:
    get:
      tags: [Spatial & BIM]
      operationId: listFloorPlanMarkers
      summary: 樓層平面圖上的設備標點清單
      description: |
        需要該場域的 `spatial_node:read`。`floorNodeId` 必須是一列
        `node_type_code = 'FLOOR'` 的 `spatial_nodes`，不是任意節點——不然
        回 422。

        **平面圖影像本身不在這裡。** 樓層本身就是一個 `spatial_nodes` 列，
        影像走既有的 `GET /attachments?entity_type=SPATIAL_NODE&entity_id={floorNodeId}`
        （`purpose=FLOOR_PLAN_IMAGE`，取 `created_at` 最新一筆），這支端點
        只回「圖上哪個比例位置對到哪個設備」。

        `x_ratio`／`y_ratio` 是相對於那張平面圖影像的比例（0.0000–1.0000），
        不是真實世界座標——這不是疊在 BIM 幾何上校準，純粹是「貼圖 + 標點」。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: floorNodeId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/FloorPlanMarker' }
        '404': { description: 找不到這個空間節點 }
        '422': { description: floorNodeId 不是 FLOOR 節點 }
    post:
      tags: [Spatial & BIM]
      operationId: createFloorPlanMarker
      summary: 在樓層平面圖上新增一個設備標點
      description: |
        需要該場域的 `spatial_node:write`。`entity_type` 指向既有的資產／
        裝置／空間節點其中一種（`entity_id` 必須真的存在，否則 422）——
        這張表刻意沒有外鍵，因為指向的表依 `entity_type` 而不同。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: floorNodeId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FloorPlanMarkerCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FloorPlanMarker' }
        '404': { description: 找不到這個空間節點 }
        '422': { $ref: '#/components/responses/ValidationError' }

  /floor-plan-markers/{id}:
    delete:
      tags: [Spatial & BIM]
      operationId: deleteFloorPlanMarker
      summary: 移除一個設備標點
      description: 需要該場域的 `spatial_node:write`。只移除標點，不影響底下的資產／裝置。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 已刪除
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: string, format: uuid }
        '404': { description: 找不到這個標點 }

  /bim-models/{bimModelId}:
    get:
      tags: [Spatial & BIM]
      operationId: getBimModel
      summary: 模型詳情與解析報告
      description: |
        需要該場域的 `bim_model:read`。

        **`unresolved_elements` 是空的有兩種意思**，而 `meta.status_explanation`
        讓呼叫端分得出來：`PARSED` 之後的空陣列代表「全部都對應好了」，
        `UPLOADED` 的空陣列代表「還在排隊等解析」。

        解析是**非同步**的：獨立的 `bim-worker` 服務每 30 秒輪詢一次
        `status = 'UPLOADED'` 的模型，沒有推播通道 —— 呼叫端要輪詢這支
        端點直到 `status` 變成 `PARSED` 或 `PARSE_FAILED`。`UPLOADED` 期間
        `element_count` 與 `parse_report` 會是 0 與 `{}` —— 那不是
        「模型是空的」，是還沒輪到它。這支端點與
        `GET /bim-models/{id}/unresolved-elements` 共用同一份說明字串，
        兩者對同一個狀態的解釋不會不一樣。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: bimModelId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 模型詳情
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/BimModelDetail' }
                  meta:
                    type: object
                    properties:
                      status_explanation: { type: string }
                      awaiting_parse: { type: boolean }
        '404': { description: 找不到這個 BIM 模型 }
    delete:
      tags: [Spatial & BIM]
      operationId: deleteBimModel
      summary: 刪除模型（連同它匯入的樓層/空間/設備）
      description: |
        需要該場域的 `bim_model:write`。

        軟刪除這個模型匯入的所有樓層／空間／設備節點，再硬刪模型紀錄本身
        （`bim_models` 沒有 `deleted_at`，本來就不走軟刪除慣例）。**不動
        BUILDING 根節點**——同一場域的多個模型會共用同一個根（見
        `bim-worker` 的 `ingest.py`），刪它會波及其他模型或手動建立的空間樹。

        跟 `DELETE /spatial-nodes/{nodeId}` 同一個判斷：這個模型匯入的空間
        底下如果還有未結工單、啟用中的可預約資源、或模型範圍外手動加的子
        節點，回 `409` 並各自報數字，而不是連帶刪掉搞不清楚牽連了什麼。

        `status = PARSING` 時擋下（先等 `bim-worker` 解析完再刪）。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: bimModelId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: 已刪除 }
        '404': { description: 找不到這個 BIM 模型 }
        '409': { description: 正在解析中，或還有未結工單/啟用中的可預約資源/模型範圍外的子節點 }

  /bim-models/{bimModelId}/reset:
    post:
      tags: [Spatial & BIM]
      operationId: resetBimModel
      summary: 清掉上次匯入的資料，重新排入解析佇列
      description: |
        需要該場域的 `bim_model:write`。

        軟刪除這個模型上一輪匯入的樓層／空間／設備（判斷與擋修同
        `DELETE /bim-models/{bimModelId}`），並把 `status` 改回
        `UPLOADED`——`bim-worker` 每 30 秒輪詢一次 `status='UPLOADED'` 的
        模型，之後會自動重新解析**同一個已經上傳好的檔案**
        （`storage_key` 不變，物件還在儲存體裡，不必重新上傳）。

        用在「解析器邏輯修好了，想重新跑一次而不必重新上傳檔案」的情境。
        `ingest.py` 只做 INSERT、不是 upsert——不先清掉舊資料就直接改回
        `UPLOADED`，下一輪解析會插出重複的節點。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: bimModelId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '202':
          description: 已清空並重新排入解析佇列
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BimModel' }
        '404': { description: 找不到這個 BIM 模型 }
        '409': { description: 正在解析中，或還有未結工單/啟用中的可預約資源/模型範圍外的子節點 }

  /bim-models/{bimModelId}/mappings:
    post:
      tags: [Spatial & BIM]
      operationId: createBimMappings
      summary: 手動對應元件↔節點/設備
      description: |
        需要該場域的 `bim_model:write`。

        這是 `bim_models.mapped_node_count`、`mapped_asset_count`、
        `unresolved_elements` 的**第一個寫入者** —— 在此之前那三個欄位只有讀者。

        三件事在同一個交易裡一起做：

        1. 把 `bim_element_id` 寫到目標的節點或設備上
        2. 從 `unresolved_elements` 移除那個元件
        3. **重算**（不是遞增）兩個計數

        少了第二件，同一個元件會永遠留在待補正清單裡；少了第三件，畫面上顯示的
        「已對應 12 個」是假的。第三件用重算而不是遞增，所以計數與實際對應數
        不可能分歧。

        **目標必須在同一個場域。** 跨場域的對應會讓 floor-view 把別棟樓的設備畫進
        這一層，而那個錯誤在畫面上看起來只是「位置怪怪的」。不符的逐筆回
        `TARGET_NOT_IN_FACILITY`，其餘照樣套用（部分成功）。

        一次最多 500 筆。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: bimModelId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mappings]
              properties:
                mappings:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: object
                    required: [bim_element_id, target_type, target_id]
                    properties:
                      bim_element_id: { type: string, maxLength: 120 }
                      target_type: { type: string, enum: [SPATIAL_NODE, ASSET] }
                      target_id: { type: string, format: uuid }
      responses:
        '200':
          description: 逐筆結果
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        bim_element_id: { type: string }
                        target_type: { type: string }
                        target_id: { type: string, format: uuid }
                        ok: { type: boolean }
                        error: { type: string }
                        error_code: { type: string, enum: [TARGET_NOT_IN_FACILITY] }
                  meta:
                    type: object
                    properties:
                      requested: { type: integer }
                      applied: { type: integer }
                      rejected: { type: integer }
                      mapped_node_count: { type: integer }
                      mapped_asset_count: { type: integer }
                      unresolved_count: { type: integer }
                      counts_recomputed_from_rows: { type: string }
        '404': { description: 找不到這個 BIM 模型 }
        '422': { $ref: '#/components/responses/ValidationError' }

  /facilities/{facilityId}/bim-models:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/FacilityIdPath'
    get:
      tags: [Spatial]
      operationId: listBimModels
      summary: 列出 BIM 模型與解析狀態
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/BimModel' }
    post:
      tags: [Spatial]
      operationId: registerBimModel
      summary: 註冊已上傳的 BIM 模型
      description: |
        檔案先以 `POST /uploads/presign` 取得預簽網址直傳儲存體，
        再以本端點註冊。

        ## 解析是非同步的 —— 用輪詢追蹤進度

        本端點只負責登記，回 `202` 代表「已收下、排入解析」，**不代表解析
        已完成**。實際解析由獨立的 `bim-worker` 服務處理：每 30 秒輪詢一次
        `status = 'UPLOADED'` 的模型，用 IfcOpenShell 拆出樓層／空間／設備，
        依序把 `status` 改成 `PARSING` → `PARSED`（或失敗時 `PARSE_FAILED`，
        原因見 `parse_report`）。

        **沒有推播通道** —— 呼叫端要輪詢 `GET /bim-models/{id}` 直到
        `status` 變成 `PARSED` 或 `PARSE_FAILED`。`UPLOADED`／`PARSING`
        期間：
        * `element_count`／`mapped_node_count`／`mapped_asset_count` 都是 0
        * `unresolved_elements` 是空陣列 —— 這不代表「全部都對應好了」

        回應的 `meta.parsing` 會直說目前是哪一種狀態，避免空陣列被誤讀。

        目前只有 `source_format: IFC` 有對應的解析器。其他格式在這一步
        就會被拒絕（`422`）——過去是接受註冊、排入 `bim-worker`，等它下一輪
        輪詢（最多 30 秒）才發現不支援並標成 `PARSE_FAILED`；現在不必等
        那一輪非同步往返，註冊當下就能知道選錯格式。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BimModelCreate' }
      responses:
        '202':
          description: 已登記，排入解析（非同步 —— 輪詢 GET /bim-models/{id} 追蹤進度）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BimModel' }

  /bim-models/{bimModelId}/unresolved-elements:
    get:
      tags: [Spatial]
      operationId: listUnresolvedBimElements
      summary: 列出無法自動對應的 BIM 元件
      description: |
        用於「B1 有 2 台未識別設備」這類缺口的人工補正介面。

        `unresolved_elements` 由 `bim-worker` 解析時填寫（見
        `registerBimModel` 的非同步說明）。模型還在排隊或解析中時
        （`status` 為 `UPLOADED`／`PARSING`）這裡會回空陣列 ——
        回應的 `meta.parsing` 會說出「這個模型還沒解析完」，而不是讓
        空陣列被讀成「全部都對應好了」。

        這兩件事必須分得開：**「沒有未解析元件」與「還沒解析」是完全不同的
        狀態**，而它們的空陣列長得一模一樣。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: bimModelId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/UnresolvedBimElement' }

  # ---------------------------------------------------------------------------
  # Calendar federation（ADR-14）
  # ---------------------------------------------------------------------------
  /facilities/{facilityId}/calendar-integrations:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/FacilityIdPath'
    get:
      tags: [Calendar]
      operationId: listCalendarIntegrations
      summary: 列出這個場域的日曆整合與同步狀態
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/CalendarIntegration' }
    post:
      tags: [Calendar]
      operationId: registerCalendarIntegration
      summary: 註冊 Microsoft 365／Google Workspace 日曆整合
      description: |
        需要 `calendar_integration:write`。

        ## Microsoft 365：app-only 認證，不是每租戶各存一份密鑰

        我們註冊**一個**多租戶 Azure AD 應用，客戶的 M365 系統管理員在
        Microsoft 自己的頁面完成 admin consent（本端點的回應會附一個
        `admin_consent_url`）。**這裡沒有接那個流程的回呼**——admin consent
        完成後客戶會拿到自己的 Azure AD 租戶 id（`ms_tenant_id`），目前是由
        導入時的技術支援手動填進 `ms_tenant_id` 欄位；留空時整合會停在
        `PENDING_CONSENT`，填了才會變成 `ACTIVE`。

        Google Workspace 還沒有實作（見 `unresolved-resources`／
        `resource-mappings` 的說明），註冊會成功但同步不會真的發生。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CalendarIntegrationCreate' }
      responses:
        '201':
          description: 已建立
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalendarIntegration' }
        '409':
          description: 這個租戶／場域範圍已經有一個相同 provider 的整合
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /calendar-integrations/{integrationId}/unresolved-resources:
    get:
      tags: [Calendar]
      operationId: listUnresolvedCalendarResources
      summary: 列出外部日曆上還沒對應到任何空間節點的房間／資源
      description: |
        需要該整合所屬場域的 `calendar_integration:read`。

        **這份清單是即時算出來的，不是儲存的狀態**——呼叫外部平台的
        `list_resources`，排掉已經有生效中對應（`calendar_resource_mappings`
        的 `ACTIVE` 列）的資源，剩下的就是清單。這比先猜測寫一列再讓人改
        更貼近「不猜測建立」的原則：Phase 1 沒有做名稱自動比對（房間名稱
        不像 BIM 設備的 manufacturer/model 有明確的比對鍵），因此每一個
        對應都要透過 `resource-mappings` 手動建立。

        整合尚未 `ACTIVE`（例如還在 `PENDING_CONSENT`）時回空陣列，
        `meta.reason` 說明原因。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: integrationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        external_id: { type: string, example: room-a@contoso.com }
                        display_name: { type: string }
        '404': { description: 找不到這個日曆整合 }

  /calendar-integrations/{integrationId}/resource-mappings:
    post:
      tags: [Calendar]
      operationId: createCalendarResourceMappings
      summary: 手動對應外部房間資源 ↔ 內部空間節點
      description: |
        需要該整合所屬場域的 `calendar_integration:write`。

        每一筆建立一列 `ACTIVE` 的 `calendar_resource_mappings`。
        `sync_direction` 預設 `BIDIRECTIONAL`（FMS 推出＋拉入外部原生事件
        雙向都做），目前沒有在這支端點提供覆寫；需要單向的資源請直接
        以資料庫操作調整，之後會補上覆寫參數。

        同一個整合裡，一個外部資源或一個空間節點只能有一個生效中的對應——
        重複會回 409。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: integrationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mappings]
              properties:
                mappings:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [external_resource_id, spatial_node_id]
                    properties:
                      external_resource_id: { type: string, example: room-a@contoso.com }
                      external_resource_name: { type: string }
                      spatial_node_id: { type: string, format: uuid }
      responses:
        '200':
          description: 已建立
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      created:
                        type: array
                        items: { type: string, format: uuid }
        '404': { description: 找不到這個日曆整合，或某個 spatial_node_id 不存在 }
        '409':
          description: 這個外部資源或空間節點在這個整合裡已經有對應
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ---------------------------------------------------------------------------
  # Assets
  # ---------------------------------------------------------------------------
  /assets:
    get:
      tags: [Assets]
      operationId: listAssets
      summary: 查詢設備資產
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/FacilityIdHeader'
        - name: facility_id
          in: query
          schema: { type: string, format: uuid }
        - name: spatial_node_id
          in: query
          schema: { type: string, format: uuid }
        - name: subtree_of_node
          in: query
          description: 該空間節點及其所有子節點下的設備
          schema: { type: string, format: uuid }
        - name: category_code
          in: query
          schema: { type: string, example: AHU }
        - name: status
          in: query
          schema: { type: string }
        - name: criticality
          in: query
          schema: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL] }
        - name: has_open_work_order
          in: query
          schema: { type: boolean }
        - name: q
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Fields'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Asset' }
    post:
      tags: [Assets]
      operationId: createAsset
      summary: 建立設備資產
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssetCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Asset' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /assets/{assetId}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: assetId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Assets]
      operationId: getAsset
      summary: 取得設備詳情
      parameters:
        - name: include
          in: query
          description: 逗號分隔的關聯展開；可用 children,relations,meters,open_work_orders,maintenance_plans
          schema: { type: string, example: children,relations,meters }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Assets]
      operationId: updateAsset
      summary: 更新設備
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssetCreate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Asset' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
    delete:
      tags: [Assets]
      operationId: deleteAsset
      summary: 報廢／刪除設備（軟刪除）
      responses:
        '204': { description: No Content }
        '409':
          $ref: '#/components/responses/Conflict'

  /assets/{assetId}/dependency-graph:
    get:
      tags: [Assets]
      operationId: getAssetDependencyGraph
      summary: 取得跨系統依賴圖
      description: 回傳指定深度內的上下游依賴，供影響分析（例如 UPS 停機會影響哪些設備）。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: assetId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: depth
          in: query
          schema: { type: integer, minimum: 1, maximum: 5, default: 2 }
        - name: direction
          in: query
          schema: { type: string, enum: [upstream, downstream, both], default: both }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DependencyGraph' }

  /assets/{assetId}/meters/{meterCode}/readings:
    post:
      tags: [Assets]
      operationId: recordMeterReading
      summary: 登錄計量讀數（人工或匯入）
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: assetId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: meterCode
          in: path
          required: true
          schema: { type: string, example: LAMP_HOURS }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value, reading_at]
              properties:
                value: { type: number }
                reading_at: { type: string, format: date-time }
                source: { type: string, enum: [MANUAL, IMPORT, ESTIMATED], default: MANUAL }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  meter_code: { type: string }
                  last_value: { type: number }
                  triggered_maintenance_plan_ids:
                    type: array
                    items: { type: string, format: uuid }
    get:
      tags: [Assets]
      operationId: listAssetMeterReadings
      summary: 讀數時序
      description: |
        需要 `meter:read`。

        `POST` 那一半早就實作了，而**讀取端沒有** —— 也就是說讀數寫得進去、
        讀不回來。與遙測那次同一個形狀。

        `delta` 是與**時間上**前一筆的差值，用視窗函式在分頁之前算，
        所以頁邊界的那一筆也有值。計量表是累計值（電度、運轉時數），
        而人們要的通常是「這段期間用了多少」。

        `source` 必須看：`ESTIMATED` 的值不該拿去算合約用的用量。

        計量表必須屬於這台設備 —— 只用 `meterCode` 查的話，帶著別台設備的 id
        也會成功，路徑就變成謊言。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: assetId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: meterCode
          in: path
          required: true
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AssetMeterReading' }
                      meta:
                        type: object
                        properties:
                          meter_code: { type: string }
                          asset_meter_id: { type: string, format: uuid }
        '404': { description: 找不到這台設備的這個計量表 }

  /attribute-definitions:
    get:
      tags: [Assets]
      operationId: listAttributeDefinitions
      summary: 動態欄位定義（前端動態表單用）
      description: |
        需要 `asset:read`。依 `display_order` 排序 —— 那一欄存在就是為了讓管理者
        決定欄位在表單上的順序。

        **驗證發生在 API 層**（`meta.validated_at = "api"`），不是資料庫觸發器。
        `meta.existing_values_revalidated = false` 說出取捨：改了定義之後
        **既有的 `attributes` 不會被回溯拒絕**。

        為什麼不用資料庫約束：schema 可以隨時被管理者改，而 CHECK 只能驗當下
        那一版 —— 一次設定變更會讓歷史資料變成無法儲存的東西（任何 UPDATE
        都會撞上新約束，即使那次更新與 attributes 無關）。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: target_entity
          in: query
          schema:
            type: string
            enum: [FACILITY, SPATIAL_NODE, ASSET, ASSET_MODEL]
        - name: applies_to_type
          in: query
          schema: { type: string }
        - name: is_active
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AttributeDefinition' }
                  meta:
                    type: object
                    properties:
                      validated_at: { type: string }
                      existing_values_revalidated: { type: boolean }
    post:
      tags: [Assets]
      operationId: createAttributeDefinition
      summary: 新增動態欄位
      description: |
        需要 `tenant:update`。

        **`validation_schema` 在這裡就被編譯一次。** 存進去之後它會用來擋別人的
        請求，而一份壞掉的 schema 會讓完全正確的 `POST /assets` 收到 500 ——
        而能修它的人不在那條路徑上。

        **`default_value` 必須符合自己的 `validation_schema`** —— 不符合就是保證
        會失敗的組合：套用預設值之後立刻驗不過。

        `attribute_key` 只能用英數與底線：它會變成 `attributes` 裡的 JSON key，
        帶點或引號會讓 JSON pointer 形式的錯誤路徑無法解析。
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attribute_key, label]
              properties:
                target_entity:
                  type: string
                  enum: [FACILITY, SPATIAL_NODE, ASSET, ASSET_MODEL]
                  default: ASSET
                applies_to_type: { type: string }
                attribute_key:
                  type: string
                  pattern: '^[A-Za-z0-9_]+$'
                  maxLength: 60
                label: { type: string, maxLength: 120 }
                data_type:
                  type: string
                  enum: [STRING, TEXT, NUMBER, INTEGER, BOOLEAN, DATE, ENUM]
                  default: STRING
                is_required: { type: boolean, default: false }
                is_searchable: { type: boolean, default: false }
                default_value: {}
                validation_schema:
                  type: object
                  description: JSON Schema。POST /assets 拿它驗 attributes
                ui_hints: { type: object }
                display_order: { type: integer, default: 100 }
                is_active: { type: boolean, default: true }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
        '409': { description: 這個 target_entity 已經有同名的 attribute_key }
        '422': { $ref: '#/components/responses/ValidationError' }

  /assets/{assetId}/relations:
    post:
      tags: [Assets]
      operationId: createAssetRelation
      summary: 建立依賴關係
      description: |
        需要 `asset:write`。

        **會做循環偵測。** `/assets/{id}/dependency-graph` 已經在讀
        `asset_relations`，而 `ck_asset_relations_distinct` 只擋掉 A → A ——
        擋不掉 A → B → A，而那會讓那支圖無限展開。

        所以寫入前用遞迴 CTE 問：**從新關係的終點出發，走得回起點嗎**。
        走得回去就是循環，回 409 並說出「走幾步回到起點」。

        深度上限 **32**。真實的設施依賴鏈是「市電 → 主配電 → 分配電 → UPS →
        機櫃 → 設備」那種個位數量級，撞到 32 幾乎一定表示資料有問題。
        回應的 `meta.chain_depth` 讓管理者看得出自己離上限多遠。

        遞迴的深度條件不只是限制，也是**停止條件** —— 少了它，資料庫裡
        既有的循環會讓那個查詢自己無限跑。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: assetId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to_asset_id]
              properties:
                to_asset_id: { type: string, format: uuid }
                relation_type:
                  type: string
                  enum: [DEPENDS_ON, FEEDS, BACKUP_OF, CONTROLS, REDUNDANT_WITH]
                  default: DEPENDS_ON
                impact_level:
                  type: string
                  enum: [LOW, MEDIUM, HIGH, CRITICAL]
                  default: MEDIUM
                notes: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  from_asset_id: { type: string, format: uuid }
                  to_asset_id: { type: string, format: uuid }
                  relation_type: { type: string }
                  meta:
                    type: object
                    properties:
                      chain_depth: { type: integer }
                      max_depth: { type: integer }
        '404': { description: 兩端的設備都必須存在且在你的範圍內 }
        '409': { description: 會形成循環，或鏈深超過上限，或關係已存在 }
        '422': { $ref: '#/components/responses/ValidationError' }

  /asset-relations/{relationId}:
    delete:
      tags: [Assets]
      operationId: deleteAssetRelation
      summary: 移除依賴關係
      description: |
        需要 `asset:write`。**硬刪除** —— 依賴關係是當前的拓樸描述，不是歷史
        事件。軟刪除會讓 `dependency-graph` 每次都要過濾 `deleted_at`，
        而漏一次就會顯示已經拆掉的依賴。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: relationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: 已移除 }
        '404': { description: 找不到這條關係（或它不在你的範圍內） }

  /assets:bulk-import:
    post:
      tags: [Assets]
      operationId: bulkImportAssets
      summary: 批次匯入設備（含試跑模式）
      description: |
        需要 `asset:write`。單次上限 **500** 列。

        **`dry_run` 預設 `true`。** 匯入是不可逆的批次寫入，所以預設值站在安全
        那一邊 —— 要真的寫入必須明說 `dry_run: false`。

        **試跑走完全相同的路徑，只是最後回捲整個交易。** 預覽與真跑各寫一份
        驗證的話，「預覽通過而真跑失敗」正是它要防的事。走同一條路讓預覽也抓得到
        **批次內部的重複**（同一批裡兩列用同樣的 `asset_code`）—— 那種衝突是
        逐列驗證抓不到的，它只在第二列真的寫進去時才出現。

        試跑的 `outcome` 是 `WOULD_CREATE` 而不是 `CREATED`：呼叫端把回應存下來
        當紀錄時，那兩個字的差別就是「這件事發生了」與「這件事會發生」。
        而 `meta.ids_are_provisional` 說明那些 `asset_id` 是回捲掉的、不能拿去用。

        **逐列 savepoint。** 一個交易裡某一筆 SQL 失敗會讓整個交易進入 aborted
        狀態，後面每一筆都會拿到 `current transaction is aborted` ——
        少了它，「500 列裡有 3 列分類代碼打錯」會變成 497 列好資料一起被丟掉。

        `error_code` 讓呼叫端能自動分類：`CATEGORY_NOT_FOUND` 要修檔案，
        `DUPLICATE_ASSET_CODE` 可能可以忽略。
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rows]
              properties:
                dry_run:
                  type: boolean
                  default: true
                  description: 預設 true —— 要真的寫入必須明說 false
                rows:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: object
                    required: [asset_code, name, facility_id, category_code]
                    properties:
                      asset_code: { type: string }
                      name: { type: string }
                      facility_id: { type: string, format: uuid }
                      category_code: { type: string }
                      spatial_node_code: { type: string }
                      model_id: { type: string, format: uuid }
                      status: { type: string }
                      criticality: { type: string }
                      attributes: { type: object }
      responses:
        '200':
          description: OK（試跑與真跑都是 200，差別在 dry_run 與 outcome）
          content:
            application/json:
              schema:
                type: object
                properties:
                  dry_run: { type: boolean }
                  total: { type: integer }
                  accepted: { type: integer }
                  rejected: { type: integer }
                  rows:
                    type: array
                    items:
                      type: object
                      properties:
                        index: { type: integer }
                        asset_code: { type: [string, 'null'] }
                        outcome:
                          type: string
                          enum: [CREATED, WOULD_CREATE, REJECTED]
                        asset_id: { type: [string, 'null'], format: uuid }
                        error_code: { type: [string, 'null'] }
                        error: { type: [string, 'null'] }
                  meta:
                    type: object
                    properties:
                      ids_are_provisional:
                        type: boolean
                        description: true 時 asset_id 是回捲掉的，不能拿去用
                      limit: { type: integer }
        '422': { $ref: '#/components/responses/ValidationError' }

  /asset-categories:
    get:
      tags: [Assets]
      operationId: listAssetCategories
      summary: 設備分類樹
      description: |
        需要 `asset:read`。分類沒有場域維度（它是一份目錄），所以場域管理員也查得到。

        **回扁平清單 + `category_path`／`depth`，不是嵌套的 JSON 樹。** 理由與
        `/facilities/{id}/spatial-nodes` 的 `view=flat|tree` 相同：扁平加路徑讓
        前端自己決定要畫樹還是清單，而嵌套結構在過濾之後會殘缺
        （父節點被過濾掉時子節點就沒有地方掛）。

        `asset_count` 算的是**含子分類**的設備數（ltree 的 `<@`）——
        「空調」底下的設備應該計入「空調」，否則中間層永遠是 0 而看起來像沒人用。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: domain
          in: query
          schema: { type: string }
        - name: is_active
          in: query
          schema: { type: boolean }
        - name: subtree_of
          in: query
          description: 只回這個節點的子樹（含自己）
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AssetCategory' }

  /asset-models/{modelId}/compatibility:
    get:
      tags: [Assets]
      operationId: getAssetModelCompatibility
      summary: 相容性檢查結果
      description: |
        需要 `asset_model:read`。

        **沒有相容性表。** 這支端點做的是把型錄上的兩個字串陣列拿去對現實：

        * `spare_part_codes` → `parts.part_code` 存不存在
        * `supported_protocols` → 這個租戶的閘道實際講哪些協定

        兩者都是**無外鍵的宣告**，所以都可能指向不存在的東西。量過示範資料：
        4 個型號裡 **2 個宣告了不存在的備品代碼** —— 而技師是在要叫料的時候
        才會發現。這與 `alarm_rules.notify_role_codes`、
        `maintenance_templates.required_skill_codes` 是同一個問題。

        `protocols[].gateway_available` 在**還沒有裝任何閘道**時是 `null`
        而不是 `false` —— 那不是型號的問題。`meta.gateways_configured` 說出是
        哪一種情況。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: modelId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  model:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      model_no: { type: string }
                      name: { type: string }
                  spare_parts:
                    type: array
                    items:
                      type: object
                      properties:
                        part_code: { type: string }
                        exists: { type: boolean }
                        part_id: { type: [string, 'null'], format: uuid }
                  protocols:
                    type: array
                    items:
                      type: object
                      properties:
                        protocol: { type: string }
                        gateway_available:
                          type: [boolean, 'null']
                          description: null = 還沒有裝任何閘道（不是不相容）
                  meta:
                    type: object
                    properties:
                      spare_parts_declared: { type: integer }
                      spare_parts_missing:
                        type: integer
                        description: 這個數字是這支端點的重點
                      gateways_configured: { type: boolean }
                      complete: { type: boolean }
        '404': { description: 找不到這個型號 }

  /assets/{assetId}/work-orders:
    get:
      tags: [Assets]
      operationId: listAssetWorkOrders
      summary: 設備維修履歷
      description: |
        需要 `work_order:read`。依 `created_at` 遞減 —— 問這個問題的人要看的是
        「最近修過什麼」。

        成本欄位一併回傳，因為「這台機器今年花了多少」是履歷最常被問的衍生問題，
        而它們已經在 `work_orders` 上（由 `recompute_costs` rollup，
        來源是 `/work-orders/{id}/labor` 與 `/parts` 的明細列）。

        看不到的設備回 **404 而不是空清單** —— 後者與「這台機器沒修過」無法區分。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: assetId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AssetWorkOrderHistoryRow' }
        '404': { description: 找不到這台設備（或它不在你的範圍內） }

  /assets/{assetId}/status-history:
    get:
      tags: [Assets]
      operationId: listAssetStatusHistory
      summary: 狀態變更歷程
      description: |
        需要 `asset:read`。

        **這張表在 migration 064 之前是 0 列、0 寫入者。** 設備狀態改變發生在
        多條路徑上（人工 `PATCH /assets/{id}`、`sql/030` 的計量規則、
        未來的告警自動降級），而沒有一條寫歷程。照契約做而不補寫入者的話，
        這支端點會永遠回空清單 —— 而它看起來會像「這台設備從來沒有故障過」。

        064 用**觸發器**補上（綁在 `assets.status` 欄位、只記真的變化）。
        用觸發器而非各個 handler：每條路徑各自記的話，漏掉一條的症狀是
        「那一類狀態變更查不到」，而歷程的用途正是回答
        「這台機器什麼時候開始出問題的」。

        **`changed_by` 為 null 代表系統依規則自動改的**（例如計量規則把設備降為
        DEGRADED），不是缺漏 —— 那與「某個人手動改的」是不同的事實。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: assetId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AssetStatusChange' }
        '404': { description: 找不到這台設備（或它不在你的範圍內） }

  /asset-models:
    get:
      tags: [Assets]
      operationId: listAssetModels
      summary: 查詢設備型錄（平台共用 + 租戶自建）
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: category_code
          in: query
          schema: { type: string }
        - name: manufacturer
          in: query
          schema: { type: string }
        - name: scope
          in: query
          schema: { type: string, enum: [all, platform, tenant], default: all }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AssetModel' }
    post:
      tags: [Assets]
      operationId: createAssetModel
      summary: 新增租戶型錄
      description: |
        需要 `asset_model:write`。

        **`spare_part_codes` 會被驗證存在。** 那一欄是無外鍵的字串陣列，
        用途是「這台機器要叫哪些料」—— 指向不存在的料件代碼等於沒有那個宣告，
        而技師是在要叫料的時候才發現。量過示範資料：4 個型號裡 2 個有這個問題。

        **既有那 2 筆不動** —— 它們是示範資料，而
        `GET /asset-models/{id}/compatibility` 正是用來把它們找出來的。
        在建立端點回溯清理會讓那支端點沒有東西可報。
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category_id, manufacturer, model_no, name]
              properties:
                category_id: { type: string, format: uuid }
                manufacturer: { type: string, maxLength: 120 }
                model_no: { type: string, maxLength: 120 }
                name: { type: string, maxLength: 200 }
                description: { type: string }
                specifications: { type: object }
                supported_protocols:
                  type: array
                  items:
                    type: string
                    enum: [MQTT, HTTP, MODBUS_TCP, BACNET_IP, OPC_UA, SNMP]
                power_rating_w: { type: integer, exclusiveMinimum: 0 }
                expected_life_months: { type: integer, exclusiveMinimum: 0 }
                mtbf_hours: { type: integer, exclusiveMinimum: 0 }
                spare_part_codes:
                  type: array
                  items: { type: string }
                  description: 必須存在於 parts 目錄
                documentation_urls: { type: object }
                is_active: { type: boolean, default: true }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
        '409': { description: 這個製造商 + 型號已經在型錄裡了 }
        '422': { $ref: '#/components/responses/ValidationError' }


  # ---------------------------------------------------------------------------
  # Maintenance
  # ---------------------------------------------------------------------------
  /maintenance-templates:
    get:
      tags: [Maintenance]
      operationId: listMaintenanceTemplates
      summary: 保養範本
      description: |
        需要 `maintenance_plan:read`。範本是一份**程序**（檢查項、預估工時、
        需要的證照），沒有場域維度，所以場域管理員也查得到。

        `plan_count = 0` 代表這份範本建了沒人用 —— 不是錯誤，但值得看得見。
        `unused_only=true` 一次問出來。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: maintenance_type
          in: query
          schema:
            type: string
            enum: [PREVENTIVE, INSPECTION, CALIBRATION, DEEP_CLEAN, STATUTORY, PREDICTIVE]
        - name: is_active
          in: query
          schema: { type: boolean }
        - name: applies_to_category_id
          in: query
          schema: { type: string, format: uuid }
        - name: unused_only
          in: query
          description: 只回傳沒有任何計畫在用的範本
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/MaintenanceTemplate' }
    post:
      tags: [Maintenance]
      operationId: createMaintenanceTemplate
      summary: 建立範本
      description: |
        需要 `maintenance_template:write`。

        **`checklist` 不能是空的。** 沒有檢查項的範本產出的工單，被簽掉時
        沒有人知道實際做了什麼 —— 而 PM 的價值就在那張清單上。

        **`required_skill_codes` 會被驗證存在。** 那一欄在此之前只有 seed
        寫過、零讀者。指向不存在技能的必要條件等於沒有那個條件。

        誠實記下缺口：**驗了代碼存在，沒有驗執行者真的持有那張證照**。
        `/users/{id}/skills` 已經讓到期看得見（migration 059），
        派工時擋下過期的人是另一件事，尚未實作。
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name, checklist]
              properties:
                code: { type: string, maxLength: 50 }
                name: { type: string, maxLength: 200 }
                description: { type: string }
                applies_to_category_id: { type: string, format: uuid }
                applies_to_model_id: { type: string, format: uuid }
                maintenance_type:
                  type: string
                  enum: [PREVENTIVE, INSPECTION, CALIBRATION, DEEP_CLEAN, STATUTORY, PREDICTIVE]
                  default: PREVENTIVE
                checklist:
                  type: array
                  minItems: 1
                  description: 檢查項。不能是空的
                  items: { type: object }
                estimated_minutes:
                  type: integer
                  minimum: 1
                  maximum: 10080
                  default: 60
                required_skill_codes:
                  type: array
                  items: { type: string }
                  description: 必須存在於 /skills 目錄
                required_part_codes:
                  type: array
                  items: { type: string }
                safety_notes: { type: string }
                requires_permit: { type: boolean, default: false }
                requires_shutdown: { type: boolean, default: false }
                is_active: { type: boolean, default: true }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaintenanceTemplate' }
        '409': { description: 這個 code 已被使用 }
        '422': { $ref: '#/components/responses/ValidationError' }

  /maintenance-plans/{planId}:
    patch:
      tags: [Maintenance]
      operationId: updateMaintenancePlan
      summary: 更新計畫
      description: |
        需要 `maintenance_plan:write`。沒帶的欄位不動。

        **`facility_id`、`template_id`、`trigger_type` 不可改** —— 那三者變更
        會讓既有的占位與工單失去意義（占位的唯一鍵含 `plan_id`，
        而觸發型別決定 `next_due_at` 的意義）。要換就建新計畫並停用舊的。

        改 `rrule` 會一併重算 `next_due_at` —— 留著舊值會讓計畫按舊排程
        再產生一次，而使用者以為自己已經改掉了。

        **改 `completion_grace_days` 會改變過去的數字。** 合規報表是即時算的，
        所以把容許窗從 0 改成 7 之後，上個月的準時率會跟著上升。那是刻意的：
        另一種做法（把容許窗快照到每一筆 occurrence）會讓政策變更無法回溯
        套用，而管理者改設定的目的通常正是想重新評估現況。報表的 `meta`
        始終會回報實際使用的容許窗，所以數字是可解釋的。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: planId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 200 }
                rrule: { type: string }
                meter_code: { type: string }
                meter_threshold: { type: number }
                generate_lead_days: { type: integer, minimum: 0, maximum: 365 }
                completion_grace_days:
                  type: integer
                  minimum: 0
                  maximum: 365
                  description: 完工容許窗。法定年檢 0，月保養 7
                priority:
                  type: string
                  enum: [LOW, MEDIUM, HIGH, URGENT, CRITICAL]
                assigned_team_id: { type: string, format: uuid }
                sla_policy_id: { type: string, format: uuid }
                is_active: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/MaintenancePlan' }
        '404': { description: 找不到這個計畫（或它不在你的範圍內） }
        '422': { $ref: '#/components/responses/ValidationError' }

  /maintenance-plans/{planId}/generate-now:
    post:
      tags: [Maintenance]
      operationId: generateMaintenanceNow
      summary: 立即產生下一張工單
      description: |
        需要 `maintenance_plan:write`。

        **與排程掃描走同一條路徑**（`generator::generate_for`），不是另寫一份
        —— 各寫一份的話手動產生的工單會與自動產生的在某個細節上不同
        （占位、SLA、瞄準的設備清單），而那種差異只在事後對帳時才看得出來。

        **排定時刻用計畫的 `next_due_at`，不是「現在」。** 這一點是合規判定的
        關鍵：occurrence 的 `scheduled_for` 就是準時與否的基準，若填「現在」，
        一個逾期三週才想起來要做的保養按下這個按鈕就會變成準時 ——
        而那個合規率是拿去談合約的。

        冪等由占位的唯一鍵保證（`(plan, asset, scheduled_for)`）：連按兩次不會
        產生兩張工單，第二次的 `created` 是 0。

        瞄準多台設備時會產生多張工單（每台一張）—— 回傳 `work_order_ids`。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: planId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  created: { type: integer }
                  work_order_ids:
                    type: array
                    items: { type: string, format: uuid }
                  occurrence_ids:
                    type: array
                    items: { type: string, format: uuid }
                  skipped:
                    type: integer
                    description: 因占位已存在而跳過的數量（冪等）
                  scheduled_for: { type: string, format: date-time }
                  meta:
                    type: object
                    properties:
                      scheduled_for_source: { type: string }
        '404': { description: 找不到這個計畫 }
        '409': { description: 計畫已停用，或沒有 next_due_at 可用 }

  /maintenance-occurrences:
    get:
      tags: [Maintenance]
      operationId: listMaintenanceOccurrences
      summary: 排程執行紀錄（PM 合規率來源）
      description: |
        需要 `maintenance_plan:read`。

        **`status` 永遠不會是 `MISSED`。** 004 的 CHECK 允許那個值，但沒有
        任何東西寫它，而那是刻意的：「保養沒做」是一件**沒有發生**的事 ——
        沒有時刻、沒有行為者。存它需要有人定期去寫，而那個人不存在。

        所以 `is_missed` 是算出來的（`scheduled_for + 計畫的容許窗` 對比
        資料庫的現在）。要問「哪些保養沒做」請用 `missed_only=true`，
        **不要**用 `status=MISSED`（那會回空清單）。

        `grace_days` 與 `deadline` 一併回傳，否則前端無法解釋「為什麼這筆算逾時」。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: facility_id
          in: query
          schema: { type: string, format: uuid }
        - name: plan_id
          in: query
          schema: { type: string, format: uuid }
        - name: asset_id
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          description: 逗號分隔的**儲存**狀態
          schema: { type: string, example: PLANNED,GENERATED }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: missed_only
          in: query
          description: 只回傳算出來是漏做的
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/MaintenanceOccurrence' }

  /maintenance-occurrences/{occurrenceId}/skip:
    post:
      tags: [Maintenance]
      operationId: skipMaintenanceOccurrence
      summary: 跳過本次（需理由）
      description: |
        需要 `maintenance_plan:write`。

        **`reason` 為必填。** 跳過的期次會從合規率的分母裡拿掉，
        而一個沒有理由的排除等於把數字調好看。理由會進
        `/reports/pm-compliance` 的 `skip_reasons` 分佈 ——
        那是「全部跳過卻得到 100%」時唯一能解釋的東西。

        **已完成的期次不能改成跳過**（409）—— 那會把一件做過的事從分母裡
        拿掉。判定是條件式 `UPDATE`（`WHERE status IN ('PLANNED','GENERATED')`），
        不是先讀再寫：後者在並發下擋不住。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: occurrenceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 200 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaintenanceOccurrence' }
        '404': { description: 找不到這筆排程紀錄 }
        '409': { description: 已完成或已跳過，不能再改 }
        '422': { $ref: '#/components/responses/ValidationError' }

  /maintenance-plans:
    get:
      tags: [Maintenance]
      operationId: listMaintenancePlans
      summary: 列出預防性維護計畫
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: facility_id
          in: query
          schema: { type: string, format: uuid }
        - name: trigger_type
          in: query
          schema: { type: string, enum: [CALENDAR, METER, CONDITION, HYBRID] }
        - name: due_before
          in: query
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/MaintenancePlan' }
    post:
      tags: [Maintenance]
      operationId: createMaintenancePlan
      summary: 建立預防性維護計畫
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MaintenancePlanCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaintenancePlan' }

  /maintenance-plans/{planId}/preview-schedule:
    get:
      tags: [Maintenance]
      operationId: previewMaintenanceSchedule
      summary: 試算未來排程（不寫入）
      description: 讓管理員在啟用計畫前確認 RRULE 展開結果，避免產生大量錯誤工單。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: planId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: until
          in: query
          schema: { type: string, format: date }
        - name: limit
          in: query
          schema: { type: integer, default: 12, maximum: 100 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        scheduled_for: { type: string, format: date-time }
                        asset_id: { type: string, format: uuid }
                        asset_code: { type: string }

  # ---------------------------------------------------------------------------
  # Service catalogue
  # ---------------------------------------------------------------------------
  /facilities/{facilityId}/service-items:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/FacilityIdPath'
    get:
      tags: [Service Catalogue]
      operationId: listServiceItems
      summary: 列出可申請的軟性服務
      description: |
        回應中的 `form_schema` 為標準 JSON Schema，前端據此動態渲染表單，
        並以相同 schema 在送出前做前端驗證；伺服端會再驗一次。
      parameters:
        - name: category
          in: query
          schema: { type: string, example: CATERING }
        - name: attachable_to_reservation
          in: query
          schema: { type: boolean }
        - name: standalone_only
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ServiceItem' }

  # ---------------------------------------------------------------------------
  # Work orders
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # Attachments
  #
  # 本節是後補的：原契約定義了 `Attachment` schema 並在
  # `WorkOrderDetail.attachments` 與 `WorkOrderCreate.attachment_ids` 引用它，
  # 卻沒有任何端點能產生附件 —— 客戶端被要求提供 attachment_ids，
  # 但拿不到 id。以下是讓那兩個既有欄位可用的最小端點集。
  # ---------------------------------------------------------------------------
    post:
      tags: [Service Catalogue]
      operationId: createServiceItem
      summary: 建立服務項目
      description: |
        需要 `service_item:write`（路徑上的場域）。

        `applies_to_all_facilities: true` 會把 `facility_id` 存成 NULL（全租戶
        適用）。**路徑上的場域仍然是權限判定的依據** —— 建立一個全租戶生效的
        項目只需要某一個場域的 `service_item:write`，那是既有權限模型的邊界
        （該權限是 FACILITY 範圍），不是漏檢查。回應的
        `meta.authorized_via_facility` 把用了哪個場域說出來。

        兩條有實質內容的驗證：

        * **`chargeable` 為 true 時 `unit_price` 與 `currency` 必填。**
          可收費但沒有單價會產出一張金額不明的帳單，而症狀出現在對帳的時候。
        * **`is_attachable_to_reservation` 與 `is_standalone_requestable`
          不能同時為 false。** 那樣建出來的項目沒有任何入口可以申請 ——
          它不是設定錯誤，是一個沒有用的列。

        `code` 在「同一場域（或全場域範圍）」內唯一，而**停用的項目不佔用它**
        （唯一索引帶 `WHERE deleted_at IS NULL`）。重複時回 `409`。

        `availability` 的形狀見 `GET /service-items/{id}/availability`。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: facilityId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category, code, name]
              properties:
                category:
                  type: string
                  enum: [CLEANING, CATERING, IT_SUPPORT, ROOM_SETUP, SECURITY,
                         MOVING, WASTE, LANDSCAPING, AV_SUPPORT, RECEPTION, OTHER]
                code: { type: string, maxLength: 50 }
                name: { type: string, maxLength: 200 }
                description: { type: [string, 'null'] }
                lead_time_minutes: { type: integer, minimum: 0, default: 0 }
                default_duration_minutes: { type: integer, minimum: 1, default: 30 }
                relative_offset_minutes:
                  type: integer
                  default: 0
                  description: 相對於所附掛預約的位移；-15 = 會議前 15 分鐘開始
                is_attachable_to_reservation: { type: boolean, default: true }
                is_standalone_requestable: { type: boolean, default: true }
                requires_approval: { type: boolean, default: false }
                approver_role_code: { type: [string, 'null'] }
                chargeable: { type: boolean, default: false }
                unit_price: { type: [number, 'null'] }
                currency: { type: [string, 'null'], minLength: 3, maxLength: 3 }
                unit_label: { type: [string, 'null'] }
                max_quantity: { type: [integer, 'null'], minimum: 1 }
                form_schema: { type: object }
                availability: { type: object }
                icon: { type: [string, 'null'] }
                display_order: { type: integer, default: 100 }
                applies_to_all_facilities: { type: boolean, default: false }
      responses:
        '201':
          description: 已建立
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ServiceItemAdmin' }
                  meta:
                    type: object
                    properties:
                      applies_to_all_facilities: { type: boolean }
                      authorized_via_facility: { type: string, format: uuid }
        '409': { description: code 重複 }
        '422': { $ref: '#/components/responses/ValidationError' }

  /attachments:
    get:
      tags: [Attachments]
      operationId: listAttachments
      summary: 列出某個實體的附件
      description: 附件是子資源、數量有界，因此不分頁。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: entity_type
          in: query
          required: true
          schema: { type: string, enum: [WORK_ORDER, ASSET, SPATIAL_NODE, RESERVATION] }
        - name: entity_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: purpose
          in: query
          schema: { type: string, example: BEFORE_PHOTO }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Attachment' }
    post:
      tags: [Attachments]
      operationId: createAttachment
      summary: 上傳附件
      description: |
        位元組直接經 API 上傳（Phase 1）。bucket 為私有，下載一律走預簽網址。
        大型檔案（BIM 模型）應改用預簽 PUT，見 ADR 與 `storage` 模組說明。

        權限沿用「修改所屬實體」的權限：例如掛在工單上需要 `work_order:update`。
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [entity_type, entity_id, file]
              properties:
                entity_type:
                  type: string
                  enum: [WORK_ORDER, ASSET, SPATIAL_NODE, RESERVATION]
                entity_id: { type: string, format: uuid }
                purpose: { type: string, default: GENERAL, example: AFTER_PHOTO }
                file: { type: string, format: binary }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attachment' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /attachments/{attachmentId}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: attachmentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Attachments]
      operationId: getAttachment
      summary: 取得附件（重新產生預簽網址）
      description: 預簽網址短期有效；過期後以本端點便宜地再取一個，不必重拉整份詳情。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attachment' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Attachments]
      operationId: deleteAttachment
      summary: 刪除附件
      description: 資料列軟刪除（保留稽核軌跡），物件實際刪除。
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /work-order-statuses:
    get:
      tags: [Work Orders]
      operationId: listWorkOrderStatuses
      summary: 狀態字典（含中英文與分類）
      description: |
        只需要登入。這是字典，客戶端要靠它把狀態碼翻成人看得懂的字 ——
        不擋權限的理由與 `GET /permissions` 相同：知道有哪些狀態不洩漏任何資料。

        `is_terminal` 是**終態的唯一定義**，報表的「未結工單」分母讀的是同一欄。
        客戶端不該自己硬編一份終態清單。
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: 狀態字典
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        code: { type: string }
                        name_zh: { type: string }
                        name_en: { type: string }
                        category:
                          type: string
                          enum: [OPEN, IN_PROGRESS, WAITING, TERMINAL]
                        is_terminal: { type: boolean }
                        display_order: { type: integer }
                  meta:
                    type: object
                    properties:
                      terminal_source: { type: string }
                      count: { type: integer }

  /work-order-state-machine:
    get:
      tags: [Work Orders]
      operationId: getWorkOrderStateMachine
      summary: 狀態機定義（供前端繪流程圖）
      description: |
        需要 `work_order:read`。這是 migration 008 的
        `work_order_transitions_allowed` **第一次對外可讀** —— 在此之前只有
        `apply_side_effects` 讀它。

        ## 每個 side effect 都標上 `executed`

        規則宣告了七個 side effect key，而應用層只執行三個
        （`increment_reopen`、`release_assignee`、`request_satisfaction`）。
        其餘四個（`notify`、`compute_sla`、`update_asset_status`、
        `release_reservation_step`）是**惰性的宣告**。

        這支端點的用途是繪流程圖，所以那個差別不能被抹掉：一份把惰性宣告畫成
        實際行為的圖，會讓看圖的人以為結案時系統會自動改設備狀態。
        `meta.executed_side_effects` 是權威清單，`meta.declared_but_inert` 列出
        宣告了但不會發生的。

        `required_permission` 為 `null` 代表**系統驅動的動作**
        （`AUTO_ASSIGN`、`BREACH_SLA`）—— 那不是「任何人都能做」，
        對外 API 會拒絕它們。

        `required_permission` 與 `required_fields` 兩欄在資料庫端是惰性的
        （004 的欄位註解就這樣寫），檢查由應用層執行。任何不經本 API 的呼叫者
        會繞過那兩關，`meta.checks_are_applied_by` 把這件事說出來。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: work_order_type
          in: query
          required: false
          schema: { type: string }
          description: 只回這個型別適用的轉換（含 work_order_type 為 null 的通用規則）
      responses:
        '200':
          description: 狀態機定義
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        work_order_type: { type: [string, 'null'] }
                        is_tenant_override:
                          type: boolean
                          description: true = 這個租戶自訂的規則，不是平台預設
                        from_status: { type: string }
                        from_status_name: { type: string }
                        action: { type: string }
                        to_status: { type: string }
                        to_status_name: { type: string }
                        to_is_terminal: { type: boolean }
                        required_permission: { type: [string, 'null'] }
                        required_fields:
                          type: array
                          items: { type: string }
                        side_effects:
                          type: array
                          items:
                            type: object
                            properties:
                              key: { type: string }
                              value: {}
                              executed:
                                type: boolean
                                description: false = 規則宣告了但系統不會做
                  meta:
                    type: object
                    properties:
                      transition_count: { type: integer }
                      executed_side_effects:
                        type: array
                        items: { type: string }
                      declared_but_inert:
                        type: array
                        items: { type: string }
                      checks_are_applied_by: { type: string }

  /work-orders:bulk-transition:
    post:
      tags: [Work Orders]
      operationId: bulkTransitionWorkOrders
      summary: 批次派工／批次結案
      description: |
        需要 `work_order:assign`，**而每一筆仍然要通過那一條轉換自己的
        `required_permission`** —— 批次不是繞過個別權限的後門。單筆與批次走
        同一個內部函式，所以那件事在結構上不可能分歧。

        **部分成功。** 對 50 張工單做同一個動作、其中三張狀態不對時：整批回滾會讓
        另外 47 張白做；整批回 200 而不說哪三張失敗，使用者會以為全部成功。
        所以每一筆一個 savepoint，回傳**逐筆結果**加上三個計數
        （`succeeded`／`failed`／`partial_success`）。

        重複的 id 直接回 `422`：第二次一定會因為狀態已變而失敗，而那個失敗
        看起來像一個真的錯誤。一批上限 200 筆。
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [work_order_ids, action]
              properties:
                work_order_ids:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items: { type: string, format: uuid }
                action: { type: string }
                fields:
                  type: object
                  description: 套用到每一筆的欄位（例如 assignee_id）
      responses:
        '200':
          description: 逐筆結果
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        work_order_id: { type: string, format: uuid }
                        ok: { type: boolean }
                        to_status: { type: string }
                        error: { type: string }
                        error_code: { type: string }
                  meta:
                    type: object
                    properties:
                      requested: { type: integer }
                      succeeded: { type: integer }
                      failed: { type: integer }
                      partial_success: { type: boolean }
                      per_item_permission_still_checked: { type: boolean }
        '422': { $ref: '#/components/responses/ValidationError' }

  /teams:
    get:
      tags: [Work Orders]
      operationId: listTeams
      summary: 團隊與成員
      description: |
        需要 `team:read`。`facility_id` 為 `null` 的團隊是全租戶共用的
        （004 的註解），所以查某個場域時那些團隊也會回。

        `meta.teams_without_members` 讓「空團隊」看得見 —— 一個沒有成員的團隊
        派不了工，而它在畫面上與有人的團隊長得一樣。

        `dispatch_rule.strategy` 宣告了 `ROUND_ROBIN`／`LEAST_LOADED`／
        `SKILL_MATCH`，而**沒有任何程式碼讀它**：派工目前是手動指定
        `assignee_id`。原樣回傳，但 `meta.dispatch_rule_is_not_yet_applied`
        說出它不是行為。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: facility_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: include_inactive
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: 團隊清單
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Team' }
                  meta:
                    type: object
                    properties:
                      count: { type: integer }
                      teams_with_members: { type: integer }
                      teams_without_members: { type: integer }
                      dispatch_rule_is_not_yet_applied: { type: boolean }

  /teams/{teamId}/workload:
    get:
      tags: [Work Orders]
      operationId: getTeamWorkload
      summary: 團隊負載（派工決策用）
      description: |
        需要 `team:read`。

        **分母是「未結」而不是「全部」** —— 一個做過 500 張工單的老手與一個手上
        壓著 20 張的人，派工時要看的是後者那個數字。終態的定義來自
        `work_order_statuses.is_terminal`。

        `meta.unassigned_in_team_queue` 是**指派給團隊但還沒指到人的**工單。
        那些不屬於任何成員的負載，混進成員的數字會讓「還沒有人接」看不見。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: teamId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 每個成員的負載
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        user_id: { type: string, format: uuid }
                        display_name: { type: string }
                        role_in_team: { type: string }
                        open_work_orders: { type: integer }
                        sla_breached: { type: integer }
                        overdue: { type: integer }
                        urgent_or_critical: { type: integer }
                  meta:
                    type: object
                    properties:
                      team_name: { type: string }
                      member_count: { type: integer }
                      denominator: { type: string }
                      total_open_across_members: { type: integer }
                      unassigned_in_team_queue: { type: integer }
        '404': { description: 找不到這個團隊 }

  /teams/{teamId}/shifts:
    get:
      tags: [Work Orders]
      operationId: listTeamShifts
      summary: 班表
      description: |
        需要 `team:read`。預設回從現在起 14 天。

        **與查詢區間重疊即回傳**（不是被包含）：一個橫跨邊界的班次仍然與那段
        時間相關。

        請假也是一筆班次（`shift_type = 'LEAVE'`）。`meta.leave_entries` 讓
        派工的人看得出「有排班」與「排的是休假」的差別 —— 兩者在清單裡長得一樣。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: teamId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: from
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: 班表
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/TeamShift' }
                  meta:
                    type: object
                    properties:
                      count: { type: integer }
                      leave_entries: { type: integer }
                      window_semantics: { type: string }
        '404': { description: 找不到這個團隊 }
    post:
      tags: [Work Orders]
      operationId: createTeamShift
      summary: 建立班表
      description: |
        需要 `team:write`。

        **同型別的重疊是錯誤，不同型別的不是。** 004 沒有給 `team_shifts` 排除
        約束，而「重疊算不算錯」取決於型別：

        | 情況 | 判斷 |
        |---|---|
        | 同一人同一段時間兩筆 `REGULAR` | **重複資料**，回 `409` |
        | `LEAVE` 蓋在 `REGULAR` 上 | 那正是請假的記法 —— 允許 |
        | `ON_CALL` 蓋在 `REGULAR` 上 | 值班與正常班同時存在很常見 —— 允許 |

        跨型別的重疊**不擋但回報**（`meta.overlaps_other_types`）——
        讓排班的人看得到，而不是替他決定那是不是錯的。

        `user_id` 必須是這個團隊的成員：非成員的班次會出現在班表卻不出現在
        workload（那支走 `team_members`），於是兩支端點對同一個人的說法不一致。

        單一班次不得超過 24 小時 —— 跨多天請分成多筆。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: teamId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, shift_start, shift_end]
              properties:
                user_id: { type: string, format: uuid }
                shift_start: { type: string, format: date-time }
                shift_end: { type: string, format: date-time }
                shift_type:
                  type: string
                  enum: [REGULAR, ON_CALL, OVERTIME, LEAVE]
                  default: REGULAR
      responses:
        '201':
          description: 已建立
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/TeamShift' }
                  meta:
                    type: object
                    properties:
                      overlaps_other_types: { type: integer }
                      same_type_overlap_is_rejected: { type: boolean }
        '404': { description: 找不到這個團隊 }
        '409': { description: 同型別的班次重疊 }
        '422': { $ref: '#/components/responses/ValidationError' }

  /parts:
    get:
      tags: [Work Orders]
      operationId: listParts
      summary: 備品目錄
      description: |
        需要 `part:read`。`total_on_hand` 是跨場域的總量 ——
        要看某個場域請用 `GET /part-stock`。

        `meta.parts_without_unit_cost` 讓「沒有單價」看得見：那些備品領用之後
        算不出成本，而 `GET /reports/service-volume` 的 `parts_cost` 會少算 ——
        帳單會安靜地偏低。與那支報表的 `work_orders_without_rate` 同一條規則。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: category_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: include_inactive
          in: query
          required: false
          schema: { type: boolean, default: false }
        - name: q
          in: query
          required: false
          schema: { type: string }
          description: 對 part_code 與 name 做不分大小寫的模糊比對
      responses:
        '200':
          description: 備品清單
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Part' }
                  meta:
                    type: object
                    properties:
                      count: { type: integer }
                      parts_without_unit_cost: { type: integer }

  /part-stock:
    get:
      tags: [Work Orders]
      operationId: listPartStock
      summary: 備品庫存（依場域）
      description: |
        需要 `part:read`。

        **`available` 有一個要說出的前提。** `quantity_reserved` 的寫入者數量是
        **0**（量過：`app/crates` 與 `sql/` 除了 004 的建表之外沒有任何地方寫它），
        所以 `available = quantity_on_hand - quantity_reserved` 今天恆等於
        `quantity_on_hand`。

        那個欄位仍然回傳，但 `meta.reserved_is_never_written` 說出它是死的 ——
        少了這句，看到 `available` 的人會以為預留機制在運作，而在領料撞到短缺時
        才發現不是。

        `meta.rows_without_reorder_point` 是另一個「讓不知道看得見」：沒有設再訂購
        點的列**永遠不會出現在補貨清單裡**，而那不是「庫存充足」，是沒有人設過門檻。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: facility_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: part_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: below_reorder_point
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: 庫存清單
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PartStock' }
                  meta:
                    type: object
                    properties:
                      count: { type: integer }
                      below_reorder_point: { type: integer }
                      rows_without_reorder_point: { type: integer }
                      reserved_is_never_written: { type: boolean }
                      available_formula: { type: string }

  /work-orders:
    get:
      tags: [Work Orders]
      operationId: listWorkOrders
      summary: 查詢工單
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/FacilityIdHeader'
        - name: facility_id
          in: query
          schema: { type: string, format: uuid }
        - name: work_order_type
          in: query
          schema: { type: string, enum: [MAINTENANCE, SERVICE, INSPECTION, CORRECTIVE, PROJECT] }
        - name: status
          in: query
          description: 逗號分隔多值；也接受 `status_category=OPEN|IN_PROGRESS|WAITING|TERMINAL`
          schema: { type: string, example: ASSIGNED,IN_PROGRESS }
        - name: status_category
          in: query
          schema: { type: string, enum: [OPEN, IN_PROGRESS, WAITING, TERMINAL] }
        - name: priority
          in: query
          schema: { type: string }
        - name: assignee_id
          in: query
          schema: { type: string, format: uuid }
        - name: team_id
          in: query
          schema: { type: string, format: uuid }
        - name: asset_id
          in: query
          schema: { type: string, format: uuid }
        - name: spatial_node_id
          in: query
          schema: { type: string, format: uuid }
        - name: source
          in: query
          schema: { type: string, enum: [MANUAL, PM_PLAN, IOT_ALARM, RESERVATION, API, IMPORT, INSPECTION_FINDING] }
        - name: sla_state
          in: query
          schema: { type: string }
        - name: mine
          in: query
          description: 只回傳與目前使用者相關（負責人或申請人）的工單
          schema: { type: boolean, default: false }
        - name: created_from
          in: query
          schema: { type: string, format: date-time }
        - name: created_to
          in: query
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Fields'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/WorkOrder' }
    post:
      tags: [Work Orders]
      operationId: createWorkOrder
      summary: 建立工單（維修）或服務請求（Soft FM）
      description: |
        `work_order_type=SERVICE` 時必須帶 `service_item_id`，且 `payload` 需符合該服務項目的
        `form_schema`；驗證失敗回 `422` 並在 `errors[]` 指出違規的 JSON Pointer。

        建立後預設狀態為 `SUBMITTED`（`as_draft=true` 時為 `DRAFT`）。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkOrderCreate' }
            examples:
              cinemaSpillClean:
                summary: 影廳緊急清潔（獨立服務請求）
                value:
                  work_order_type: SERVICE
                  facility_id: cccccccc-0000-4000-8000-000000000002
                  service_item_id: 60000000-0000-4000-8000-000000000004
                  spatial_node_id: 10000000-0000-4000-8000-000000000013
                  title: 1 廳 G 排飲料傾倒
                  priority: HIGH
                  payload:
                    severity: MODERATE
                    seat_range: G8-G12
                    blocking_show: true
              hvacCorrective:
                summary: 空調異音報修
                value:
                  work_order_type: CORRECTIVE
                  facility_id: cccccccc-0000-4000-8000-000000000001
                  asset_id: 20000000-0000-4000-8000-000000000002
                  title: 4F 空調箱異音
                  description: 下午起持續低頻異音，會議室可聽見
                  priority: MEDIUM
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkOrder' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /work-orders/{workOrderId}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: workOrderId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Work Orders]
      operationId: getWorkOrder
      summary: 取得工單詳情
      parameters:
        - name: include
          in: query
          schema: { type: string, example: tasks,comments,labor,parts,transitions,attachments }
      responses:
        '200':
          description: OK
          headers:
            ETag:
              description: 目前版本，寫入時作為 If-Match 使用
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkOrderDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Work Orders]
      operationId: updateWorkOrder
      summary: 更新工單欄位（不含狀態）
      description: 狀態變更一律走 `POST /work-orders/{id}/transitions`，避免繞過狀態機。
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkOrderUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkOrder' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }

  /work-orders/{workOrderId}/satisfaction:
    post:
      tags: [Work Orders]
      operationId: submitWorkOrderSatisfaction
      summary: 申請人評價
      description: |
        需要 `work_order:read`，**並且必須是工單的申請人本人**（`created_by`）。

        「申請人本人」不能用權限碼表達 —— 任何有 `work_order:read` 的人都看得到
        這張工單。用權限碼會讓管理員能替客戶打分，而那個數字接著會出現在對客戶
        的報告裡。

        只有 `COMPLETED` 或 `CLOSED` 之後能評。那兩個狀態正是 migration 008 的
        狀態機宣告 `request_satisfaction` 的兩個轉換 ——
        `IN_PROGRESS → COMPLETED`（所有型別）與 SERVICE 的 `COMPLETED → CLOSED`。

        **評完之後可以修改，但有期限**，而期限是租戶自己定的
        （`tenants.settings.satisfaction_editable_days`，0–365，預設 14）。
        `0` 代表一經送出即定案 —— 那是一個合法的政策，不是「沒設定」。
        回應的 `meta.editable_days_source` 會說出這個數字是租戶設的
        (`tenant_setting`) 還是平台預設 (`platform_default`)：後者會隨版本改。

        四種失敗分得開，因為混在一起會讓使用者問錯問題：

        | 情況 | 回應 |
        |---|---|
        | 工單不存在，或不在你的場域範圍 | `404` |
        | 存在但你不是申請人 | `403` |
        | 還沒完成 | `409` |
        | 已評過且過了可修改期限 | `409`（detail 說出期限幾天） |

        結案時系統會主動寄出評分邀請（`SATISFACTION_REQUEST`，EMAIL 與 IN_APP
        兩個管道）。**同一張工單只邀請一次** —— 判斷依據是通知本身而不是一個
        旗標欄位，因為旗標會與通知不同步。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: workOrderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [score]
              properties:
                score:
                  type: integer
                  minimum: 1
                  maximum: 5
                comment:
                  type: [string, 'null']
                  maxLength: 2000
      responses:
        '200':
          description: 已記錄
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      work_order_id: { type: string, format: uuid }
                      score: { type: integer }
                      comment: { type: [string, 'null'] }
                  meta:
                    type: object
                    properties:
                      was_first_submission:
                        type: boolean
                        description: false = 這是一次修改，前端該顯示「已更新」而不是「感謝評分」
                      editable_days: { type: integer }
                      editable_days_source:
                        type: string
                        enum: [tenant_setting, platform_default]
        '403': { description: 不是這張工單的申請人 }
        '404': { description: 找不到這張工單 }
        '409': { description: 還沒完成，或已評過且過了可修改期限 }
        '422': { $ref: '#/components/responses/ValidationError' }

  /work-orders/{workOrderId}/transitions:
    post:
      tags: [Work Orders]
      operationId: transitionWorkOrder
      summary: 執行狀態機動作
      description: |
        可用動作由 `GET /work-orders/{id}/available-actions` 取得，或參考狀態機定義。
        伺服端會檢查：權限 → 必填欄位 → 狀態機合法性，任何一關不通過都不會寫入。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: workOrderId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkOrderTransitionRequest' }
            examples:
              assign:
                summary: 派工
                value:
                  action: ASSIGN
                  assignee_id: ffffffff-0000-4000-8000-000000000003
                  scheduled_start_at: '2026-07-29T09:00:00+08:00'
              complete:
                summary: 完成
                value:
                  action: COMPLETE
                  resolution_notes: 已更換濾網並清洗盤管，壓差回到 180Pa
                  labor_minutes: 75
      responses:
        '200':
          description: 狀態已變更
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkOrder' }
        '409':
          description: 動作在當前狀態不合法
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                # type 的推導規則是 code 轉 kebab-case（全 16 個 code 一致），
                # 原本這裡寫 /illegal-transition 與該規則不符。
                type: https://api.fms.bizlution.com/problems/work-order-illegal-transition
                title: Illegal state transition
                status: 409
                code: WORK_ORDER_ILLEGAL_TRANSITION
                detail: "action APPROVE is not allowed from status IN_PROGRESS"
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /work-orders/{workOrderId}/available-actions:
    get:
      tags: [Work Orders]
      operationId: listAvailableActions
      summary: 取得目前使用者在此工單上可執行的動作
      description: 前端據此決定按鈕的顯示與 enable，避免把狀態機邏輯複製到各前端。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: workOrderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        action: { type: string, example: START_WORK }
                        to_status: { type: string, example: IN_PROGRESS }
                        label_zh: { type: string, example: 開始作業 }
                        required_fields:
                          type: array
                          items: { type: string }
                        permitted: { type: boolean }

  /work-orders/{workOrderId}/comments:
    post:
      tags: [Work Orders]
      operationId: addWorkOrderComment
      summary: 新增工單留言
      description: |
        後補的端點：`WorkOrderDetail.comments` 原本已宣告留言陣列，
        卻沒有任何端點能新增留言（與附件同一類「有讀無寫」的缺口）。

        權限沿用 `work_order:update` —— 留言等同更新工單的紀錄。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: workOrderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string }
                visibility:
                  type: string
                  enum: [INTERNAL, REQUESTER_VISIBLE, PUBLIC]
                  default: INTERNAL
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  author_name: { type: [string, 'null'] }
                  visibility: { type: string }
                  body: { type: string }
                  created_at: { type: string, format: date-time }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /work-orders/{workOrderId}/tasks:
    get:
      tags: [WorkOrders]
      operationId: listWorkOrderTasks
      summary: 檢查項目
      description: |
        需要 `work_order:read`（回填才需要 `work_order:execute`）。

        `PATCH .../tasks/{taskId}` 早就有了，而**列出檢查項的端點沒有** ——
        也就是說技師得先知道 `taskId` 才回填得了。

        `meta.required_outstanding` 是「還不能結案」的直接答案 ——
        前端不必自己數，而那個數字正是結案守衛看的東西。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: workOrderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/WorkOrderTask' }
                  meta:
                    type: object
                    properties:
                      required_outstanding:
                        type: integer
                        description: 還沒填的必要項目數 —— 大於 0 就不能結案
        '404': { description: 找不到這張工單（或它不在你的範圍內） }

  /work-orders/{workOrderId}/labor:
    post:
      tags: [WorkOrders]
      operationId: recordWorkOrderLabor
      summary: 登錄工時
      description: |
        需要 `work_order:execute`。**替別人登記需要 `work_order:assign`** ——
        那是排程者的動作；少了這道檢查，任何技師都能把工時掛到同事身上，
        而那會影響團隊負載與 chargeback 的歸屬。

        分鐘數由 `started_at`/`ended_at` 推導，或直接給 `minutes`。
        **兩者都給時必須一致** —— 不一致而選一個會讓另一個變成謊。

        `cost` **不由呼叫端給**，而是 `minutes / 60 × hourly_rate` 算出來的。
        `work_order_labor` 同時有這兩欄，讓呼叫端都填的話那個 `cost` 可以與
        它的輸入不一致 —— 而它會被加總進 `work_orders.labor_cost`，
        然後出現在 chargeback 的帳單上。

        **沒有 `hourly_rate` 時 `cost` 是 null，不是 0。** schema 裡沒有任何
        費率來源（`users`／`teams`／`skills` 上都沒有 rate 欄位），所以費率
        一定得由呼叫端給。「成本未知」與「免費」是完全不同的兩件事，
        而 0 會讓前者安靜地變成後者，直接壓低 chargeback 的金額。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: workOrderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: string
                  format: uuid
                  description: 省略時記在呼叫者身上。填別人需要 work_order:assign
                started_at: { type: string, format: date-time }
                ended_at: { type: string, format: date-time }
                minutes:
                  type: integer
                  minimum: 1
                  maximum: 1440
                  description: 與 started_at/ended_at 二擇一。跨日請分兩筆
                hourly_rate:
                  type: number
                  minimum: 0
                  description: 沒有預設來源，省略時 cost 為 null
                is_overtime: { type: boolean, default: false }
                notes: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  user_id: { type: string, format: uuid }
                  minutes: { type: integer }
                  cost:
                    type: [number, 'null']
                    description: null = 沒有給費率，成本未知（不是 0）
                  work_order_labor_cost: { type: [number, 'null'] }
                  work_order_labor_minutes: { type: integer }
        '403': { description: 替別人登記而沒有 work_order:assign }
        '404': { description: 找不到這張工單或這個使用者 }
        '422': { $ref: '#/components/responses/ValidationError' }

  /work-orders/{workOrderId}/parts:
    post:
      tags: [WorkOrders]
      operationId: recordWorkOrderParts
      summary: 領用備品
      description: |
        需要 `work_order:execute`。

        扣帳是**原子的**（`WHERE quantity_on_hand >= quantity`），不是先查再扣
        —— 兩張工單同時領最後一片濾網時由資料庫仲裁。

        **兩種缺料分開處理：**

        * 該場域**沒有庫存列** → 允許領用並不連結庫存。廠商當場帶料、
          緊急採購都是真實情境，拒絕它會讓系統無法記錄真正發生的事。
          回應的 `stock_on_hand_after` 是 null。
        * 有庫存列**但不足** → 409。

        單價在**領用時快照**（`parts.unit_cost` 複製到 `work_order_parts`）——
        料件日後調價不會改寫已完成工單的成本。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: workOrderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [part_id, quantity]
              properties:
                part_id: { type: string, format: uuid }
                quantity: { type: number, exclusiveMinimum: 0 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  part_id: { type: string, format: uuid }
                  quantity_used: { type: number }
                  total_cost: { type: [number, 'null'] }
                  work_order_parts_cost: { type: [number, 'null'] }
                  stock_on_hand_after:
                    type: [number, 'null']
                    description: null = 該場域沒有這個料件的庫存列（廠商帶料），不是 0 庫存
        '404': { description: 找不到這張工單 }
        '409': { description: 該場域的庫存不足 }
        '422': { $ref: '#/components/responses/ValidationError' }

  /work-orders/{workOrderId}/tasks/{taskId}:
    patch:
      tags: [Work Orders]
      operationId: updateWorkOrderTask
      summary: 回填檢查項目結果
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: workOrderId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: taskId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                result_value: {}
                is_pass: { type: boolean }
                notes: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkOrderTask' }

  # ---------------------------------------------------------------------------
  # Reservations
  # ---------------------------------------------------------------------------
  /facilities/{facilityId}/availability:
    get:
      tags: [Reservations]
      operationId: getAvailability
      summary: 查詢可用時段
      description: |
        一次回傳多個資源在指定日期範圍內的忙碌區塊與可用 slot，
        供前端繪製時間軸；空間節點的 `is_bookable` 與封鎖時段皆已納入計算。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/FacilityIdPath'
        - name: resource_ids
          in: query
          description: 逗號分隔；省略則回傳該設施所有可預約資源
          schema: { type: string }
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: slot_minutes
          in: query
          schema: { type: integer, default: 30 }
        - name: min_capacity
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ResourceAvailability' }

  /reservations/holds:
    post:
      tags: [Reservations]
      operationId: createReservationHold
      summary: 建立短期佔位（兩階段預約第一步）
      description: |
        高競爭資源（影廳、熱門會議室）建議先取得 hold 再確認，可避免使用者填完
        附加服務表單後才發現被搶走。Hold 預設 3 分鐘後自動失效。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resource_id, start_at, end_at]
              properties:
                resource_id:
                  type: string
                  format: uuid
                  description: >-
                    指向底層資源本身（SpatialNode.id / Asset.id），不是
                    BookableResource.id——同 ReservationCreate.resource_id。
                start_at: { type: string, format: date-time }
                end_at: { type: string, format: date-time }
                ttl_seconds: { type: integer, default: 180, maximum: 900 }
      responses:
        '201':
          description: 佔位成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  hold_token: { type: string }
                  expires_at: { type: string, format: date-time }
        '409':
          description: 資源已被佔用
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ---------------------------------------------------------------------------
  # Notifications
  # ---------------------------------------------------------------------------
  /webhooks:
    get:
      tags: [Notifications]
      operationId: listWebhooks
      summary: webhook 訂閱清單
      description: |
        需要 `tenant:update`（TENANT 範圍）。

        **讀取用寫入權限是刻意的**：清單裡有客戶的內部端點網址，那是他們的基礎
        架構資訊。看得到工單的人不需要、也不該看得到「資料被送到哪裡去」。

        ### 回應帶整合方一定需要的三件事

        少了它們，整合方會（依序）訂到一個不存在的事件、只驗 body 的簽章
        （於是可被重放）、以及假設投遞是恰好一次。

        | `meta` 欄位 | 為什麼一定要說 |
        |---|---|
        | `subscribable_event_types` | 訂一個系統不會發出的事件是靜默失敗 |
        | `signature_scheme` | 簽章是對 `<timestamp>.<body>` 算的，不是只對 body |
        | `delivery_semantics` | **at-least-once** —— 接收端必須自行幂等 |
        | `auto_disabled_count` | 被系統自動停用的訂閱數。一份看起來正常的清單會讓人以為事件都送出去了 |

        `disabled_reason` 分得出「客戶自己關的」（null）與「系統因連續失敗關的」
        （有值）—— 那兩件事的處置完全不同。

        **回應永不包含 `signing_secret`。** 不是因為程式碼記得不要選它，
        而是因為 migration 072 對 `fms_app` 做了欄位級
        `REVOKE SELECT (signing_secret)`：一次 `SELECT *` 也讀不出來。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: active_only
          in: query
          schema: { type: boolean, default: false }
          description: |
            預設連停用的也回 —— 一筆被系統自動停用的訂閱正是最需要被看到的那一筆。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, page, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/WebhookSubscription' }
                  page: { $ref: '#/components/schemas/PageMeta' }
                  meta:
                    type: object
                    required:
                      - subscribable_event_types
                      - signature_scheme
                      - delivery_semantics
                    properties:
                      subscribable_event_types:
                        type: array
                        items: { type: string }
                      signature_scheme: { type: object }
                      delivery_semantics: { type: string }
                      auto_disabled_count: { type: integer }
                      auto_disable_note: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Notifications]
      operationId: upsertWebhook
      summary: 建立或更新 webhook 訂閱
      description: |
        需要 `tenant:update`。

        ### 對既有的 url 是**更新**

        契約沒有 PATCH 也沒有 DELETE，而一個關不掉的 webhook 是兩個問題：它會
        永遠敲一個死掉的端點，而且它是一條關不掉的資料外送通道。

        因此 `(tenant_id, url)` 是唯一鍵，`POST` 對既有的 url 是更新 ——
        帶 `is_active: false` 就能停用，帶 `true` 可以把被自動停用的重新啟用
        （同時清掉 `disabled_reason`）。新建回 `201`，更新回 `200`。

        ### `signing_secret` 只在新建時出現一次

        金鑰由伺服器產生（256 bit）。**這是它唯一一次出現在回應裡** ——
        之後 API 連讀都讀不到（072 的欄位級 `REVOKE SELECT`）。
        目前沒有換金鑰的端點，而 072 連 `UPDATE (signing_secret)` 的權限都沒給。

        更新既有訂閱**不**重新產生金鑰：客戶端那一側已經存了同一份，換掉會讓
        所有簽章驗證在對方部署新金鑰之前失敗。

        ### 網址檢查兩次

        建立時檢查（讓錯誤在這裡就出現，而不是變成一筆永遠投遞失敗的訂閱），
        **投遞時每次再檢查一次** —— DNS 記錄可以在建立之後被改成指向內網。
        072 的 CHECK 只擋非 https；指向 `169.254.169.254` 的 https 網址要靠
        應用層的 SSRF 閘門擋。

        ### 事件型別白名單

        不在 `subscribable_event_types` 裡的型別回 422。訂一個系統不會發出的
        事件是靜默失敗：訂閱建得起來、清單裡看起來正常、而永遠不會收到東西。
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, event_types]
              additionalProperties: false
              properties:
                url:
                  type: string
                  format: uri
                  description: 必須是 https，且不得解析到私有／保留位址。
                event_types:
                  type: array
                  minItems: 1
                  items: { type: string }
                description: { type: [string, 'null'] }
                is_active:
                  type: boolean
                  description: 省略時新建為 true、更新既有時不動。
      responses:
        '200':
          description: 已更新既有訂閱（`signing_secret` 為 null）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookUpsertResponse' }
        '201':
          description: 已建立（`signing_secret` 只在這裡出現一次）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookUpsertResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /notifications:
    get:
      tags: [Notifications]
      operationId: listNotifications
      summary: 站內通知收件匣
      description: |
        只回**呼叫者自己的** `IN_APP` 通知，最新的在前。

        `EMAIL`／`PUSH` 的通知列是傳輸紀錄，不是收件匣項目，因此不在這裡。
        目前也**沒有傳輸層** —— 那些列會停在 `QUEUED`（見 ENDPOINTS.md
        的背景作業說明）。

        沒有游標分頁：收件匣是從最新往下讀的。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: unread_only
          in: query
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  meta:
                    type: object
                    required: [unread_count]
                    properties:
                      unread_count:
                        type: integer
                        description: 未讀總數。與 `limit` 無關 —— 不要從 `data` 的長度推。
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Notification' }

  /notifications/{notificationId}/read:
    post:
      tags: [Notifications]
      operationId: markNotificationRead
      summary: 標記已讀
      description: |
        幂等：已讀的再標一次仍成功，`read_at` 不變（第一次讀的時刻才是事實）。

        別人的通知回 `404` 而不是 `403` —— 回 403 會確認那個 id 存在。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: notificationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: 已標記 }
        '404':
          description: 找不到，或不是你的通知
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /notification-templates:
    get:
      tags: [Notifications]
      operationId: listNotificationTemplates
      summary: 通知範本
      description: |
        回傳平台提供的範本與租戶自己的覆寫版本。

        `meta.transitions_without_template` 列出**宣告了要通知卻沒有文案可送**
        的轉移。那是這支端點最重要的用途：migration 041 把這件事計入
        `no_template` 並記 `warn`，但那要等事件真的發生；這裡讓它事先看得見。

        ### 工單類範本可用的變數

        `wo_no`、`title`、`status`、`priority`、`response_due_at`、
        `resolution_due_at`、`completed_at`、`facility_name`、`location_name`、
        `assignee_name`、`requester_name`、`resolution_notes`。

        時刻以該場域的時區格式化為 `YYYY-MM-DD HH:MM`。

        **打錯的變數不會被吞掉** —— `{{assignee}}`（正確的是 `assignee_name`）
        會原樣出現在收件人眼前。每一列的 `placeholders` 就是為了讓你比對。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: code
          in: query
          schema: { type: string }
        - name: channel
          in: query
          schema: { type: string, enum: [EMAIL, SMS, PUSH, WEBHOOK, IN_APP, LINE] }
        - name: include_inactive
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  meta:
                    type: object
                    properties:
                      transitions_without_template:
                        type: array
                        description: 宣告了 `notify` 但沒有可用範本的轉移。
                        items:
                          type: object
                          properties:
                            action: { type: string }
                            template: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/NotificationTemplate' }
    post:
      tags: [Notifications]
      operationId: createNotificationTemplate
      summary: 建立租戶範本（可覆寫平台範本）
      description: |
        建立的一律是**租戶**範本 —— `tenant_id` 由伺服端填入，客戶端無法指定。

        以相同的 `(code, channel, locale)` 建立就會**覆寫**平台範本
        （migration 042 讓租戶版確定地勝出）。平台範本本身改不了也刪不了。
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationTemplateCreate' }
      responses:
        '201':
          description: 已建立
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationTemplate' }
        '409':
          description: 這個 (code, channel, locale) 你已經有覆寫版本了
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /notification-templates/{templateId}:
    patch:
      tags: [Notifications]
      operationId: updateNotificationTemplate
      summary: 更新租戶範本
      description: |
        `code`／`channel`／`locale` 不可變更 —— 它們合起來是範本的身分。

        對**平台範本**送這個請求會回 `409`（不是 404）：那一筆確實存在也讀得到，
        只是改不了。回應會說明正確做法是建立覆寫版本。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: templateId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationTemplateUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationTemplate' }
        '409':
          description: 這是平台範本，請建立覆寫版本
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    delete:
      tags: [Notifications]
      operationId: deleteNotificationTemplate
      summary: 刪除租戶覆寫（平台版重新生效）
      description: |
        真的刪除：`notifications` 存的是 `template_code` 而不是 id，
        因此沒有任何東西參照這一列。刪掉覆寫之後平台範本重新生效。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: templateId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: 已刪除 }
        '409':
          description: 這是平台範本，不能刪除
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ---------------------------------------------------------------------------
  # Holiday calendars
  # ---------------------------------------------------------------------------
  /holiday-calendars:
    get:
      tags: [Work Orders]
      operationId: listHolidays
      summary: 假日與補班日
      description: |
        `facility_id` 為 `null` 代表租戶通用；解析某一天營不營業時，
        場域專屬的行事曆勝過租戶通用的。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: facility_id
          in: query
          schema: { type: string, format: uuid }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Holiday' }
    post:
      tags: [Work Orders]
      operationId: createHoliday
      summary: 建立假日／補班日
      description: |
        **建立租戶通用的行事曆（`facility_id` 省略或為 null）需要 TENANT 範圍的
        `holiday:write`** —— 它影響每一個場域的每一張工單。

        `is_working_day: true`（補班日）時 **`windows` 通常必填**：補班日多半
        落在該場域平常不營業的星期，沿用常規班表會讓那一天可用 0 分鐘，
        整筆設定不會有任何作用。伺服端會擋掉那種組合。
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HolidayCreate' }
      responses:
        '201':
          description: 已建立
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Holiday' }
        '409':
          description: 該場域的那一天已經有一筆行事曆
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /holiday-calendars/{holidayId}:
    patch:
      tags: [Work Orders]
      operationId: updateHoliday
      summary: 更新行事曆
      description: |
        **改行事曆不影響已經開立的工單** —— SLA 期限在開單時就算成絕對時刻
        （ADR-12 決定 F 的快照）。新的行事曆只對之後開立的工單生效。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: holidayId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HolidayUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Holiday' }
    delete:
      tags: [Work Orders]
      operationId: deleteHoliday
      summary: 刪除行事曆
      description: |
        真的刪除（不是軟刪除）：沒有任何東西參照這一列，期限在開單時就算成
        絕對時刻了。這與 SLA 政策不同 —— 那些只能停用，因為已開立的工單
        快照了它們的 id。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: holidayId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: 已刪除 }

  # ---------------------------------------------------------------------------
  # SLA policies
  # ---------------------------------------------------------------------------
  /sla-policies:
    get:
      tags: [Work Orders]
      operationId: listSlaPolicies
      summary: SLA 政策清單
      description: |
        `facility_id` 為 `null` 代表**租戶通用**。解析工單的目標時刻時，
        場域專屬的政策勝過租戶通用的（ADR-12 決定 F），因為 SLA 通常寫在
        「這棟樓的合約」裡。

        同一組 `(facility_id, applies_to_priority)` 只能有一個
        `is_active` 的政策 —— 否則哪一個生效會取決於代碼字典序。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: facility_id
          in: query
          description: 只回傳該場域專屬的政策；省略則回傳全部（含租戶通用）。
          schema: { type: string, format: uuid }
        - name: include_inactive
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/SlaPolicy' }
    post:
      tags: [Work Orders]
      operationId: createSlaPolicy
      summary: 建立 SLA 政策
      description: |
        **建立租戶通用政策（`facility_id` 省略或為 null）需要 TENANT 範圍的
        `sla_policy:write`** —— 它影響每一個場域。場域專屬的政策只需要該場域的
        範圍。

        `escalation_rules` 定義預警時點：`at_pct < 100` 的最小值就是門檻
        （例如 `[{"at_pct": 75}]` 表示用掉 75% 時標記 `AT_RISK`）。
        **空陣列或只有 `at_pct: 100` 代表這個政策不要預警** ——
        那是刻意可表達的選擇，不會被預設值取代。
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SlaPolicyCreate' }
      responses:
        '201':
          description: 已建立
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SlaPolicy' }
        '409':
          description: 代碼重複，或該 (facility, priority) 已有 active 政策
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /sla-policies/{slaPolicyId}:
    patch:
      tags: [Work Orders]
      operationId: updateSlaPolicy
      summary: 更新 SLA 政策
      description: |
        **改分鐘數不影響已經開立的工單。** `response_due_at` 與
        `resolution_due_at` 在開單時就算成絕對時刻（ADR-12 決定 F 的快照），
        因此調整政策不會讓上個月的達成率跟著變 —— 合約報表不能回溯改變。

        新的分鐘數只對之後開立的工單生效。

        停用政策請設 `is_active: false`，不要刪除：已開立的工單快照了它的 id，
        而那段歷史有價值。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: slaPolicyId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SlaPolicyUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SlaPolicy' }
        '409':
          description: 該 (facility, priority) 已有另一個 active 政策
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /service-items/{serviceItemId}:
    patch:
      tags: [Service Catalogue]
      operationId: updateServiceItem
      summary: 更新服務項目
      description: |
        需要 `service_item:write`。

        **`code` 與 `facility_id` 不可變更**（`422`，`code: IMMUTABLE`）：
        `code` 是唯一索引的一部分而客戶端可能已經引用它；改 `facility_id` 會讓
        既有工單所屬的服務項目突然屬於另一個場域。要換代碼請停用舊項目並建立新的。

        **價格與入口的規則用合併後的值驗，不是只看送來的欄位。**
        只送 `chargeable: true` 而資料庫裡沒有單價，會建出一個「可收費但金額
        不明」的項目 —— 那正是 POST 擋掉的情況，PATCH 不該有一個後門。
        同理，兩個申請入口旗標的合併值不能都是 false。

        可為 NULL 的欄位（`description`、`approver_role_code`、`unit_price`、
        `currency`、`unit_label`、`max_quantity`、`icon`）送 `null` 是**清空**，
        不送是不動。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: serviceItemId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                category: { type: string }
                name: { type: string, maxLength: 200 }
                description: { type: [string, 'null'] }
                lead_time_minutes: { type: integer, minimum: 0 }
                default_duration_minutes: { type: integer, minimum: 1 }
                relative_offset_minutes: { type: integer }
                is_attachable_to_reservation: { type: boolean }
                is_standalone_requestable: { type: boolean }
                requires_approval: { type: boolean }
                approver_role_code: { type: [string, 'null'] }
                chargeable: { type: boolean }
                unit_price: { type: [number, 'null'] }
                currency: { type: [string, 'null'] }
                unit_label: { type: [string, 'null'] }
                max_quantity: { type: [integer, 'null'] }
                form_schema: { type: object }
                availability: { type: object }
                icon: { type: [string, 'null'] }
                display_order: { type: integer }
                is_active: { type: boolean }
      responses:
        '200':
          description: 更新後的項目
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ServiceItemAdmin' }
        '404': { description: 找不到這個服務項目 }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Service Catalogue]
      operationId: deactivateServiceItem
      summary: 停用服務項目
      description: |
        需要 `service_item:write`。**軟刪除**（設 `deleted_at` 並把
        `is_active` 設為 false）。

        不硬刪的理由：`work_orders` 存著 `service_item_id`，而那個外鍵是
        `ON DELETE SET NULL` —— 硬刪會讓既有工單失去它們是什麼服務的紀錄。

        **回應帶 `open_work_orders`（還有幾張未結工單引用它）。**
        停用一個還有 20 張進行中工單的服務是合法的（不再接受新申請），但那 20 張
        的處理方式與零張完全不同 —— 回 `204` 的話那個數字沒有人看得到，
        所以這一支回 `200` 加一個 body。

        停用之後 `code` 就釋放了（唯一索引帶 `WHERE deleted_at IS NULL`），
        因此可以建立一個同 code 的新項目。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: serviceItemId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 已停用
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      deleted: { type: boolean }
                      open_work_orders:
                        type: integer
                        description: 還有幾張未結工單引用它 —— 停用不影響它們
                  meta:
                    type: object
                    properties:
                      soft_delete: { type: boolean }
                      why: { type: string }
        '404': { description: 找不到這個服務項目 }

  /service-items/{serviceItemId}/availability:
    get:
      tags: [Service Catalogue]
      operationId: getServiceItemAvailability
      summary: 服務可用時段（依 availability 設定）
      description: |
        需要 `service_item:read`。回傳從 `from`（預設今天）起 `days` 天
        （預設 7、上限 31）每一天的可用時段。

        ## 解析順序

        1. **`blackout_dates` 含這一天 → 空陣列**，不管星期表怎麼寫。
           停止服務日是例外覆寫，而例外的意義就是蓋過常規。
        2. 服務自己的星期表（`availability` 的 `mon`…`sun`）。
        3. 退回**場域**的營運時間（`fms.business_windows()`，連假日行事曆一起解，
           所以休館日自然不營業）。服務項目的 `facility_id` 為 NULL（全場域適用）
           時沒有場域可退。

        **每一天都回 `basis`，因為「空陣列」有三種原因**，而它們對使用者的意義
        完全不同：`blackout_date`（今天不提供）、
        `service_item.availability`／`facility.operating_hours`（那個星期沒時段）、
        `no_facility_to_fall_back_to`（這個服務沒設定，去問管理員）。

        ## `availability` 的形狀（migration 068 的約束）

        ```json
        {"mon": [["07:00","20:00"]], "blackout_dates": ["2026-01-01"]}
        ```

        鍵只能是 `mon`…`sun` 或 `blackout_dates`。**打錯字的鍵會被拒絕** ——
        `blackout_date`（少一個 s）在寬鬆的版本下會被靜默忽略，於是那些停止服務日
        一天都沒有生效，而設定畫面上看起來是對的。`blackout_dates` 的日期連
        真實性都驗：`2026-02-30` 形狀對但那天不存在，放行它會在解析時安靜地
        變成 3 月 2 日。

        ## 時段與提前量是兩件事

        `lead_time_minutes` 是「最晚要提前多久申請」，與「哪幾個小時營業」無關。
        混在一起會讓一個提前量 48 小時的服務看起來像「明天不營業」。
        `meta` 兩者都給，並算出 `earliest_requestable_at` —— 那才是客戶端真正
        需要的那個時刻。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: serviceItemId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: from
          in: query
          required: false
          schema: { type: string, format: date }
        - name: days
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 31, default: 7 }
      responses:
        '200':
          description: 每日可用時段
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        date: { type: string, format: date }
                        windows:
                          type: array
                          items:
                            type: array
                            items: { type: string }
                        basis:
                          type: string
                          enum: [blackout_date, service_item.availability,
                                 facility.operating_hours, no_facility_to_fall_back_to]
                        is_blackout: { type: boolean }
                  meta:
                    type: object
                    properties:
                      service_item_id: { type: string, format: uuid }
                      name: { type: string }
                      is_active: { type: boolean }
                      lead_time_minutes: { type: integer }
                      default_duration_minutes: { type: integer }
                      earliest_requestable_at: { type: string, format: date-time }
                      days: { type: integer }
                      from: { type: string, format: date }
                      open_days:
                        type: integer
                        description: 這 N 天裡有幾天真的開放。0 是有意義的答案
        '404': { description: 找不到這個服務項目 }
        '422': { $ref: '#/components/responses/ValidationError' }

  /reservations/holds/{holdToken}:
    delete:
      tags: [Reservations]
      operationId: releaseReservationHold
      summary: 主動釋放佔位
      description: |
        需要 `reservation:create`，**並且必須是自己的佔位** —— 釋放別人的佔位
        等於把他的時段搶走。

        三種狀態分開處理，因為它們對呼叫者的意義不同：

        | 佔位狀態 | 回應 | 理由 |
        |---|---|---|
        | `ACTIVE` | `204` | 正常釋放 |
        | `EXPIRED`／`RELEASED` | `204` | **幂等** —— 呼叫者要的是「這個時段不再被我佔著」，而那已經成立 |
        | `CONSUMED` | `409` | 那個佔位已經變成一筆預約；回 204 等於謊稱時段空了 |

        把 `CONSUMED` 也回 204 是最容易寫的版本，後果是客戶端以為釋放成功、
        接著訂同一個時段、拿到一個排除約束的衝突錯誤 —— 而那個錯誤裡不會提到
        已經存在的那筆預約。

        這是 `reservation_holds.status = 'RELEASED'` 的第一個寫入者：
        migration 005 的 CHECK 從一開始就列了那個值，而在此之前沒有任何程式碼
        寫得出它。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: holdToken
          in: path
          required: true
          schema: { type: string, maxLength: 64 }
      responses:
        '204': { description: 已釋放（或本來就不再被你佔著） }
        '403': { description: 不是你的佔位 }
        '404': { description: 找不到這個佔位 }
        '409': { description: 已被用來建立預約，無法釋放 }

  /reservations/{reservationId}/check-out:
    post:
      tags: [Reservations]
      operationId: checkOutReservation
      summary: 提前離場並釋放時段
      description: |
        使用者本人（主辦人或代訂對象）；其他人需要 `reservation:update`
        —— 與 check-in 相同的判斷，因為離場與報到是同一個人的動作。

        **只有 `CHECKED_IN` 能離場。** 沒報到就離場在語意上不成立，而更實際的
        理由是它會產生 `checked_out_at IS NOT NULL AND checked_in_at IS NULL`
        這種列，之後任何算「實際使用時長」的東西都要處理那個不可能的組合。

        ## 時段怎麼「釋放」的

        狀態轉成 `COMPLETED`，**`start_at`／`end_at` 一個都不動**。

        最直覺的做法是把 `end_at` 縮到現在，而那會壞掉兩件事：它改寫了與使用者
        的約定（訂兩小時，資料庫說訂一小時），而且
        `GET /reports/space-utilization` 的分子是 `sum(end_at - start_at)`
        —— 也就是**已預約時數**。縮短 `end_at` 會讓那個數字悄悄變成「實際使用
        時數」，兩個意思都合理，但報表說的是前者。

        不需要改時間也做得到釋放：`excl_reservations_no_overlap` 只在
        `status IN ('PENDING_APPROVAL','CONFIRMED','CHECKED_IN')` 時生效，
        所以 `COMPLETED` 之後那個時段就訂得起來了。

        回應的 `meta` 同時給 `used_minutes`（實際）與 `booked_minutes`（約定），
        兩者不互相取代。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: reservationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 已離場
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      reservation_id: { type: string, format: uuid }
                      status: { type: string, enum: [COMPLETED] }
                      checked_in_at: { type: string, format: date-time }
                      checked_out_at: { type: string, format: date-time }
                  meta:
                    type: object
                    properties:
                      used_minutes: { type: number }
                      booked_minutes: { type: number }
                      slot_released: { type: boolean }
                      slot_released_by: { type: string }
        '404': { description: 找不到這筆預約 }
        '409': { description: 不是已報到狀態 }

  /reservation-series/{recurrenceGroupId}:
    delete:
      tags: [Reservations]
      operationId: cancelReservationSeries
      summary: 取消整個週期系列
      description: |
        需要 `reservation:update`，或者系列**全部**都是自己主辦的。

        一個系列理論上可以跨場域（`recurrence_group_id` 沒有那個約束），
        所以權限對**每一個涉及的場域**都要有 —— 只檢查第一個場域會讓一個
        跨場域的系列被只有單一場域權限的人取消。

        **只取消還沒開始的。** 已經發生過的預約是歷史，取消它不會讓那段時間
        回來，而它會讓 `GET /reports/space-utilization` 的過去區間數字改變 ——
        一個「取消整個系列」的動作不該回頭改寫上個月的使用率報表。

        三個數字分開回：`cancelled`、`skipped_past`、`skipped_terminal`。
        只回「取消了 N 筆」的話，一個全部都已結束的系列會回 0，而那與
        「找不到這個系列」長得一樣 —— 前者是 `200` 加三個數字，後者是 `404`。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: recurrenceGroupId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 250 }
      responses:
        '200':
          description: 系列處理結果
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      recurrence_group_id: { type: string, format: uuid }
                      cancelled: { type: integer }
                      skipped_past:
                        type: integer
                        description: 已經開始的不取消 —— 取消它不會讓時間回來
                      skipped_terminal:
                        type: integer
                        description: 已取消／已完成／已 no-show 的
                      total_in_series: { type: integer }
        '404': { description: 找不到這個週期系列 }

  /facilities/{facilityId}/bookable-resources:
    get:
      tags: [Reservations]
      operationId: listBookableResources
      summary: 可預約資源與規則
      description: |
        需要 `reservation:read`（指定場域）。

        **預設只回 `is_bookable` 的資源** —— 一個關掉的資源出現在預約畫面上
        只會讓人白填一次表單。管理設定的畫面帶 `include_unbookable=true`。

        `opening_hours` 的形狀是 migration 038 定的星期鍵 → 時段陣列；
        `{}` 代表沿用場域的 `operating_hours`（那些資源在
        `GET /reports/space-utilization` 的 `hours_basis` 會是
        `facility.operating_hours`）。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: facilityId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: include_unbookable
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: 資源清單
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/BookableResource' }
                  meta:
                    type: object
                    properties:
                      include_unbookable: { type: boolean }
                      unbookable_count: { type: integer }
                      opening_hours_shape: { type: string }

  /bookable-resources/{resourceId}:
    patch:
      tags: [Reservations]
      operationId: updateBookableResource
      summary: 設定預約規則
      description: |
        需要 `bookable_resource:write`（該資源所在的場域）。

        只有預約規則可改。**`resource_type`、`spatial_node_id`、`asset_id`、
        `facility_id` 不可變更**（回 `422`，`code: IMMUTABLE`）：改那幾個等於把
        這個資源指向另一個實體，而既有的預約會跟著指過去（`reservations` 存的是
        `bookable_resource_id`）。要換標的請建立新資源並把舊的
        `is_bookable` 設為 false。

        未知欄位一律拒絕（`code: UNKNOWN_FIELD`）—— 與 `PATCH /tenant` 同一個
        判斷：靜默忽略會讓使用者以為設定生效了。

        `auto_release_minutes`、`approver_role_code`、`max_active_per_user`
        送 `null` 是**清空**，不送是不動。

        兩個資料庫約束的違反會翻譯成 `422` 而不是 500：
        `max_duration_minutes >= min_duration_minutes`（只送其中一個時，
        另一個仍是現值），以及 `opening_hours` 的形狀（migration 038／065）。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: resourceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name: { type: string, maxLength: 200 }
                is_bookable: { type: boolean }
                requires_approval: { type: boolean }
                requires_check_in: { type: boolean }
                min_duration_minutes: { type: integer, minimum: 1 }
                max_duration_minutes: { type: integer, minimum: 1 }
                slot_granularity_minutes: { type: integer, minimum: 1 }
                buffer_before_minutes: { type: integer, minimum: 0 }
                buffer_after_minutes: { type: integer, minimum: 0 }
                advance_booking_days: { type: integer, minimum: 0 }
                min_notice_minutes: { type: integer, minimum: 0 }
                capacity: { type: integer, minimum: 1 }
                opening_hours: { type: object }
                attributes: { type: object }
                auto_release_minutes: { type: [integer, 'null'] }
                approver_role_code: { type: [string, 'null'] }
                max_active_per_user: { type: [integer, 'null'] }
      responses:
        '200':
          description: 更新後的資源
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookableResource' }
        '404': { description: 找不到這個可預約資源 }
        '422': { $ref: '#/components/responses/ValidationError' }

  /amenities:
    get:
      tags: [Reservations]
      operationId: listAmenities
      summary: 附屬設備目錄
      description: |
        需要 `reservation:read`／`reservation:read_own`／`reservation:create`
        任一個（不指定場域——目錄是租戶層級的）。刻意比 `GET .../bookable-resources`
        寬：REQUESTER 只有後兩者，但訂房前正需要看到「有哪些設備可以篩選」，
        擋住目錄不保護任何東西，只會讓篩選器空白。

        平台預設（`tenant_id IS NULL`）與租戶自訂一起回，標上 `is_platform`。
        給前端建立「這間會議室有哪些設備」的篩選器／勾選清單用；實際指派
        給某個資源見 `GET/PUT /bookable-resources/{resourceId}/amenities`。
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: 設備目錄
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Amenity' }

  /bookable-resources/{resourceId}/amenities:
    get:
      tags: [Reservations]
      operationId: listResourceAmenities
      summary: 資源的附屬設備
      description: 權限比照 `GET /amenities`（見該端點的說明），限定該資源所屬場域。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: resourceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 這個資源目前的附屬設備
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ResourceAmenity' }
        '404': { description: 找不到這個可預約資源 }
    put:
      tags: [Reservations]
      operationId: putResourceAmenities
      summary: 設定資源的附屬設備
      description: |
        需要 `bookable_resource:write`（該資源所在的場域）——跟
        `PATCH /bookable-resources/{resourceId}` 是同一種管理動作。

        **完整覆寫**：送一次全量清單，不是逐項增減；空陣列代表清空。
        `amenity_id` 必須是平台預設或本租戶自訂的既有項目，帶不存在的
        id 回 404。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: resourceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amenities]
              properties:
                amenities:
                  type: array
                  items:
                    type: object
                    required: [amenity_id]
                    properties:
                      amenity_id: { type: string, format: uuid }
                      quantity: { type: integer, minimum: 1, default: 1 }
                      note: { type: string, maxLength: 200 }
      responses:
        '200':
          description: 更新後的附屬設備清單
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ResourceAmenity' }
        '404': { description: 找不到這個可預約資源，或某個 amenity_id 不存在 }
        '422': { $ref: '#/components/responses/ValidationError' }

  /resource-blackouts:
    get:
      tags: [Reservations]
      operationId: listResourceBlackouts
      summary: 封鎖時段清單
      description: |
        需要 **`reservation:read`**。

        > **這裡與 ENDPOINTS.md 原本寫的 `blackout:write` 不同，是刻意的。**
        > 封鎖時段的視窗與 `reason` 已經從可用性查詢洩漏出去了
        > （忙碌時段的 `kind` 是 `BLACKOUT`／`MAINTENANCE`，`reason` 原樣帶出）。
        > 把清單擋在寫入權限後面不保護任何東西，只會讓看得到日曆的人問
        > 「為什麼這格是灰的」而得不到答案。POST 仍然是 `blackout:write`。

        ### 預設只回「現在起」的封鎖時段

        「哪裡被封鎖了」是向前看的問題。不設預設起點，第一頁會被歷史資料佔滿。
        要查歷史請明確給 `from`。實際套用的視窗回在 `meta.window`，
        且 `meta.window_default_applied` 說明起點是不是預設值來的 ——
        一個被預設值濾掉的結果如果不說，看起來就像「沒有封鎖時段」。

        過濾用**重疊**而不是「起點落在視窗內」：一段昨天開始、明天結束的封鎖
        現在正在生效，用起點過濾會把它濾掉。

        `bookable_resource_id` 為 `null` 代表**整個場域**被封鎖，不是資料缺漏。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: facility_id
          in: query
          schema: { type: string, format: uuid }
        - name: bookable_resource_id
          in: query
          schema: { type: string, format: uuid }
        - name: from
          in: query
          description: 未指定時預設為現在。
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, page, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ResourceBlackout' }
                  page: { $ref: '#/components/schemas/PageMeta' }
                  meta:
                    type: object
                    properties:
                      window:
                        type: object
                        properties:
                          from: { type: string, format: date-time }
                          to: { type: [string, 'null'], format: date-time }
                      window_default_applied: { type: boolean }
                      note: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Reservations]
      operationId: createResourceBlackout
      summary: 建立封鎖時段（維修、公休、包場）
      description: |
        需要 `blackout:write`（FACILITY 範圍）。

        `bookable_resource_id` 省略或 `null` 代表**整個場域** —— 該場域所有可預約
        資源在那段時間都不能被預約。

        ### 既有預約不會被取消，因此不能默默建立

        011 的衝突檢查只擋**新的**預約。一段蓋在三筆已確認預約上的維修封鎖不會
        讓那三筆消失 —— 那三個人當天會到一間關著的房間前面，而系統從頭到尾沒有
        說過任何話。

        所以視窗內有既有預約時回 **409**，並在 `errors[0].message` 裡帶出那些
        預約（含 `requested_by`，讓操作者知道要通知誰）。要照樣建立必須帶
        `acknowledge_conflicting_reservations: true`，而 201 的回應仍然把清單放在
        `meta.conflicting_reservations`。

        **不自動取消是刻意的**：取消別人的預約需要 `reservation:cancel_any`，
        那是獨立的決定，不該由「建立封鎖時段」順手完成。
        `meta.does_not` 逐條列出來。

        比對的狀態集合抄自 005 的 `excl_reservations_no_overlap`
        （`PENDING_APPROVAL`／`CONFIRMED`／`CHECKED_IN`）—— 只有那幾個狀態真的
        佔著時段，而用不同的集合會讓這裡說「沒有衝突」而預約端說有。
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [facility_id, start_at, end_at, reason]
              additionalProperties: false
              properties:
                facility_id: { type: string, format: uuid }
                bookable_resource_id:
                  type: [string, 'null']
                  format: uuid
                  description: 省略或 null 代表整個場域。必須屬於 `facility_id`。
                start_at: { type: string, format: date-time }
                end_at: { type: string, format: date-time }
                reason:
                  type: string
                  minLength: 1
                  description: 使用者在日曆上看到的就是這句話。
                blackout_type:
                  type: string
                  enum: [MAINTENANCE, HOLIDAY, RENOVATION, PRIVATE_EVENT, EMERGENCY, OTHER]
                  default: MAINTENANCE
                work_order_id:
                  type: [string, 'null']
                  format: uuid
                  description: 必須屬於同一個 `facility_id`。
                acknowledge_conflicting_reservations:
                  type: boolean
                  default: false
      responses:
        '201':
          description: 已建立
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/ResourceBlackout' }
                  meta:
                    type: object
                    properties:
                      conflicting_reservations: { type: array, items: { type: object } }
                      conflicting_reservation_count: { type: integer }
                      does_not: { type: array, items: { type: string } }
                      affects: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: |
            視窗內有既有預約，而請求沒有帶
            `acknowledge_conflicting_reservations`。衝突的預約清單在
            `errors[0].message`（JSON 字串）。
          $ref: '#/components/responses/Conflict'
        '422': { $ref: '#/components/responses/ValidationError' }

  /reservations:
    get:
      tags: [Reservations]
      operationId: listReservations
      summary: 查詢預約
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: facility_id
          in: query
          schema: { type: string, format: uuid }
        - name: resource_id
          in: query
          schema: { type: string, format: uuid }
        - name: organizer_id
          in: query
          schema: { type: string, format: uuid }
        - name: mine
          in: query
          schema: { type: boolean, default: false }
        - name: status
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Reservation' }
    post:
      tags: [Reservations]
      operationId: createReservation
      summary: 建立預約（可同時勾選附加服務）
      description: |
        整個動作在單一交易內完成：檢查可用性 → 消耗 hold → 寫入預約 →
        寫入附加服務 → 發出 `reservation.confirmed` 事件。事件由 worker 消化並
        產生對應的 Soft FM 工單，因此附加服務不會因為工單建立失敗而遺失。

        若資源設定 `requires_approval`，狀態會是 `PENDING_APPROVAL`，且仍然佔用時段。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReservationCreate' }
            examples:
              meetingWithServices:
                summary: 會議室 + 茶水 + 視訊調試
                value:
                  resource_id: 10000000-0000-4000-8000-000000000005
                  title: Q3 業務檢討會
                  start_at: '2026-08-05T14:00:00+08:00'
                  end_at: '2026-08-05T16:00:00+08:00'
                  party_size: 10
                  hold_token: hld_8f2c1d...
                  services:
                    - service_item_id: 60000000-0000-4000-8000-000000000001
                      quantity: 10
                      payload: { headcount: 10, beverage: MIXED, snack: true }
                    - service_item_id: 60000000-0000-4000-8000-000000000003
                      payload: { platform: TEAMS, external_guests: true }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationDetail' }
        '409':
          description: 時段衝突
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://api.fms.bizlution.com/problems/reservation-conflict
                title: Reservation conflict
                status: 409
                code: RESERVATION_CONFLICT
                detail: 該資源在 2026-08-05T14:00+08:00 ~ 16:00 已有預約
                conflicts:
                  - reservation_id: 9f1c...
                    start_at: '2026-08-05T14:30:00+08:00'
                    end_at: '2026-08-05T15:30:00+08:00'
        '422': { $ref: '#/components/responses/ValidationError' }

  /reservations/{reservationId}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: reservationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Reservations]
      operationId: getReservation
      summary: 取得預約詳情（含附加服務與其工單狀態）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationDetail' }
    patch:
      tags: [Reservations]
      operationId: updateReservation
      summary: 更改預約（時間／人數／附加服務）
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReservationUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationDetail' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Reservations]
      operationId: cancelReservation
      summary: 取消預約
      parameters:
        - name: reason
          in: query
          schema: { type: string }
      responses:
        '204': { description: No Content }

  /reservations/{reservationId}/approve:
    post:
      tags: [Reservations]
      operationId: approveReservation
      summary: 核准待審預約
      description: |
        後補的端點：`reservations` 早有 `approval_required`／`approved_by`／
        `approved_at`／`rejection_reason`，`bookable_resources.requires_approval`
        也會讓建立時進入 `PENDING_APPROVAL`，但沒有任何端點能核准 ——
        待審的預約會永遠卡在那個狀態。

        權限：`reservation:approve`。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: reservationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reservation' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 不在待審狀態
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /reservations/{reservationId}/reject:
    post:
      tags: [Reservations]
      operationId: rejectReservation
      summary: 駁回待審預約
      description: 原因必填 —— 被駁回的人需要知道理由，`rejection_reason` 會保存它。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: reservationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reservation' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 不在待審狀態
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /facilities/{facilityId}/occupancy:
    get:
      tags: [Reservations]
      operationId: getOccupancy
      summary: 即時佔用地圖
      description: |
        每個可預約資源**此刻**的狀態，供現場管理與大廳看板使用。
        與 `availability` 是不同的問題：後者回答「未來哪些時段可訂」。

        **沒有推播通道。** 這是查詢當下的快照，狀態變了不會主動通知 ——
        看板要自己輪詢，輪詢間隔自行拿捏。

        `OCCUPIED`（已報到）與 `RESERVED`（已訂未報到）刻意分開 ——
        後者可能是即將發生的 no-show，是現場可以介入的。

        **私人預約會被遮罩。** 這支端點是牆面板與樓層圖的資料來源，
        因此它是私人預約洩漏時最顯眼的一面。無 `reservation:view_private`
        的呼叫端拿到的 `title` 與 `organizer_name` 是 `null`。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/FacilityIdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        resource_id:
                          type: string
                          format: uuid
                          description: >-
                            底層資源本身（SpatialNode.id / Asset.id），不是
                            BookableResource.id——同 ReservationCreate.resource_id
                            的說明。
                        display_name: { type: string }
                        resource_type: { type: string }
                        capacity: { type: integer }
                        state:
                          type: string
                          enum: [FREE, OCCUPIED, RESERVED, HELD]
                        reservation_id: { type: [string, 'null'], format: uuid }
                        title:
                          type: [string, 'null']
                          description: 私人預約且無權查看時為 `null`（見 `is_private`）。
                        organizer_name:
                          type: [string, 'null']
                          description: 同上。
                        start_at: { type: [string, 'null'], format: date-time }
                        end_at: { type: [string, 'null'], format: date-time }
                        is_private:
                          type: boolean
                          description: |
                            私人預約：`title` 與 `organizer_name` 已遮罩成 `null`，
                            `state` 與時段照舊。

                            **這支端點沒有「本人不遮」的例外**（與 `/reservations`
                            不同）：查詢裡沒有 `organizer_id`，而佔用地圖的用途是
                            「這個空間現在有沒有人」—— 在地圖上看到自己那格寫著
                            「已預約」不是缺陷。這個不一致是刻意的。

  /reservations/{reservationId}/check-in:
    post:
      tags: [Reservations]
      operationId: checkInReservation
      summary: 報到（QR／NFC／人工／感測器）
      description: 未在 `auto_release_at` 前報到的預約會由背景作業轉為 `NO_SHOW` 並釋放時段。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: reservationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                method:
                  type: string
                  enum: [MANUAL, QR, NFC, OCCUPANCY_SENSOR, ACCESS_CONTROL]
                  default: MANUAL
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reservation' }

  # ---------------------------------------------------------------------------
  # IoT
  # ---------------------------------------------------------------------------
  /telemetry:batch-ingest:
    post:
      tags: [IoT]
      operationId: ingestTelemetryBatch
      summary: 批次寫入遙測資料（機器帳號專用）
      description: |
        供 IoT 閘道使用，需 `telemetry:ingest` scope 的 client credentials。
        單次上限 1000 筆；伺服端逐筆處理，回應中列出失敗項目而不整批退回。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TelemetryBatch' }
      responses:
        '202':
          description: 已接受
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted: { type: integer }
                  rejected: { type: integer }
                  alarms_raised: { type: integer }
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        index: { type: integer }
                        code: { type: string }
                        message: { type: string }

  /devices:
    get:
      tags: [IoT]
      operationId: listDevices
      summary: 裝置清單與連線狀態
      description: |
        需要 `device:read`。

        **`connectivity` 是算出來的，`status` 不是。** `ingest_telemetry()` 會把
        `status` 從 `OFFLINE`／`UNKNOWN` 翻成 `ONLINE`，但**沒有任何東西把它翻回
        `OFFLINE`** —— 那需要掃描型的 `DEVICE_OFFLINE` 規則，而那在第一階段
        明確未做。所以一台裝置在第一筆讀數之後 `status` 永遠是 `ONLINE`，
        即使它上個月就死了。

        要問「哪些裝置沒在回報」請用 `offline_only=true`，
        **不要**用 `status=OFFLINE`（那會回空清單）。

        離線門檻用每台裝置自己的 `offline_alarm_after_seconds`（管理者設定），
        不是後端寫死的倍數。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: facility_id
          in: query
          schema: { type: string, format: uuid }
        - name: device_type
          in: query
          schema:
            type: string
            enum: [SENSOR, METER, CONTROLLER, ACCESS_PANEL, CAMERA, OCCUPANCY, ENVIRONMENT, GATEWAY]
        - name: status
          in: query
          description: 過濾**儲存的** status（可逗號分隔）。要問實際連線狀態用 offline_only
          schema: { type: string, example: ONLINE,FAULT }
        - name: gateway_id
          in: query
          schema: { type: string, format: uuid }
        - name: asset_id
          in: query
          schema: { type: string, format: uuid }
        - name: offline_only
          in: query
          description: 只回傳算出來是離線的（含從未回報過的）
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Device' }
    post:
      tags: [IoT]
      operationId: createDevice
      summary: 註冊裝置
      description: |
        需要 `device:write`（於該場域）。

        `asset_id` 與 `spatial_node_id` **至少要有一個**（006 的
        `ck_device_target`）—— 一台不知道在監測什麼的裝置，它的讀數無法歸屬。

        `device_code` 在租戶內唯一（不分大小寫）。`POST /telemetry:batch-ingest`
        用 `device_code + point_code` 找點位，所以那個編號是閘道端的識別。
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [facility_id, device_code, name, device_type]
              properties:
                facility_id: { type: string, format: uuid }
                device_code: { type: string, maxLength: 80 }
                name: { type: string, maxLength: 150 }
                device_type:
                  type: string
                  enum: [SENSOR, METER, CONTROLLER, ACCESS_PANEL, CAMERA, OCCUPANCY, ENVIRONMENT, GATEWAY]
                gateway_id: { type: string, format: uuid }
                asset_id: { type: string, format: uuid }
                spatial_node_id: { type: string, format: uuid }
                address:
                  type: string
                  description: MQTT topic 或 Modbus unit/register base
                heartbeat_interval_seconds:
                  type: integer
                  minimum: 1
                  maximum: 86400
                  default: 300
                offline_alarm_after_seconds:
                  type: integer
                  minimum: 1
                  maximum: 86400
                  default: 900
                  description: 多久沒回報算離線。connectivity 用它判定
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
        '409': { description: 這個 device_code 已被使用（不分大小寫） }
        '422': { $ref: '#/components/responses/ValidationError' }

  /devices/{deviceId}:
    patch:
      tags: [IoT]
      operationId: updateDevice
      summary: 更新裝置（含綁定設備／空間）
      description: |
        需要 `device:write`。沒帶的欄位不動。

        **`facility_id` 不可改** —— 裝置搬場域會讓它的歷史讀數落在新場域的
        RLS 範圍裡，那是一次資料歸屬的變更，不是一次欄位更新。

        `asset_id` 與 `spatial_node_id` 無法透過這支端點清成 null
        （`ck_device_target` 要求至少留一個）；要解綁就換綁到另一個目標。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: deviceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 150 }
                device_type:
                  type: string
                  enum: [SENSOR, METER, CONTROLLER, ACCESS_PANEL, CAMERA, OCCUPANCY, ENVIRONMENT, GATEWAY]
                status:
                  type: string
                  enum: [ONLINE, OFFLINE, FAULT, MAINTENANCE, UNKNOWN, DISABLED]
                  description: 行政狀態。DISABLED／MAINTENANCE 會讓 connectivity 直接透傳它
                gateway_id: { type: string, format: uuid }
                asset_id: { type: string, format: uuid }
                spatial_node_id: { type: string, format: uuid }
                address: { type: string }
                heartbeat_interval_seconds: { type: integer, minimum: 1, maximum: 86400 }
                offline_alarm_after_seconds: { type: integer, minimum: 1, maximum: 86400 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
        '404': { description: 找不到這台裝置（或它不在你的範圍內） }
        '422': { $ref: '#/components/responses/ValidationError' }

  /devices/{deviceId}/points:
    get:
      tags: [IoT]
      operationId: listDevicePoints
      summary: 通訊點清單
      description: |
        需要 `device:read`。含每個點位的最新值（來自 `telemetry_latest`）。

        `asset_meter_id` 有值代表這個點位餵給某個設備計量 ——
        計量型 PM 會跟著它走。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: deviceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/TelemetryPoint' }
        '404': { description: 找不到這台裝置（或它不在你的範圍內） }

  /telemetry/latest:
    get:
      tags: [IoT]
      operationId: getLatestTelemetry
      summary: 多點最新值（儀表板用，單次批量）
      description: |
        需要 `telemetry:read`。

        **`is_stale` 必須看。** `telemetry_latest` 存的是最後一筆，而它可能是
        三天前的。一個儀表板把三天前的 24 度顯示成當前室溫，比顯示「無資料」
        危險得多。判定用裝置自己的 `offline_alarm_after_seconds`。

        `meta.stale_count` 是「有幾個讀數已經不能信」——
        儀表板該用它決定要不要顯示警示。

        要有 `point_ids`、`device_id` 或 `facility_id` 其中之一。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: point_ids
          in: query
          description: 逗號分隔的點位 id，一次最多 50 個
          schema: { type: string }
        - name: device_id
          in: query
          schema: { type: string, format: uuid }
        - name: facility_id
          in: query
          schema: { type: string, format: uuid }
        - name: stale_only
          in: query
          description: 只回已經過期的讀數
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/TelemetryLatest' }
                  meta:
                    type: object
                    properties:
                      stale_count: { type: integer }
        '422': { $ref: '#/components/responses/ValidationError' }

  /telemetry/series:
    get:
      tags: [IoT]
      operationId: getTelemetrySeries
      summary: 時序查詢（含降採樣）
      description: |
        需要 `telemetry:read`。

        **每個桶回 min／max／avg／count，不是一個 value。** 一個五分鐘的桶裡
        溫度衝到 31 度三秒鐘，avg 會是 24 —— 而告警門檻是「超過 28」。
        只回 avg 會讓圖表看不到真的發生過的事。畫線用 avg，看越界用 max。

        **桶的邊界是絕對的。** `date_bin` 的 origin 固定為
        `2000-01-01T00:00:00Z`，所以 5 分鐘的桶永遠落在整 5 分 ——
        `from=10:02` 與 `from=10:00` 不會切出錯開的桶，兩次查詢可以疊圖。

        `meta.truncated = true` 代表**結果不完整**（打到上限：分桶 5000、
        原始 10000）。一段看起來完整而其實只到一半的數列比一個錯誤更難發現。

        `interval` 省略或 `raw` 時每一筆自己是一個桶，回應形狀相同。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: point_ids
          in: query
          description: 逗號分隔的點位 id，一次最多 50 個
          schema: { type: string }
        - name: device_id
          in: query
          schema: { type: string, format: uuid }
        - name: point_code
          in: query
          description: 與 device_id 併用以縮小到單一點位
          schema: { type: string }
        - name: from
          in: query
          description: 預設 to - 24h
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: 預設現在
          schema: { type: string, format: date-time }
        - name: interval
          in: query
          description: raw、或 30s／5m／1h／1d。桶數上限 5000
          schema: { type: string, example: 5m }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/TelemetryBucket' }
                  meta:
                    type: object
                    properties:
                      from: { type: string, format: date-time }
                      to: { type: string, format: date-time }
                      bucket_seconds:
                        type: [integer, 'null']
                        description: null 代表 raw
                      bucket_origin: { type: string }
                      limit: { type: integer }
                      truncated:
                        type: boolean
                        description: true 代表結果不完整
        '422': { $ref: '#/components/responses/ValidationError' }

  /alarm-rules:
    get:
      tags: [IoT]
      operationId: listAlarmRules
      summary: 告警規則（含自動建單設定）
      description: |
        需要 `alarm_rule:read`（migration 060 補上；在它之前只有
        `alarm_rule:write`，於是技師看得到告警卻看不到產生它的門檻）。

        **兩個算出來的欄位是這支端點的重點：**

        * `covered_point_count = 0` —— 這條規則管不到任何點位
          （`point_code` 打錯就會這樣），也就是設了等於沒設。
        * `evaluable = false` —— 057 的評估器跳過它（非 THRESHOLD、
          或 condition 有 `for_seconds`），也就是**它現在不會響**。

        `ineffective_only=true` 一次問出「哪些規則設了等於沒設」。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: facility_id
          in: query
          schema: { type: string, format: uuid }
        - name: rule_type
          in: query
          schema:
            type: string
            enum: [THRESHOLD, RATE_OF_CHANGE, DEVIATION, FLATLINE, DEVICE_OFFLINE, BOOLEAN_STATE, COMPOSITE]
        - name: severity
          in: query
          schema:
            type: string
            enum: [INFO, WARNING, MINOR, MAJOR, CRITICAL]
        - name: is_active
          in: query
          schema: { type: boolean }
        - name: auto_create_work_order
          in: query
          schema: { type: boolean }
        - name: ineffective_only
          in: query
          description: 只回傳現在不會響的規則（管不到點位，或評估器跳過）
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AlarmRule' }
    post:
      tags: [IoT]
      operationId: createAlarmRule
      summary: 建立告警規則
      description: |
        需要 `alarm_rule:write`。

        **THRESHOLD 的 condition 會被驗到「它真的會響」為止：**
        `op` 必須是 `>` `>=` `<` `<=` `=` `!=` 之一，且要有數值的 `value`。
        不認得的 `op` 在真跑時只會讓規則進 `bad_rule_codes` ——
        設了卻永遠不觸發，而且沒有錯誤訊息。所以在建立時就回 422。

        `notify_role_codes` 裡不存在的角色也會回 422 ——
        留著它們等於設了通知而沒有人會收到。

        非 THRESHOLD 的 `condition` 不驗內容：第一階段的評估器不處理它們，
        替一個沒有實作的型別發明 schema 就是猜。
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name, condition]
              properties:
                facility_id:
                  type: string
                  format: uuid
                  description: 省略代表整個租戶適用
                code: { type: string, maxLength: 60 }
                name: { type: string, maxLength: 200 }
                description: { type: string }
                telemetry_point_id:
                  type: string
                  format: uuid
                  description: 指定單一點位；與 point_code 二擇一
                point_code:
                  type: string
                  description: 依 point_code 套用到所有同名點位
                asset_category_id: { type: string, format: uuid }
                rule_type:
                  type: string
                  enum: [THRESHOLD, RATE_OF_CHANGE, DEVIATION, FLATLINE, DEVICE_OFFLINE, BOOLEAN_STATE, COMPOSITE]
                  default: THRESHOLD
                condition:
                  type: object
                  example: { op: ">", value: 28 }
                  description: THRESHOLD 需要 op 與數值 value。加 for_seconds 會讓它變成持續型而暫不被評估
                severity:
                  type: string
                  enum: [INFO, WARNING, MINOR, MAJOR, CRITICAL]
                  default: WARNING
                debounce_seconds: { type: integer, default: 60 }
                auto_clear: { type: boolean, default: true }
                auto_create_work_order:
                  type: boolean
                  default: false
                  description: 告警自動變工單 —— IoT 與工單待辦之間的那道橋
                wo_work_order_type: { type: string, default: CORRECTIVE }
                wo_priority:
                  type: string
                  enum: [LOW, MEDIUM, HIGH, URGENT, CRITICAL]
                  default: HIGH
                wo_team_id: { type: string, format: uuid }
                wo_sla_policy_id: { type: string, format: uuid }
                dedupe_window_minutes: { type: integer, default: 120 }
                notify_role_codes:
                  type: array
                  items: { type: string }
                is_active: { type: boolean, default: true }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlarmRule' }
        '409': { description: 這個 code 已被使用 }
        '422': { $ref: '#/components/responses/ValidationError' }

  /alarm-rules/{ruleId}/test:
    post:
      tags: [IoT]
      operationId: dryRunAlarmRule
      summary: 以歷史資料試跑規則
      description: |
        需要 `alarm_rule:write`。**沒有副作用** —— 不建告警、不建工單、
        不寫任何東西。

        判斷用的是 migration 061 抽出來的 `fms.telemetry_rule_fires` 與
        `fms.alarm_rule_covers_point`，而 057 的評估器**也**呼叫同兩支。
        少了這一步，試跑會是同一套語意的第二份實作，而漂移的症狀最糟：
        試跑說「會響 3 次」，上線之後響 0 次。

        `evaluable = false` 代表這種規則現在根本不會被評估
        （非 THRESHOLD 或持續型）—— 那與「試跑結果 0 次」是不同的事，
        回 0 會讓人以為門檻很安全。

        `not_evaluable_readings > 0` 代表這個 condition 判斷不出來
        （op 打錯、缺 value）。

        帶 `condition` 可以試不同門檻而不寫入 ——
        「28 度太敏感，改成 30 會少響幾次」的答案。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: ruleId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: from
          in: query
          description: 預設 to - 7d
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                condition:
                  type: object
                  description: 覆寫門檻試跑，不寫入
                  example: { op: ">", value: 30 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  rule:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      code: { type: string }
                      name: { type: string }
                      rule_type: { type: string }
                  evaluable: { type: boolean }
                  reason:
                    type: string
                    description: evaluable=false 時說明為什麼不會被評估
                  condition_used: { type: object }
                  readings_scanned: { type: integer }
                  would_fire: { type: integer }
                  not_evaluable_readings:
                    type: integer
                    description: '> 0 代表 condition 設定有問題'
                  first_breach_at: { type: [string, 'null'], format: date-time }
                  last_breach_at: { type: [string, 'null'], format: date-time }
                  peak_value:
                    type: [number, 'null']
                    description: 越界時最極端的值（op 為 < / <= 時是最小值）
                  meta:
                    type: object
                    properties:
                      from: { type: string, format: date-time }
                      to: { type: string, format: date-time }
                      limit: { type: integer }
                      truncated: { type: boolean }
        '404': { description: 找不到這條規則（或它不在你的範圍內） }
        '422': { $ref: '#/components/responses/ValidationError' }

  /alarms:
    get:
      tags: [IoT]
      operationId: listAlarms
      summary: 查詢告警
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: facility_id
          in: query
          schema: { type: string, format: uuid }
        - name: severity
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, example: ACTIVE,ACKNOWLEDGED }
        - name: asset_id
          in: query
          schema: { type: string, format: uuid }
        - name: unlinked_only
          in: query
          description: 只回傳尚未關聯工單的告警（用於稽核 IoT 與工單的串接缺口）
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Alarm' }

  /alarms/{alarmId}/acknowledge:
    post:
      tags: [IoT]
      operationId: acknowledgeAlarm
      summary: 確認告警
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: alarmId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alarm' }

  /alarms/{alarmId}/suppress:
    post:
      tags: [IoT & Alarms]
      operationId: suppressAlarm
      summary: 抑制告警（維修期間）
      description: |
        需要 **`alarm:suppress`**。

        > **這裡與 ENDPOINTS.md 原本寫的 `alarm:acknowledge` 不同，是刻意的。**
        > `alarm:acknowledge` 的持有者包含 TECHNICIAN 與 SERVICE_STAFF。
        > 「確認」只是留下「有人看到了」的紀錄；「抑制」讓監控在一段時間內不再
        > 發報。現場人員該能做前者，不該能做後者。
        > `alarm:suppress`（migration 071 新增）授予 `alarm_rule:write` 的持有者
        > —— 能改門檻的人本來就可以讓告警安靜（把門檻調高），抑制沒有給出新的
        > 能力，只是給了一個有期限、留痕跡的做法。

        ### 抑制真正做了什麼

        * 期限內：`occurrence_count` 繼續累加，但**不發 `alarm.raised`、
          不自動建單**。抑制的是通知，不是事實 —— 解除後要能看出這段時間響了幾次。
        * 期限過後：下一次觸發時狀態自動回到 `ACTIVE`，恢復正常發報。

        ### 它不做的事

        不會排除故障、不會取消已經由這則告警建立的工單、不會停用規則。
        回應的 `meta.does_not` 逐條列出來。

        ### 期限

        **一定有期限**（`ck_alarms_suppression_bounded`）。無限期抑制是告警消失
        的方式：沒有人會記得回來解除，而一個被永久靜音的感測器與沒有感測器沒有
        差別 —— 但前者在畫面上看起來是有監控的。

        上限由 `tenants.settings.alarm_max_suppress_minutes` 決定（管理者可設，
        5–10080，未設定時 1440）。超過回 422 並在錯誤裡說出實際上限。

        對已經 `SUPPRESSED` 的告警再呼叫是**延長**（從現在起算，不是把舊期限往後
        推），回應的 `meta.extended_existing_suppression` 為 true。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: alarmId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [duration_minutes, reason]
              additionalProperties: false
              properties:
                duration_minutes:
                  type: integer
                  minimum: 1
                  description: |
                    用時長而不是絕對時刻：操作者想的是「維修這四小時先別響」，
                    而絕對時刻要求呼叫端處理時區。
                reason:
                  type: string
                  minLength: 1
                  description: |
                    **必填。** 下一個發現這則告警沒響的人需要答案，
                    而「誰在什麼時候按了抑制」不足以回答那個問題。
      responses:
        '200':
          description: 已抑制
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/Alarm' }
                  meta:
                    type: object
                    properties:
                      extended_existing_suppression: { type: boolean }
                      does_not:
                        type: array
                        items: { type: string }
                      max_minutes_allowed: { type: integer }
                      policy_source: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /alarms:reconcile-work-orders:
    post:
      tags: [IoT & Alarms]
      operationId: reconcileAlarmWorkOrders
      summary: 批次補串未關聯工單的告警
      description: |
        需要 `work_order:create`（FACILITY 範圍）。把「規則說要自動建單、但沒有
        工單」的告警補上工單 —— `GET /alarms?unlinked_only=true` 診斷出的缺口的
        修復動作。

        ### 為什麼 `facility_id` 是必填

        `work_order:create` 是 FACILITY 範圍的權限。跨場域掃描只有兩種收場：
        對沒有權限的場域靜默跳過（把部分成功回報成成功），或整批失敗（讓有權限
        的部分也修不了）。因此**修復逐場域，診斷仍是租戶級**。

        ### 回應區分四種「沒有補」

        只回一個 `reconciled: N` 會讓「沒有缺口」與「有缺口但全部被跳過」長得
        一樣。因此：

        | 欄位 | 意義 |
        |---|---|
        | `reconciled` | 這一輪真的補了幾張 |
        | `already_linked` | 讀出候選之後被別人（或規則引擎）補上的 —— 競態，不是失敗 |
        | `remaining_gap` | 這一輪上限之外還剩幾筆。**不看這個數字，一次呼叫看起來就像全部補完了** |
        | `meta.skipped_suppressed` | 抑制中的告警。`raise_alarm` 在抑制期間也不自動建單，這裡補了會讓同一個條件依「是誰觸發的」得到不同結果 |
        | `meta.skipped_rule_does_not_auto_create` | **不是缺口** —— 這些規則本來就沒開自動建單。要為它們建單請用 `POST /alarms/{id}/work-order` |

        最後一項若算進缺口，這個數字會永遠降不到 0，於是沒有人再看它。

        補單走 migration 056 的條件式 `UPDATE … WHERE work_order_id IS NULL`，
        因此與規則引擎的自動建單互斥，重複呼叫是幂等的。
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [facility_id]
              additionalProperties: false
              properties:
                facility_id: { type: string, format: uuid }
                limit:
                  type: integer
                  minimum: 1
                  maximum: 500
                  default: 50
      responses:
        '200':
          description: 已對帳
          content:
            application/json:
              schema:
                type: object
                required:
                  - facility_id
                  - reconciled
                  - already_linked
                  - remaining_gap
                  - gap_before
                  - meta
                properties:
                  facility_id: { type: string, format: uuid }
                  reconciled: { type: integer }
                  already_linked: { type: integer }
                  remaining_gap: { type: integer }
                  gap_before: { type: integer }
                  meta:
                    type: object
                    properties:
                      limit_applied: { type: integer }
                      skipped_suppressed: { type: integer }
                      skipped_suppressed_reason: { type: string }
                      skipped_rule_does_not_auto_create: { type: integer }
                      skipped_rule_reason: { type: string }
                      diagnosis_endpoint: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /alarms/{alarmId}/work-order:
    post:
      tags: [IoT]
      operationId: createWorkOrderFromAlarm
      summary: 由告警產生工單（人工補串）
      description: 針對規則未設定自動建單、或歷史未串接的告警，提供一鍵補建並回填關聯。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: alarmId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                work_order_type: { type: string, default: CORRECTIVE }
                priority: { type: string, default: HIGH }
                team_id: { type: string, format: uuid }
                assignee_id: { type: string, format: uuid }
                title: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkOrder' }
        '409':
          description: 該告警已關聯工單
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ---------------------------------------------------------------------------
  # Admin
  # ---------------------------------------------------------------------------
  /users:
    get:
      tags: [Admin]
      operationId: listUsers
      summary: 查詢使用者
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: q
          in: query
          schema: { type: string }
        - name: org_id
          in: query
          schema: { type: string, format: uuid }
        - name: role_code
          in: query
          schema: { type: string }
        - name: facility_id
          in: query
          schema: { type: string, format: uuid }
        - name: user_type
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/User' }

    post:
      tags: [Admin]
      operationId: createUser
      summary: 建立使用者（本地帳號／外包）
      description: >
        建立的帳號狀態為 INVITED 且**沒有密碼**。設定密碼屬於
        POST /auth/password/change 或 SSO —— 由管理員代設初始密碼，
        意味著那個密碼曾經被第三人知道。
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '409':
          description: username／email／employee_no 在租戶內重複
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /users/{userId}:
    patch:
      tags: [Admin]
      operationId: updateUser
      summary: 更新使用者
      description: >
        不能改 username（那是身分，改它會讓既有的稽核與工單指向另一個名字）
        或 status（走 /users/{userId}/suspend）。可為 null 的欄位支援
        明確設為 null 以清空。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserPatch' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '404': { description: 找不到 }
  /users/{userId}/suspend:
    post:
      tags: [Admin]
      operationId: suspendUser
      summary: 停用或註銷使用者
      description: >
        停用而不是刪除：users 被工單、稽核、角色指派、預約引用。
        不能停用自己 —— 若操作者是租戶最後一個管理員，就沒有人能把他放回來。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [SUSPENDED, DEPROVISIONED]
                  default: SUSPENDED
                reason: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '404': { description: 找不到 }
  /users/{userId}/role-assignments:
    get:
      tags: [Admin]
      operationId: listRoleAssignments
      summary: 授權清單
      description: |
        需要 `role:read` **或** `role:assign`。

        原本只寫 `role:read`，但目錄裡 `role:read` 宣告 TENANT、`role:assign`
        宣告 ORG，而 `ORG_MANAGER` 只有後者 —— 照原契約實作的結果是
        **指派得了角色卻看不到自己指派了什麼**，連撤銷都做不到
        （`DELETE /role-assignments/{id}` 要 id，而 id 只能從這支拿）。

        改成兩者取其一之後，今天沒有任何角色失去存取：持有 `role:read` 的
        三個角色都同時持有 `role:assign`。

        **包含已到期的指派**（`valid_until` 在過去）——
        「他為什麼上週還進得來」是這支端點要回答的問題之一。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/RoleAssignment' }
    post:
      tags: [Admin]
      operationId: assignRole
      summary: 指派角色（含 scope）
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role_code, scope_type]
              properties:
                role_code: { type: string, example: FACILITY_ADMIN }
                scope_type: { type: string, enum: [TENANT, ORG, FACILITY, SPATIAL_NODE] }
                scope_id: { type: string, format: uuid }
                valid_until: { type: string, format: date-time }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleAssignment' }
        '403':
          description: |
            提權防護擋下。回應的 detail 會列出**是哪幾項危險權限** ——
            只說「不行」會讓對方開一張工單來問。
        '422': { $ref: '#/components/responses/ValidationError' }

  /role-assignments/{id}:
    delete:
      tags: [Admin]
      operationId: revokeRoleAssignment
      summary: 撤銷授權
      description: |
        範圍判定用**那筆指派自己的範圍**，不是請求帶來的參數 ——
        否則「我宣稱它在我的 org 裡」就足以撤銷任何一筆。

        兩種情況回 422 而不是 204：
        * `source = DIRECTORY_SYNC`：下一輪同步會再建回來，
          回 204 等於報告一個不會成立的結果。改群組對應。
        * 撤銷自己的角色：與 `POST /users/{id}/suspend` 同一條理由 ——
          若那是你最後一個管理角色，就沒有人能把你放回來。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: 已撤銷 }
        '404': { description: 找不到這筆角色指派 }
        '422': { $ref: '#/components/responses/ValidationError' }

  /skills:
    get:
      tags: [Admin]
      operationId: listSkills
      summary: 技能目錄（平台 + 租戶自訂）
      description: |
        需要 `team:read`。回傳平台技能（`tenant_id = null`，migration 055）
        與本租戶的自訂技能。

        `requires_certification` 標的不是「這件事很難」，而是**法規要求執業
        證照**（電氣、電梯、消防、鍋爐、高空作業）。那個欄位決定
        `user_skills.expires_at` 是不是必要的業務事實。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: domain
          in: query
          description: 依領域過濾（MEP／SAFETY／SECURITY／FABRIC…）
          schema: { type: string }
        - name: requires_certification
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Skill' }
    post:
      tags: [Admin]
      operationId: createSkill
      summary: 建立租戶自訂技能
      description: |
        需要 `team:write`。建立**本租戶**的技能（RLS 保證寫不到平台目錄）。

        **契約原本沒有這一支。** 加它的理由是量出來的：`fms.skills` 與
        `fms.user_skills` 從 004 就存在但**兩張都是空的**，而契約只列了
        兩支 GET —— 照字面實作會交付兩個永遠回空清單的端點。
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                code: { type: string }
                name: { type: string }
                domain: { type: string }
                requires_certification: { type: boolean, default: false }
                reminder_days_before:
                  type: integer
                  minimum: 1
                  maximum: 365
                  default: 30
                  description: 到期前幾天開始提醒（見 Skill schema）
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Skill' }
        '409': { description: 這個租戶已經有同樣 code 的技能 }
        '422': { $ref: '#/components/responses/ValidationError' }

  /users/{userId}/skills:
    get:
      tags: [Admin]
      operationId: listUserSkills
      summary: 使用者的技能與證照（含到期狀態）
      description: |
        需要 `team:read`。

        **到期狀態是算出來的，不是存的**：`status` 由 `expires_at` 與今天
        比較得出（`VALID`／`EXPIRING`／`EXPIRED`／`NOT_APPLICABLE`）。
        存下來的話它會在沒有人更新的那一天開始說謊。

        `EXPIRING` 的門檻由 `expiring_within_days` 決定（預設 30）——
        那是**呼叫端該決定的條件**，不是後端該寫死的數字。

        **到期提醒（掃描＋通知）尚未實作。** 這支端點回答「這個人現在的狀態」，
        但沒有任何東西會主動告訴管理員「下個月有三張證照到期」。
        004 的 `idx_user_skills_expiring` 是為那件事建的，目前仍無讀者。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: expiring_within_days
          in: query
          description: 幾天內到期算 EXPIRING
          schema: { type: integer, default: 30 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/UserSkill' }

  /users/{userId}/skills/{skillId}:
    put:
      tags: [Admin]
      operationId: setUserSkill
      summary: 指派或更新使用者的技能與證照
      description: |
        需要 `team:write`。**upsert** —— `user_skills` 的主鍵是
        `(user_id, skill_id)`，同一個人同一項技能只有一列。

        `requires_certification = true` 的技能**必須帶 `expires_at`**：
        沒有到期日的證照紀錄無法回答「他現在還能不能做這件事」，
        而那正是這張表存在的理由。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: skillId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                level: { type: integer, minimum: 1, maximum: 5, default: 1 }
                certified_at: { type: string, format: date }
                expires_at: { type: string, format: date }
                certificate_no: { type: string }
      responses:
        '200':
          description: 已建立或更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserSkill' }
        '404': { description: 找不到這個使用者或技能 }
        '422': { $ref: '#/components/responses/ValidationError' }

  /audit-log:export:
    post:
      tags: [Admin]
      operationId: exportAuditLog
      summary: 匯出稽核（非同步產檔）
      description: |
        需要 `audit:export`（TENANT 範圍；該權限 `is_dangerous`）。

        **非同步不是裝飾。** `audit_log` 是全庫唯一按月分割的表，
        一次合規匯出可能跨數百萬列 —— 同步做會佔住一條請求執行緒。
        這支端點只建立作業並回 `202`，實際產檔由 worker 進行。

        過濾條件與 `GET /audit-log` 相同，語意也相同。**不帶任何條件
        代表匯出全部** —— 那是合法的，但回應的 `meta.warning` 會說出來。

        **匯出的內容限縮在發起者的可見範圍。** worker 跑在平台情境下，
        但它會以 `requested_by` 的身分重新注入情境再查，
        否則一次匯出就繞過了 `audit_log` 的 `facility_scope`（見 migration 053）。

        欄位與 `GET /audit-log` 一致 —— 一樣不含 `before_data`／`after_data`。
        匯出是同一份讀取的批次形式，不是更寬的投影；要看整列快照是另一個
        需要另一層授權的決定。
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                entity_type: { type: string }
                entity_id: { type: string, format: uuid }
                actor_user_id: { type: string, format: uuid }
                action: { type: string }
                from: { type: string, format: date-time }
                to: { type: string, format: date-time }
      responses:
        '202':
          description: 作業已建立
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditExport' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /audit-log/exports/{id}:
    get:
      tags: [Admin]
      operationId: getAuditExport
      summary: 查詢匯出作業狀態
      description: |
        需要 `audit:export`。

        契約原本只有 `POST /audit-log:export`。**只有那一支的話，
        發起者拿不回檔案** —— 非同步作業必須有一個可輪詢的資源，
        否則 202 之後就沒有下文了。

        `status = COMPLETED` 時回傳 `download_url`（預簽網址，有期限）。
        `FAILED` 時回傳 `error`，而不是一個空的成功。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditExport' }
        '404': { description: 找不到這個匯出作業 }

  /directory-groups:
    get:
      tags: [Auth & Identity]
      operationId: listDirectoryGroups
      summary: 已同步的 AD/Entra 群組
      description: |
        需要 `identity_provider:read`（TENANT 範圍）。

        **這些列不是這個系統寫的。** `directory_groups` 與
        `user_directory_groups` 在 Phase 1 由外部填入 —— 「去外部目錄抓成員
        關係」那一半需要 LDAP／Graph 客戶端，Phase 1 沒有。因此
        `POST /identity-providers/{id}/sync` **不會**讓這張表長出新列，
        它只做「已知的成員關係 → 角色指派」的對帳。

        這件事寫在回應的 `meta.populated_by` 裡，因為「為什麼清單是空的」
        這個問題的答案不在這個系統裡。

        ### 兩個覆蓋缺口的計數

        * `groups_never_synced` —— `last_synced_at` 是 null。建了一列但從未
          真的同步過，對應到它的規則永遠不會產生角色指派。
        * `groups_not_mapped_to_any_role` —— 同步進來了卻沒有任何對應。
          目錄裡有這個群組，但它在 FMS 裡不代表任何權限。

        兩者都**跨整個租戶計算**，不是只算這一頁 —— 這一頁剛好沒問題，
        不代表沒問題。

        `role_mapping_count` 只算 `directory_group_id` 相符的對應，
        **不算只填 `claim_value` 的**：對帳是內連接 `directory_groups`，
        因此那種對應永遠不會產生角色指派，算進來會讓這個數字說謊。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: identity_provider_id
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, page, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/DirectoryGroup' }
                  page: { $ref: '#/components/schemas/PageMeta' }
                  meta:
                    type: object
                    required:
                      - total_groups
                      - groups_never_synced
                      - groups_not_mapped_to_any_role
                      - populated_by
                    properties:
                      total_groups: { type: integer }
                      groups_never_synced: { type: integer }
                      groups_not_mapped_to_any_role: { type: integer }
                      populated_by: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }

  /directory-role-mappings:
    get:
      tags: [Admin]
      operationId: listDirectoryRoleMappings
      summary: 群組→角色對應清單
      description: |
        目錄同步時把「使用者屬於哪些群組」翻成 `user_role_assignments`
        的規則。`source = DIRECTORY_SYNC` 的授權都是這裡產生的 ——
        `DELETE /role-assignments/{id}` 拒絕撤銷那類授權，並指向這裡。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: is_active
          in: query
          description: 只回啟用（或只回停用）的對應
          schema: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/DirectoryRoleMapping' }
    post:
      tags: [Admin]
      operationId: createDirectoryRoleMapping
      summary: 建立群組→角色對應
      description: |
        需要 `role:write`（TENANT 範圍）。

        **提權防護與 `POST /users/{id}/role-assignments` 是同一道**
        （`fms.role_grant_blocked_by`，migration 052）。少了它，這支端點就是
        一條繞道：`TENANT_ADMIN` 直接指派 `PLATFORM_ADMIN` 會被 052 擋下
        （他沒有 `user:impersonate`），但只要把一個目錄群組對應到
        `PLATFORM_ADMIN`，下一輪同步就把同一件事做完了。

        **`directory_group_id` 為必填，而 `claim_value` 不接受寫入**
        （migration 077）。002 原本允許「兩個來源二選一」，只填 `claim_value`
        也回 201 —— 但同步的對帳（058）是對 `directory_groups` 的內連接，
        那種對應會被靜默丟掉：建得起來、回 201、永遠不授予任何角色、沒有症狀。

        這與下方 `SPATIAL_NODE` 的 422 是同一個判斷：一條永遠不會生效的授權
        規則不是資訊不足，是設定錯誤。要對應一個群組，先讓它同步進來
        （`POST /identity-providers/{id}/sync`）。
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DirectoryRoleMappingCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DirectoryRoleMapping' }
        '403':
          description: |
            這個角色帶有你未持有的危險權限。detail 會列出是哪幾項。
        '422': { $ref: '#/components/responses/ValidationError' }

  /directory-role-mappings/{id}:
    delete:
      tags: [Admin]
      operationId: deleteDirectoryRoleMapping
      summary: 刪除對應
      description: |
        需要 `role:write`。

        **刪除對應不會撤銷已經發出的授權。** 那些 `user_role_assignments`
        仍然存在，直到下一輪目錄同步把它們收回。回應的 `meta` 會告訴你
        目前有幾筆授權還掛在這條對應上 —— 少了那個數字，
        「我刪掉對應了，為什麼他還進得來」會變成一次除錯。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 已刪除
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: string, format: uuid }
                  orphaned_assignments:
                    type: integer
                    description: |
                      仍掛在這條對應上的授權筆數。它們**不會**被這次刪除移除，
                      要等下一輪目錄同步。
        '404': { description: 找不到這條對應 }

  /roles:
    get:
      tags: [Admin]
      operationId: listRoles
      summary: 角色（平台 + 租戶自訂）
      description: |
        需要 `role:read` **或** `role:assign`，理由與
        `GET /users/{userId}/role-assignments` 完全相同：目錄裡只有
        `PLATFORM_ADMIN` 與 `TENANT_ADMIN` 持有 `role:read`，而 `ORG_MANAGER`
        持有 `role:assign` —— 照原本的 `role:read` 實作，他**指派得了角色卻
        列不出有哪些角色可以指派**，UI 連下拉選單都填不出來。

        回傳平台角色（`tenant_id = null`）與本租戶的自訂角色。
        每一列都帶 `permissions`（權限碼陣列）—— 權限矩陣 UI 的資料來源。

        **不分頁。** 角色是目錄不是資料：現行 12 個平台角色 + 0 個自訂角色，
        而自訂角色的數量級是「幾個」。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: q
          in: query
          description: 對 code 與 name 做子字串比對（不分大小寫）
          schema: { type: string }
        - name: assignable_only
          in: query
          description: 只回 `is_assignable = true` 的角色
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Role' }
    post:
      tags: [Admin]
      operationId: createRole
      summary: 建立自訂角色
      description: |
        建立**本租戶**的自訂角色（`tenant_id` 為目前租戶、`is_system = false`）。
        需要 `role:write`，且必須在 **TENANT 範圍**持有 —— `role:write` 的
        `min_scope_level` 就是 TENANT，而角色目錄是租戶級資源。

        **不能把自己沒有的危險權限放進新角色。** 這是縱深防禦而不是缺口：
        提權鏈「鑄造含任意權限的角色 → 指派給自己」的第二步已經被 052 擋住
        （`fms.role_grant_blocked_by`）。但一個沒有人指派得了的角色仍然是地雷 ——
        它會出現在角色清單裡，而「為什麼這個角色永遠指派不了」是一次除錯。
        擋在鑄造這一步，錯誤訊息才說得出原因。
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '403':
          description: |
            新角色含有建立者未持有的危險權限。detail 會列出是哪幾項。
        '409':
          description: |
            code 重複。兩種情況：本租戶已有同名自訂角色，或**與平台角色同名**。

            後者資料庫其實允許（唯一索引的鍵是
            `coalesce(tenant_id, 全零 uuid)`，兩者分屬不同命名空間），
            但指派時 `role_code` 會解析到租戶角色而遮蔽平台角色 ——
            結果是「指派了卻什麼都不能做」，且沒有任何錯誤訊息。
        '422': { $ref: '#/components/responses/ValidationError' }

  /permissions:
    get:
      tags: [Admin]
      operationId: listPermissions
      summary: 權限字典（權限矩陣 UI 用）
      description: |
        平台層的權限目錄，與租戶無關。需要 `role:read`。

        **`is_dangerous` 不是裝飾。** migration 052 之後它決定「誰可以把這項
        權限授出去」：你不能授出一項你自己沒有的危險權限。UI 必須看得到它，
        否則管理員無法理解 `POST /users/{id}/role-assignments` 為什麼回 403。

        `min_scope_level` 同理（026 執行它）：一項宣告 TENANT 的權限，
        指派在 ORG 範圍時**不會生效** —— 那不是錯誤，是靜默地少了東西。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: module
          in: query
          description: 依模組過濾（CORE／ASSET／MAINTENANCE／SERVICE／RESERVATION／IOT／ADMIN）
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Permission' }

  /audit-log:
    get:
      tags: [Admin]
      operationId: listAuditLog
      summary: 查詢稽核日誌
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: entity_type
          in: query
          schema: { type: string }
        - name: entity_id
          in: query
          schema: { type: string, format: uuid }
        - name: actor_user_id
          in: query
          schema: { type: string, format: uuid }
        - name: action
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AuditEntry' }

  # ---------------------------------------------------------------------------
  # Reporting
  # ---------------------------------------------------------------------------
  /reports/pm-compliance:
    get:
      tags: [Reporting]
      operationId: getPmComplianceReport
      summary: PM 準時完成率
      description: |
        需要 `report:read`。

        **三個分母是分開的，而那是這支端點最重要的性質。** 主分母
        （`scheduled_total`）只含**已經有結果**的期次：準時、逾時、漏做。
        兩類被排除的各自具名回傳：

        * `excluded_in_window` —— 還在容許窗內、尚無結果。它們還有機會，
          算進分母會讓「這個月才剛開始」看起來像執行不力。
        * `excluded_skipped` —— 被跳過的，附 `skip_reasons` 分佈。

        為什麼一定要並列而不能挑一個：把 skip 算進分母，「全部跳過」得到 0%
        （看起來像糟糕的執行）；完全不計算，「全部跳過」得到 100%
        （看起來完美）。**兩者都是謊。** ADR-12 已經替 SLA 定過同形的規則。

        **`on_time_rate` 在分母為 0 時是 null，不是 0。**「這段期間沒有任何
        期次」與「全部沒做」是完全不同的兩件事。

        **`missed` 是算出來的**（`missed_is_derived: true`）——
        `maintenance_occurrences.status` 從來不會是 `MISSED`，見 migration 063。

        容許窗來自每個計畫的 `completion_grace_days`（管理者定義）。
        `grace_days` 參數可覆寫做情境分析，而 `meta.grace_source` 會回報實際
        用的是哪一個 —— 少了它，兩份不同前提算出來的報表看起來一模一樣。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: group_by
          in: query
          schema:
            type: string
            enum: [facility, plan, none]
            default: facility
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
        - name: grace_days
          in: query
          description: 覆寫每個計畫的容許窗做情境分析。不寫入任何東西
          schema: { type: integer, minimum: 0, maximum: 365 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PmComplianceRow' }
                  meta:
                    type: object
                    properties:
                      group_by: { type: string }
                      from: { type: string, format: date }
                      to: { type: string, format: date }
                      grace_source: { type: string }
                      grace_days_override: { type: [integer, 'null'] }
                      missed_is_derived: { type: boolean }
        '422': { $ref: '#/components/responses/ValidationError' }

  /reports/group-rollup:
    get:
      tags: [Reporting]
      operationId: getGroupRollupReport
      summary: 集團跨組織彙總（依 org 子樹）
      description: |
        需要 `report:read`。

        **每一列是子樹的總和**（`organizations.org_path` 的 ltree `<@`），
        不是直屬設施 —— 逐層爬 `parent_id` 會讓中間層漏掉孫節點的設施，
        於是「集團」那一列的數字比它底下各分公司的總和還小。

        因此 **`meta.rows_are_cumulative = true`**：父組織的數字**包含**子組織的。
        前端把各列相加會得到重複計算的總數。

        `pm_on_time_rate` 在分母為 0 時是 null 而不是 0 ——
        與 `/reports/pm-compliance` 同一條規則。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
        - name: subtree_of
          in: query
          description: 只算這個組織的子樹（含自己）。省略時回整棵樹
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/GroupRollupRow' }
                  meta:
                    type: object
                    properties:
                      from: { type: string, format: date }
                      to: { type: string, format: date }
                      subtree_of: { type: [string, 'null'], format: uuid }
                      rows_are_cumulative:
                        type: boolean
                        description: true = 父組織含子組織，各列相加會重複計算
                      subtree_basis: { type: string }
        '422': { $ref: '#/components/responses/ValidationError' }

  /reports/asset-reliability:
    get:
      tags: [Reporting]
      operationId: getAssetReliabilityReport
      summary: MTBF / MTTR / 故障 Top N
      description: |
        需要 `report:read`。

        **MTBF 與 MTTR 來源不同，不能混：**

        * `mttr_hours` 來自工單（`completed_at - created_at`，CORRECTIVE）—— 修復花多久
        * `mtbf_hours` 來自 `asset_status_history` 的故障間隔 —— 兩次故障之間撐多久

        **`mtbf_hours` 為 null 有兩種原因，而它們不同**：區間內只有一次故障
        （算不出間隔），或完全沒有故障。前者是「還不知道」，後者是「很可靠」。
        看 `failure_count` 才分得開 —— 只看 MTBF 為 null 會把兩者混成一件事。
        回 0 更糟：那看起來像設備一直在壞。

        **`meta.history_covers_full_range` 必須看。** `asset_status_history` 的第一列
        是 migration 064 裝上觸發器之後才出現的 —— 在那之前設備的故障歷史
        **不存在**。那個旗標為 false 時，這份 MTBF 涵蓋的區間比你要求的短，
        而一個剛裝好記錄的系統會回報極長的 MTBF（因為還沒有第二次故障），
        看起來像設備很可靠。

        只回**有事發生過**的設備（有故障或有維修工單）—— 全部設備都回會讓
        Top N 被一堆 0 淹沒。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
        - name: facility_id
          in: query
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, default: 50, minimum: 1, maximum: 500 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AssetReliabilityRow' }
                  meta:
                    type: object
                    properties:
                      from: { type: string, format: date }
                      to: { type: string, format: date }
                      limit: { type: integer }
                      mtbf_source: { type: string }
                      mttr_source: { type: string }
                      earliest_history_at: { type: [string, 'null'], format: date-time }
                      history_covers_full_range:
                        type: boolean
                        description: false = MTBF 涵蓋不到要求的整個區間
        '422': { $ref: '#/components/responses/ValidationError' }

  /reports/space-utilization:
    get:
      tags: [Reporting]
      operationId: getSpaceUtilizationReport
      summary: 空間使用率與 No-show
      description: |
        需要 `report:read`。**兩個分母都不是「所有預約」。**

        **使用率的分母是可預約時數**，不是 24 小時。一間只在上班時間開放的
        會議室用 24 小時當分母永遠不會超過 35%，於是那個百分比無法用來判斷
        「要不要再隔一間會議室」。來源在 `hours_basis`：
        `resource.opening_hours` → `facility.operating_hours` → `assumed_24h`。

        時數逐日累加而不是「每日時數 × 天數」：星期不同時數不同，而場域那一層
        走的是營業時間解析器，所以休館日算 0。形狀是
        `{"mon": [["08:00","21:00"]], ...}`（星期鍵 → 時段陣列）。

        `assumed_24h` 代表那個資源與它的場域都沒設營運時間 ——
        **那一列的百分比不可與有設定的比較**，而 `meta.resources_with_assumed_hours`
        說出有幾列是這種情況。

        **no-show 的分母只含 `requires_check_in` 的預約**，而且讀的是
        **預約自己那一份旗標**（建立時從資源快照下來的），與產生 `NO_SHOW`
        的背景作業同一欄。改讀資源上的現值會讓分子與分母來自兩個地方：
        事後把資源的旗標打開，一批永遠不可能變成 `NO_SHOW` 的舊預約會被
        拉進分母。不需要報到的預約永遠不可能是 no-show，把它算進分母會
        系統性地壓低那個比率 ——
        而那個數字的用途正是「該不該對 no-show 收費」。
        `checkin_required` 就是那個分母；它為 0 時 `no_show_rate` 是 null
        而不是 0（「沒有任何需要報到的預約」與「都報到了」是不同的事）。

        已取消／被拒的預約不佔用時段，所以不進 `booked_hours`，但單獨計數。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
        - name: facility_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/SpaceUtilizationRow' }
                  meta:
                    type: object
                    properties:
                      from: { type: string, format: date }
                      to: { type: string, format: date }
                      resources_with_assumed_hours:
                        type: integer
                        description: 分母是猜的列數。> 0 時整份報表的可比性受限
                      no_show_denominator: { type: string }
        '422': { $ref: '#/components/responses/ValidationError' }

  /reports/service-volume:
    get:
      tags: [Reporting]
      operationId: getServiceVolumeReport
      summary: 軟性服務量與成本（可 chargeback）
      description: |
        需要 `report:read`。

        **三種成本分開回傳**（`labor_cost`／`parts_cost`／`other_cost`），
        因為它們的爭議點不同（工時費率、料件單價、外包發票）——
        一個總和無法對帳。

        **`work_orders_without_rate` 是這支端點最重要的數字。** 它是「有工時但
        工時成本為 0」的張數，也就是**費率未知**的工單。那不是免費 ——
        `POST /work-orders/{id}/labor` 在沒有 `hourly_rate` 時把 `cost` 留 NULL
        正是為了不讓「未知」變成「0」。把它當 0 加總會讓 chargeback 帳單
        安靜地偏低，而收到帳單的人不會知道少算了什麼。

        `meta.cost_is_lower_bound` 為 true 時，金額是**下限**而不是實際值。

        `is_chargeback` 與 `chargeback_org_id` 是既有欄位（`fms-workorder` 的
        DTO 與 repo 已經在讀），所以「可 chargeback」不是這支端點發明的概念。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
        - name: group_by
          in: query
          schema:
            type: string
            enum: [service_item, facility, org]
            default: service_item
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ServiceVolumeRow' }
                  meta:
                    type: object
                    properties:
                      from: { type: string, format: date }
                      to: { type: string, format: date }
                      group_by: { type: string }
                      work_orders_without_rate: { type: integer }
                      cost_is_lower_bound:
                        type: boolean
                        description: true = 金額是下限，有工單的工時成本未知
        '422': { $ref: '#/components/responses/ValidationError' }

  /reports/facility-dashboard:
    get:
      tags: [Reporting]
      operationId: getFacilityDashboard
      summary: 設施儀表板彙總
      description: |
        單一請求回傳前端首頁所需的全部彙總，避免 N 次 round-trip。

        ## SLA 的數字來自 `/reports/sla-compliance` 的同一支函式

        `sla.compliance_pct` 與 `work_orders.avg_resolution_minutes` 是
        `fms.report_sla_compliance(group_by='facility', …)` 的輸出，
        **不是這裡重新算的**。ADR-12 定義了量測規則（分開的分母、
        排除與替代），自己再算一遍必然與報表漂移，而那時沒有人知道
        哪一個是對的。

        因此 `strictness` 固定用 `strict` —— 與報表的預設一致。

        ## 兩個百分比的定義寫在這裡，因為它們沒有唯一正確答案

        **`space.utilization_pct`** ＝ 期間內 `CONFIRMED`／`CHECKED_IN`／
        `COMPLETED` 的預約總分鐘數 ÷（可預約節點數 × 期間總分鐘數）。

        分母用**期間總分鐘數**而不是營業時間：後者要看每個場域的
        `business_hours`，而那會讓同一個數字在不同場域之間不可比。
        代價是絕對值偏低 —— 這個指標的用途是看趨勢與比較，不是看絕對值。

        **`maintenance.pm_compliance_pct`** ＝ 期間內 `COMPLETED` 的
        PM 排程 ÷（`COMPLETED` + `MISSED`）。`SKIPPED` 不計入分母 ——
        它是有人刻意跳過並留下 `skip_reason` 的，算成未達成會懲罰
        正確的決定。`PLANNED`／`GENERATED`（還沒到期）也不計入。

        ## 答不出來的指標回 `null`，不回 0

        `null` 代表「沒有資料可以算」（例如期間內沒有任何納入 SLA 的工單），
        `0` 代表「算出來是 0」。兩者混用會讓前端把「沒資料」畫成一條貼底的線。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: facility_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: period
          in: query
          schema: { type: string, enum: [today, 7d, 30d, mtd, qtd], default: 30d }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FacilityDashboard' }

  /reports/{reportCode}:export:
    post:
      tags: [Reporting]
      operationId: exportReport
      summary: 匯出報表（非同步產檔）
      description: |
        需要 `report:export`。回 `202` 並建立一個作業，實際產檔由 worker 進行，
        用 `GET /reports/exports/{id}` 輪詢。

        **`reportCode` 是既有那幾支 `GET /reports/*` 的代碼**，不是另一套命名。
        可匯出的是六支表格型報表：`sla-compliance`、`pm-compliance`、
        `group-rollup`、`asset-reliability`、`space-utilization`、
        `service-volume`。

        `facility-dashboard` **不在其中**：它回的是一個彙總物件而不是列，
        沒有表頭可寫。那不是遺漏 —— 那支端點的用途是首頁的單一請求，
        要匯出它的內容請匯出它底下那幾支。

        `from` 與 `to` 必填。稽核匯出允許「不帶條件＝匯出全部」，
        但報表函式沒有那個語意（`p_from` 是 NOT NULL 的參數），
        所以在建立作業時就擋掉，而不是讓它在產檔時失敗 ——
        那時發起者已經拿到 202 了。

        其餘參數與那支 `GET` 端點的查詢參數同名（例如 `group_by`、
        `facility_id`、`strictness`、`grace_days`、`subtree_of`、`limit`）。
        **未知的參數鍵回 422 而不是忽略**：忽略一個打錯的 `facilty_id`
        會產出一份範圍比預期大的檔案，而它看起來完全正常 —— 有資料、
        狀態 COMPLETED、列數是個合理的數字，然後那份檔案會被拿去談合約。

        **匯出的內容限縮在發起者的可見範圍。** 六支報表函式都是
        `SECURITY INVOKER`，worker 跑在平台情境下但會以 `requested_by`
        的身分重新注入情境（含場域範圍）再查。少了那一步，一次匯出就會
        產出整個資料庫。

        表頭的順序取自函式的 `RETURNS TABLE` 宣告（`pg_proc.proargnames`），
        不是手抄的一份清單 —— 手抄的會在某次改欄位之後安靜地錯位，
        而 CSV 除了表頭沒有任何校驗。

        `null` 的儲存格是**空白**而不是 `null` 這個字。報表的 null 有意義
        （「分母為 0，算不出來」），而 `"null"` 在試算表裡會變成一個看起來
        像資料的值。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: reportCode
          in: path
          required: true
          schema:
            type: string
            enum: [sla-compliance, pm-compliance, group-rollup, asset-reliability,
                   space-utilization, service-volume]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to]
              properties:
                from: { type: string, format: date }
                to: { type: string, format: date }
                format:
                  type: string
                  enum: [csv, xlsx]
                  default: csv
                group_by: { type: string }
                strictness: { type: string }
                grace_days: { type: integer }
                facility_id: { type: string, format: uuid }
                subtree_of: { type: string, format: uuid }
                limit: { type: integer }
      responses:
        '202':
          description: 作業已建立
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportExport' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /reports/exports/{id}:
    get:
      tags: [Reporting]
      operationId: getReportExport
      summary: 查詢報表匯出作業狀態
      description: |
        需要 `report:export`。

        契約原本只有 `POST /reports/{reportCode}:export`。**只有那一支的話，
        發起者拿不回檔案** —— 非同步作業必須有一個可輪詢的資源，否則 202
        之後就沒有下文。稽核匯出（#20）遇過同一件事。

        `status = COMPLETED` 時回傳 `download_url`（預簽網址，有期限）。
        `FAILED` 時 `error` 一定有值 —— migration 066 的 CHECK 保證這件事，
        所以「還在跑」與「早就死了」不會長得一樣。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 作業狀態
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportExport' }
        '404': { description: 找不到這個匯出作業 }

  /reports/sla-compliance:
    get:
      tags: [Reporting]
      operationId: getSlaCompliance
      summary: SLA 達成率（可按組織／設施／團隊彙總）
      description: |
        量測規則見 ADR-12。三件事會讓這支端點的回應與直覺不同，都是刻意的：

        1. **回應與解決有不同的分母。** PM 產生的工單不計入回應指標
           （「多久有人回應」對三個月前就排好的保養單沒有意義），但計入解決。
           因此不存在單一的 `compliance_pct` —— 提供那個欄位會讓兩個不可比的
           百分比看起來可比。
        2. **`excluded_*` 與 `substituted_*` 是回應的一部分，不是除錯資訊。**
           一個沒有附上排除數的達成率，無法判斷它是不是被挑選過的。
        3. **期間以 `created_at` 篩選**，不是 `resolution_due_at`。後者會在
           工單重開時改變，用它分期會讓上個月的報表事後變動。

        尚未可判定的工單（還沒逾期也還沒做完）計入 `excluded_in_flight`，
        不進分母 —— 它們的結果還不存在。
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: group_by
          in: query
          schema: { type: string, enum: [facility, org, team, service_item, priority], default: facility }
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          description: 含當日（以 Asia/Taipei 的日界計算）。
          schema: { type: string, format: date }
        - name: strictness
          in: query
          description: |
            `strict`（合約用）排除宣告了 `business_hours_only` 的 policy —— 營業時間
            內的經過時間目前算不出來（缺假日表），把它當自然時間計會用寬鬆的
            分母報一個看起來嚴格的數字。

            `operational`（內部監控用）納入它們、以自然時間計，並計入
            `substituted_business_hours`。

            兩者是**同一支計算的參數**，不是兩份實作。
          schema: { type: string, enum: [strict, operational], default: strict }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  meta:
                    type: object
                    required: [group_by, from, to, strictness, minutes_basis]
                    properties:
                      group_by: { type: string }
                      from: { type: string, format: date }
                      to: { type: string, format: date }
                      strictness: { type: string, enum: [strict, operational] }
                      minutes_basis:
                        type: string
                        enum: [WALLCLOCK]
                        description: |
                          `data[].avg_*_minutes` 是用什麼時間單位算的。

                          `WALLCLOCK` = 牆鐘時間，**包含夜間與週末**。一張週五
                          晚上開、週一上午修好的工單，達成率是達成，
                          而平均解決時間會是 2000 分鐘以上 —— 那不代表系統慢。

                          達成率（`*_compliance_pct`）不受影響：它比的是絕對
                          時刻，而期限本身已經是營業時間意義下算好的
                          （見 `business_hours_only`）。
                  data:
                    type: array
                    items:
                      type: object
                      required:
                        - group_key
                        - group_label
                        - response_total
                        - response_met
                        - response_breached
                        - resolution_total
                        - resolution_met
                        - resolution_breached
                      properties:
                        group_key:
                          type: string
                          nullable: true
                          description: 分組值（未指派時為 null，例如沒有團隊的工單）。
                        group_label: { type: string }
                        response_total:
                          type: integer
                          description: 回應指標的分母。已排除 PM 工單與尚未可判定者。
                        response_met: { type: integer }
                        response_breached: { type: integer }
                        response_compliance_pct:
                          type: number
                          nullable: true
                          description: 分母為 0 時是 null，不是 0 也不是 100。
                        avg_response_minutes:
                          type: number
                          nullable: true
                          description: |
                            僅計已回應者；從未回應的逾期工單沒有回應時長可平均
                            （它們仍在分母裡）。單位見 `meta.minutes_basis`。
                        resolution_total: { type: integer }
                        resolution_met: { type: integer }
                        resolution_breached: { type: integer }
                        resolution_compliance_pct: { type: number, nullable: true }
                        avg_resolution_minutes:
                          type: number
                          nullable: true
                          description: 單位見 `meta.minutes_basis`。
                        avg_waiting_minutes:
                          type: number
                          nullable: true
                          description: |
                            處於 `WAITING` 類別狀態的平均總時長。ADR-12 決定 D 不停錶，
                            因此這個數字是給讀報表的人自己判斷用的 —— 它已經計入了
                            上面的達成率。
                        reopened:
                          type: integer
                          description: |
                            期間內曾被重開的工單數。決定 E 把重開視為新的量測，
                            上面的數字反映的是**當前那一輪**；前幾輪的結果保留在
                            該筆 REOPEN 轉移的 metadata 裡。
                        excluded_no_policy:
                          type: integer
                          description: 解析不到 SLA policy（目錄缺口），沒有目標可比。
                        excluded_in_flight:
                          type: integer
                          description: 還沒逾期也還沒做完，結果尚不存在。
                        excluded_abandoned:
                          type: integer
                          description: 已取消或已駁回。沒有做完不代表逾期。
                        excluded_business_hours:
                          type: integer
                          description: |
                            `strict` 模式下被排除的工單：政策要求營業時間，但該場域
                            **沒有定義 `operating_hours`**，因此期限是用自然時間算的
                            （比預期緊得多）。

                            這個數字不是「有多少工單用營業時間計算」—— 那些工單
                            正常進入分母。它是**場域設定不完整的量測值**。
                        substituted_business_hours:
                          type: integer
                          description: |
                            `operational` 模式下納入的同一批工單（以自然時間代算）。
                            `excluded_business_hours` 與這個欄位在任一模式下必有一個為 0。
                        excluded_pm_response:
                          type: integer
                          description: 僅影響回應分母：PM 產生的工單（決定 G）。

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT 由 `/auth/token` 發放，或由租戶的 OIDC 提供者簽發後經 Gateway 驗證。
        Claims 至少包含：`sub`(user_id)、`tid`(tenant_id)、`scope`、`exp`。

    scimToken:
      type: http
      scheme: bearer
      description: |
        **只用於 `/scim/v2/*`。** 不是 JWT —— 是一個 256 bit 的不透明字串。

        由 `PATCH /identity-providers/{providerId}` 帶 `rotate_scim_token: true`
        產生，回應的 `meta.scim_token` 裡**只出現一次**：系統存的是 SHA-256
        雜湊（migration 074），沒有任何路徑能再讀出明文。

        這個 token 同時是**租戶的判別依據** —— SCIM 端點不接受 `X-Tenant-ID`
        （Entra ID 送不出來）。因此一個 token 只對應一個身分來源與一個租戶。

        `identity_providers.scim_enabled = false` 時，所有 token 立刻認不過。

  parameters:
    TenantId:
      name: X-Tenant-ID
      in: header
      required: true
      description: 租戶 ID。伺服端據此設定 RLS session 變數。
      schema: { type: string, format: uuid }
    OrgId:
      name: X-Org-ID
      in: header
      required: false
      description: 組織 ID，用於跨組織報表與組織級權限判定。
      schema: { type: string, format: uuid }
    FacilityIdHeader:
      name: X-Facility-ID
      in: header
      required: false
      description: 當前操作的設施；省略時以查詢參數為準。
      schema: { type: string, format: uuid }
    FacilityIdPath:
      name: facilityId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: 用戶端產生的追蹤 ID，會出現在日誌與稽核紀錄中。
      schema: { type: string, maxLength: 64 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 建立類請求的冪等鍵；24 小時內以相同鍵重放會回傳首次結果。
      schema: { type: string, maxLength: 120 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: 資源目前的 `version`（ETag）。不符時回 412。
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      description: 上一頁回應的 `page.next_cursor`
      schema: { type: string }
    Sort:
      name: sort
      in: query
      description: 逗號分隔欄位，`-` 前綴為降冪
      schema: { type: string, example: -created_at }
    Fields:
      name: fields
      in: query
      description: 稀疏欄位集合，逗號分隔
      schema: { type: string, example: id,wo_no,status,priority }

  responses:
    Unauthorized:
      description: 未認證或權杖無效
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: 已認證但權限不足
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.fms.bizlution.com/problems/forbidden
            title: Forbidden
            status: 403
            code: PERMISSION_DENIED
            detail: 缺少 work_order:assign 權限（scope FACILITY cccccccc-...）
    NotFound:
      description: 資源不存在或不在可見範圍內
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: 與現有資料衝突
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PreconditionFailed:
      description: If-Match 版本不符（資料已被他人修改）
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.fms.bizlution.com/problems/version-conflict
            title: Version conflict
            status: 412
            code: STALE_VERSION
            detail: 目前版本為 7，請重新載入後再送出
    ValidationError:
      description: 欄位驗證失敗（含動態 form_schema 驗證）
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.fms.bizlution.com/problems/validation-error
            title: Validation failed
            status: 422
            code: VALIDATION_ERROR
            errors:
              - pointer: /payload/headcount
                code: MAXIMUM
                message: 人數不可超過 50
    TooManyRequests:
      description: 超出租戶限流
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    NotificationTemplate:
      type: object
      required: [id, is_platform, code, channel, locale, body_template, is_active, placeholders, is_overridden]
      properties:
        id: { type: string, format: uuid }
        is_platform:
          type: boolean
          description: 平台提供的範本 —— 讀得到但改不了，客製要建覆寫版本。
        code: { type: string }
        channel: { type: string, enum: [EMAIL, SMS, PUSH, WEBHOOK, IN_APP, LINE] }
        locale: { type: string }
        subject_template: { type: string, nullable: true }
        body_template: { type: string }
        is_active: { type: boolean }
        placeholders:
          type: array
          description: |
            這個範本用到的 `{{變數}}`。與端點說明列的可用變數對照 ——
            打錯的變數會原樣出現在收件人眼前。
          items: { type: string }
        is_overridden:
          type: boolean
          description: |
            僅對平台範本有意義：這個 `(code, channel, locale)` 已被租戶覆寫，
            因此**這一列不會生效**。少了這個欄位，UI 無法解釋
            「我改了那一列卻沒有作用」。

    NotificationTemplateCreate:
      type: object
      required: [code, channel, body_template]
      properties:
        code: { type: string, minLength: 1, maxLength: 50 }
        channel: { type: string, enum: [EMAIL, SMS, PUSH, WEBHOOK, IN_APP, LINE] }
        locale: { type: string, default: zh-TW }
        subject_template: { type: string, nullable: true }
        body_template: { type: string, minLength: 1 }
        is_active: { type: boolean, default: true }

    NotificationTemplateUpdate:
      type: object
      description: 只有提供的欄位會被更新。`code`／`channel`／`locale` 不可變更。
      properties:
        subject_template: { type: string, nullable: true }
        body_template: { type: string, minLength: 1 }
        is_active: { type: boolean }

    Notification:
      type: object
      required: [id, body, priority, created_at]
      properties:
        id: { type: string, format: uuid }
        subject: { type: string, nullable: true }
        body: { type: string }
        priority: { type: string, enum: [LOW, NORMAL, HIGH] }
        entity_type: { type: string, nullable: true }
        entity_id: { type: string, format: uuid, nullable: true }
        template_code: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        read_at: { type: string, format: date-time, nullable: true }

    Holiday:
      type: object
      required: [id, holiday_date, name, is_working_day]
      properties:
        id: { type: string, format: uuid }
        facility_id:
          type: string
          format: uuid
          nullable: true
          description: '`null` 代表租戶通用（場域專屬優先）。'
        holiday_date: { type: string, format: date }
        name: { type: string }
        is_working_day:
          type: boolean
          description: 'false = 放假；true = 補班（該日照上班）。'
        windows:
          type: array
          nullable: true
          description: |
            補班日的時段；`null` 表示沿用該星期在 `facilities.operating_hours`
            裡的班表。
          items:
            type: array
            minItems: 2
            maxItems: 2
            items: { type: string, pattern: '^([01][0-9]|2[0-4]):[0-5][0-9]$' }

    HolidayCreate:
      type: object
      required: [holiday_date, name]
      properties:
        facility_id: { type: string, format: uuid, nullable: true }
        holiday_date: { type: string, format: date }
        name: { type: string, minLength: 1, maxLength: 100 }
        is_working_day: { type: boolean, default: false }
        windows:
          type: array
          nullable: true
          items: { type: array, items: { type: string } }

    HolidayUpdate:
      type: object
      description: 只有提供的欄位會被更新。
      properties:
        facility_id: { type: string, format: uuid, nullable: true }
        holiday_date: { type: string, format: date }
        name: { type: string, minLength: 1, maxLength: 100 }
        is_working_day: { type: boolean }
        windows:
          type: array
          nullable: true
          items: { type: array, items: { type: string } }

    SlaPolicy:
      type: object
      required: [id, code, name, response_minutes, resolution_minutes, business_hours_only, is_active]
      properties:
        id: { type: string, format: uuid }
        facility_id:
          type: string
          format: uuid
          nullable: true
          description: '`null` 代表租戶通用（影響每一個場域）。'
        code: { type: string }
        name: { type: string }
        applies_to_priority:
          type: string
          nullable: true
          enum: [LOW, MEDIUM, HIGH, URGENT, CRITICAL]
          description: '`null` 代表適用所有優先度。'
        response_minutes: { type: integer }
        resolution_minutes: { type: integer }
        business_hours_only:
          type: boolean
          description: |
            期限只計場域營業時間內的分鐘。班表來自 `facilities.operating_hours`
            與 `holiday_calendars`（假日與補班日）。

            **計算發生在開單那一刻**：`resolution_due_at` 本身就是營業時間
            意義下的絕對期限，因此掃描與報表不需要任何營業時間邏輯，
            而之後改班表或補假日都不會移動已開立工單的期限（ADR-12 決定 F）。

            若場域沒有定義 `operating_hours`，期限會退回自然時間並在工單上
            標記（見 `GET /reports/sla-compliance` 的
            `excluded_business_hours`）。
        escalation_rules:
          type: array
          description: |
            預警規則。門檻 = `at_pct < 100` 的最小值；空陣列或只有
            `at_pct: 100` 代表不預警。`notify` 目前**沒有任何消費者**
            （見 ENDPOINTS.md 的背景作業說明）。
          items:
            type: object
            required: [at_pct]
            properties:
              at_pct:
                type: number
                exclusiveMinimum: 0
                maximum: 100
              notify:
                type: array
                items: { type: string }
              escalate_priority: { type: boolean }
        is_active: { type: boolean }

    SlaPolicyCreate:
      type: object
      required: [code, name, response_minutes, resolution_minutes]
      properties:
        facility_id: { type: string, format: uuid, nullable: true }
        code: { type: string, minLength: 1, maxLength: 50 }
        name: { type: string, minLength: 1 }
        applies_to_priority:
          type: string
          nullable: true
          enum: [LOW, MEDIUM, HIGH, URGENT, CRITICAL]
        response_minutes: { type: integer, minimum: 1 }
        resolution_minutes: { type: integer, minimum: 1 }
        business_hours_only: { type: boolean, default: true }
        escalation_rules:
          type: array
          default: []
          items: { type: object }

    SlaPolicyUpdate:
      type: object
      description: 只有提供的欄位會被更新。`code` 不可變更 —— 它是政策的識別。
      properties:
        name: { type: string, minLength: 1 }
        facility_id: { type: string, format: uuid, nullable: true }
        applies_to_priority:
          type: string
          nullable: true
          enum: [LOW, MEDIUM, HIGH, URGENT, CRITICAL]
        response_minutes: { type: integer, minimum: 1 }
        resolution_minutes: { type: integer, minimum: 1 }
        business_hours_only: { type: boolean }
        escalation_rules:
          type: array
          items: { type: object }
        is_active: { type: boolean }

    # -------------------------------------------------------------------------
    # SCIM 2.0（RFC 7643 資源、RFC 7644 協定）
    # -------------------------------------------------------------------------
    # 這四個 schema 刻意用 camelCase 且不帶 `{data}` 封裝 —— 它們是 SCIM 的
    # 線上格式，不是本 API 的慣例。混用會讓端點兩邊都不對。
    ScimError:
      type: object
      description: |
        RFC 7644 §3.12。**取代 problem+json**：Entra ID 解析的是這個結構，
        回 problem+json 它只會顯示「未知錯誤」。
      required: [schemas, status]
      properties:
        schemas:
          type: array
          items: { type: string }
          example: ['urn:ietf:params:scim:api:messages:2.0:Error']
        status:
          type: string
          description: HTTP 狀態碼，**字串**（規範如此 —— 送數字會讓嚴格的客戶端解析失敗）。
          example: '400'
        scimType:
          type: string
          description: |
            規範定義的一組固定值。Entra 的同步報告會顯示它，
            因此它決定管理者在畫面上看到什麼。
          enum: [invalidFilter, tooMany, uniqueness, mutability, invalidSyntax,
                 invalidPath, invalidValue, noTarget, sensitive]
        detail: { type: string }

    ScimListResponse:
      type: object
      required: [schemas, totalResults, Resources]
      properties:
        schemas:
          type: array
          items: { type: string }
          example: ['urn:ietf:params:scim:api:messages:2.0:ListResponse']
        totalResults:
          type: integer
          description: 符合 filter 的總數（不受 count 限制）。
        itemsPerPage: { type: integer }
        startIndex:
          type: integer
          description: '**1-based**。'
        Resources:
          type: array
          description: 鍵名首字大寫 —— 規範如此，小寫會讓客戶端看到零筆結果。
          items:
            oneOf:
              - $ref: '#/components/schemas/ScimUser'
              - $ref: '#/components/schemas/ScimGroup'

    ScimUser:
      type: object
      required: [userName]
      properties:
        schemas:
          type: array
          items: { type: string }
          example: ['urn:ietf:params:scim:schemas:core:2.0:User']
        id:
          type: string
          format: uuid
          readOnly: true
          description: 本系統的 `users.id`。
        externalId:
          type: string
          description: |
            供裝端的識別碼（Entra 的物件 id），存進 `user_identities.external_subject`。
            未提供時以本系統的 `id` 填入 —— 該欄位是 NOT NULL 且與 provider 組唯一鍵。
        userName: { type: string }
        displayName:
          type: string
          description: |
            未提供時依序退化為「givenName familyName」→ `userName`
            （`users.display_name` 是 NOT NULL）。
        name:
          type: object
          properties:
            givenName: { type: string }
            familyName: { type: string }
        emails:
          type: array
          description: '寫入時取 `primary: true` 那一筆，否則第一筆（`users.email` 是單值）。'
          items:
            type: object
            properties:
              value: { type: string }
              type: { type: string }
              primary: { type: boolean }
        phoneNumbers:
          type: array
          items:
            type: object
            properties:
              value: { type: string }
              type: { type: string }
        title:
          type: string
          description: 對應 `users.job_title`。
        active:
          type: boolean
          description: |
            對應四個狀態：`ACTIVE` → true，`INVITED`／`SUSPENDED` → false。
            寫入 false 時存 `SUSPENDED`（可復原），不是 `DEPROVISIONED`。
            `DEPROVISIONED` 的使用者讀不到（等同已刪除）。

            讀取時也接受字串 `"True"`／`"False"` —— 不合規範，但 Entra 會送。
        meta:
          type: object
          readOnly: true
          properties:
            resourceType: { type: string, example: User }
            created: { type: string, format: date-time }
            lastModified: { type: string, format: date-time }
            location: { type: string }

    ScimGroup:
      type: object
      required: [displayName]
      properties:
        schemas:
          type: array
          items: { type: string }
          example: ['urn:ietf:params:scim:schemas:core:2.0:Group']
        id:
          type: string
          format: uuid
          readOnly: true
          description: 本系統的 `directory_groups.id`。
        externalId:
          type: string
          description: 對應 `external_group_id`。未提供時產生一個 uuid。
        displayName: { type: string }
        members:
          type: array
          description: |
            `value` 必須是**此身分來源佈建的**使用者 id。有任何一個不是就整批
            拒絕 —— 只加入一部分會讓 Entra 顯示成功，而漏掉的人拿不到角色。

            不支援巢狀成員（群組屬於群組）：`user_directory_groups` 只接受使用者。
          items:
            type: object
            properties:
              value: { type: string, format: uuid }
              display: { type: string, readOnly: true }
              type: { type: string, example: User }
        meta:
          type: object
          readOnly: true
          properties:
            resourceType: { type: string, example: Group }
            created: { type: string, format: date-time }
            lastModified:
              type: string
              format: date-time
              description: |
                `directory_groups` 沒有 `updated_at` 欄位（002），因此這裡回
                `created_at`。回一個偏舊的值比省略它好 —— 省略會讓客戶端走進
                「重讀全部資源」的路徑。
            location: { type: string }

    ScimPatchOp:
      type: object
      required: [Operations]
      properties:
        schemas:
          type: array
          items: { type: string }
          example: ['urn:ietf:params:scim:api:messages:2.0:PatchOp']
        Operations:
          type: array
          description: 鍵名首字大寫（RFC 7644 §3.5.2）。
          items:
            type: object
            required: [op]
            properties:
              op:
                type: string
                description: 大小寫不敏感 —— Entra 送的是 `Replace`。
                enum: [add, replace, remove, Add, Replace, Remove]
              path:
                type: string
                description: |
                  省略時 `value` 必須是物件，其鍵即為路徑（Entra 會送這種形式）。
                  群組的移除支援 `members[value eq "<uuid>"]`。
              value:
                description: 值。單值屬性放純量，`members` 放陣列。
    Problem:
      type: object
      description: RFC 9457 Problem Details，額外加上 `code` 與 `errors` 便於前端處理。
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code:
          type: string
          description: 穩定的機器可讀錯誤碼，用於前端 i18n 對照
          example: RESERVATION_CONFLICT
        request_id: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              pointer: { type: string, description: JSON Pointer }
              code: { type: string }
              message: { type: string }

    PageMeta:
      type: object
      properties:
        next_cursor:
          type: [string, 'null']
        limit: { type: integer }
        total_estimate:
          type: [integer, 'null']
          description: 大表上為估算值；需精確總數請帶 count=exact（較慢）

    PagedEnvelope:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items: {}
        page: { $ref: '#/components/schemas/PageMeta' }

    TokenRequest:
      type: object
      required: [grant_type]
      properties:
        grant_type:
          type: string
          enum: [password, authorization_code, client_credentials, refresh_token]
        tenant_code: { type: string, description: password grant 時用來定位租戶 }
        username:
          type: string
          description: |
            password grant 的**登入識別碼**：`users.email` 或 `users.username`
            皆可，兩者都不分大小寫（欄位型別是 `citext`）。email 命中優先 ——
            兩者是不同欄位、各自只在租戶內唯一，因此「A 的 username 等於 B 的
            email」是允許的狀態，優先 email 可避免有人用 username 截走別人的
            登入嘗試。

            欄位名維持 `username` 而不另開一個 `email`：email 並非必填
            （`users.email` 可為 NULL，外包與 Kiosk 帳號通常沒有），那些帳號
            仍必須能以 username 登入。
          example: someone@example.com
        password: { type: string, format: password }
        code: { type: string }
        code_verifier: { type: string }
        redirect_uri: { type: string }
        identity_provider_code: { type: string }
        client_id: { type: string }
        client_secret: { type: string }
        scope: { type: string }

    TokenResponse:
      type: object
      properties:
        access_token: { type: string }
        token_type: { type: string, example: Bearer }
        expires_in: { type: integer, example: 3600 }
        refresh_token: { type: string }
        tenant_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        must_change_password: { type: boolean }

    CurrentUser:
      type: object
      properties:
        user: { $ref: '#/components/schemas/User' }
        tenant:
          type: object
          properties:
            id: { type: string, format: uuid }
            code: { type: string }
            name: { type: string }
            industry: { type: string }
            feature_flags: { type: object, additionalProperties: true }
        accessible_facilities:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              code: { type: string }
              name: { type: string }
              org_id: { type: string, format: uuid }
        roles:
          type: array
          items:
            type: object
            properties:
              role_code: { type: string }
              scope_type: { type: string }
              # TENANT 範圍的授權沒有 scope_id：user_role_assignments 的
              # ck_ura_scope 明訂 scope_type='TENANT' 時 scope_id 必須為 NULL，
              # 因此此欄位可為 null（與本檔其他可為空的 uuid 寫法一致）。
              scope_id: { type: [string, 'null'], format: uuid }
        permissions:
          type: array
          description: 已展開的權限清單，格式 `permission@scope_type:scope_id`
          items: { type: string }
          example: ['work_order:assign@FACILITY:cccccccc-0000-4000-8000-000000000001']

    IdentityProvider:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        provider_type: { type: string, enum: [OIDC, SAML2, LDAP, LOCAL] }
        scope_org_path: { type: [string, 'null'] }
        issuer: { type: [string, 'null'] }
        jit_provisioning: { type: boolean }
        sync_enabled: { type: boolean }
        scim_enabled: { type: boolean }
        is_default: { type: boolean }
        status: { type: string }
        last_sync_at: { type: [string, 'null'], format: date-time }

    DirectoryGroup:
      type: object
      properties:
        id: { type: string, format: uuid }
        identity_provider_id: { type: string, format: uuid }
        external_group_id:
          type: string
          description: AD 的 objectGUID／Entra 的 group id。
        name: { type: string }
        distinguished_name: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        member_count:
          type: integer
          description: |
            **目錄那邊**回報的人數，由同步流程寫入。與
            `member_count_in_fms` 不一致代表有成員在 FMS 裡沒有對應的使用者。
        member_count_in_fms:
          type: integer
          description: '`user_directory_groups` 裡實際指向這個群組的列數。'
        role_mapping_count:
          type: integer
          description: |
            對應到這個群組的 `directory_role_mappings` 條數（只算
            `directory_group_id` 相符的）。0 代表這個群組不代表任何權限。
        last_synced_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }

    ResourceBlackout:
      type: object
      properties:
        id: { type: string, format: uuid }
        facility_id: { type: string, format: uuid }
        bookable_resource_id:
          type: [string, 'null']
          format: uuid
          description: '`null` 代表整個場域被封鎖，不是資料缺漏。'
        resource_name:
          type: [string, 'null']
          description: 資源顯示名稱。全場域封鎖時為 null。
        start_at: { type: string, format: date-time }
        end_at: { type: string, format: date-time }
        reason: { type: string }
        blackout_type:
          type: string
          enum: [MAINTENANCE, HOLIDAY, RENOVATION, PRIVATE_EVENT, EMERGENCY, OTHER]
        work_order_id: { type: [string, 'null'], format: uuid }
        work_order_no: { type: [string, 'null'] }
        created_by: { type: [string, 'null'], format: uuid }
        created_at: { type: string, format: date-time }

    WebhookSubscription:
      type: object
      description: |
        **不含 `signing_secret`。** migration 072 對 `fms_app` 做了欄位級
        `REVOKE SELECT (signing_secret)`，因此任何端點都讀不到它。
      properties:
        id: { type: string, format: uuid }
        url: { type: string, format: uri }
        event_types: { type: array, items: { type: string } }
        description: { type: [string, 'null'] }
        is_active: { type: boolean }
        consecutive_failures:
          type: integer
          description: 連續失敗數，成功即歸零。達門檻會自動停用。
        disabled_at: { type: [string, 'null'], format: date-time }
        disabled_reason:
          type: [string, 'null']
          description: |
            `null` ＝ 客戶自己關的；有值 ＝ 系統因連續失敗自動關的。
            那兩件事的處置完全不同。
        last_success_at: { type: [string, 'null'], format: date-time }
        last_failure_at: { type: [string, 'null'], format: date-time }
        last_error: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    WebhookUpsertResponse:
      type: object
      required: [data, signing_secret, meta]
      properties:
        data: { $ref: '#/components/schemas/WebhookSubscription' }
        signing_secret:
          type: [string, 'null']
          description: |
            256 bit 的十六進位字串，**只在新建時有值**。這是它唯一一次出現。
            更新既有訂閱時為 null（不重新產生 —— 換掉會讓對方的驗證全部失敗）。
        meta:
          type: object
          properties:
            secret_shown_once: { type: boolean }
            secret_note: { type: string }
            signature_scheme: { type: string }
            url_checked_at_creation_and_at_every_delivery: { type: string }

    DirectorySyncRun:
      type: object
      properties:
        id: { type: string, format: uuid }
        run_type:
          type: string
          enum: [FULL, DELTA, SCHEDULED]
          description: |
            `FULL`／`DELTA` 是 `POST .../sync` 的請求體指定的；`SCHEDULED`
            是排程觸發（`sync_cron`），不是任何人手動觸發 —— 見 migration 078／
            `fms_identity::directory_sync_watchdog`。資料庫的 CHECK 約束還
            允許 `SCIM_PUSH`／`MANUAL`，但目前沒有任何寫入路徑會產生它們。
        status: { type: string, enum: [RUNNING, SUCCEEDED, PARTIAL, FAILED] }
        groups_synced: { type: integer }
        roles_granted:
          type: integer
          description: 這一輪**真的新增**的授權數（已存在的不計）
        roles_revoked:
          type: integer
          description: |
            這一輪收回的授權數。**同步會收回**——人離開群組、對應被停用或
            刪除，由它產生的授權都會消失。只動 `source = DIRECTORY_SYNC`，
            人工指派永不受影響。
        error_summary:
          type: [string, 'null']
          description: |
            `PARTIAL` 時列出**被提權防護擋下的角色**。那不是系統錯誤，
            是設定問題：這條對應設定了但不會生效，而它必須看得見。
        started_at: { type: string, format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }

    IdentityProviderCreate:
      type: object
      required: [code, name, provider_type]
      properties:
        code: { type: string }
        name: { type: string }
        provider_type: { type: string, enum: [OIDC, SAML2, LDAP, LOCAL] }
        scope_org_id: { type: string, format: uuid }
        issuer: { type: string }
        discovery_url: { type: string }
        client_id: { type: string }
        client_secret_ref:
          type: string
          description: 密鑰管理服務中的參照名稱；API 不接受明文密鑰
        ldap_host: { type: string }
        ldap_port: { type: integer, default: 636 }
        ldap_base_dn: { type: string }
        ldap_bind_dn: { type: string }
        ldap_bind_secret_ref: { type: string }
        attribute_mapping: { type: object, additionalProperties: true }
        group_claim_name: { type: string, default: groups }
        jit_provisioning: { type: boolean, default: true }
        jit_default_role_code: { type: string }
        auto_deprovision: { type: boolean, default: false }
        sync_enabled: { type: boolean, default: false }
        sync_cron: { type: string, example: '0 */4 * * *' }

    Organization:
      type: object
      properties:
        id: { type: string, format: uuid }
        parent_id: { type: [string, 'null'], format: uuid }
        code: { type: string }
        name: { type: string }
        org_type: { type: string }
        org_path: { type: string, example: GRP.PROP }
        depth: { type: integer }
        cost_center: { type: [string, 'null'] }
        facility_count: { type: integer }
        status: { type: string }

    OrganizationCreate:
      type: object
      required: [code, name, org_type]
      properties:
        parent_id: { type: string, format: uuid }
        code: { type: string, maxLength: 50 }
        name: { type: string, maxLength: 200 }
        org_type: { type: string, enum: [GROUP, COMPANY, BUSINESS_UNIT, REGION, DEPARTMENT, TEAM] }
        cost_center: { type: string }
        manager_user_id: { type: string, format: uuid }
        attributes: { type: object, additionalProperties: true }

    Facility:
      type: object
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        facility_type: { type: string }
        address_line1: { type: [string, 'null'] }
        city: { type: [string, 'null'] }
        country_code: { type: string }
        timezone: { type: string }
        latitude: { type: [number, 'null'] }
        longitude: { type: [number, 'null'] }
        gross_area_sqm: { type: [number, 'null'] }
        operating_hours: { type: object, additionalProperties: true }
        status: { type: string }
        version: { type: integer }

    FacilityCreate:
      type: object
      required: [org_id, code, name]
      properties:
        org_id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        facility_type: { type: string }
        address_line1: { type: string }
        city: { type: string }
        country_code: { type: string, minLength: 2, maxLength: 2 }
        timezone: { type: string, default: Asia/Taipei }
        gross_area_sqm: { type: number }
        operating_hours: { type: object, additionalProperties: true }
        attributes: { type: object, additionalProperties: true }

    SpatialNode:
      type: object
      properties:
        id: { type: string, format: uuid }
        facility_id: { type: string, format: uuid }
        parent_id: { type: [string, 'null'], format: uuid }
        node_type_code: { type: string }
        code: { type: string }
        name: { type: string }
        node_path: { type: string, example: BLDG_A.FL04.R401 }
        depth: { type: integer }
        floor_level: { type: [integer, 'null'] }
        floor_label: { type: [string, 'null'] }
        area_sqm: { type: [number, 'null'] }
        capacity: { type: integer }
        is_bookable: { type: boolean }
        status: { type: string }
        health_score: { type: [number, 'null'] }
        utilization_pct: { type: [number, 'null'] }
        bim_element_id: { type: [string, 'null'] }
        asset_count: { type: integer }
        open_work_order_count: { type: integer }
        children:
          type: array
          description: 僅在 view=tree 時出現
          items: { $ref: '#/components/schemas/SpatialNode' }

    SpatialNodeCreate:
      type: object
      required: [node_type_code, code, name]
      properties:
        parent_id: { type: string, format: uuid }
        node_type_code: { type: string }
        code: { type: string }
        name: { type: string }
        floor_level: { type: integer }
        floor_label: { type: string }
        area_sqm: { type: number }
        capacity: { type: integer }
        is_bookable: { type: boolean, default: false }
        bim_model_id: { type: string, format: uuid }
        bim_element_id: { type: string }
        geometry: { type: object, additionalProperties: true }
        attributes: { type: object, additionalProperties: true }

    BimModel:
      type: object
      properties:
        id: { type: string, format: uuid }
        facility_id: { type: string, format: uuid }
        name: { type: string }
        source_format: { type: string }
        version_label: { type: [string, 'null'] }
        discipline: { type: [string, 'null'] }
        status: { type: string }
        element_count: { type: integer }
        mapped_node_count: { type: integer }
        mapped_asset_count: { type: integer }
        unresolved_count: { type: integer }
        viewer_urn: { type: [string, 'null'] }
        parsed_at: { type: [string, 'null'], format: date-time }

    BimModelCreate:
      type: object
      required: [name, storage_key]
      properties:
        name: { type: string }
        source_format: { type: string, enum: [IFC, RVT, NWD, DWG, GLTF, OTHER], default: IFC }
        version_label: { type: string }
        discipline: { type: string }
        storage_bucket: { type: string, default: fms-bim }
        storage_key: { type: string }
        auto_map: { type: boolean, default: true, description: 是否自動嘗試對應空間節點與設備 }

    UnresolvedBimElement:
      type: object
      properties:
        bim_element_id: { type: string }
        element_type: { type: string, example: IfcUnitaryEquipment }
        name: { type: string }
        floor_label: { type: [string, 'null'] }
        suggested_asset_ids:
          type: array
          items: { type: string, format: uuid }
        suggested_category_code: { type: [string, 'null'] }
        reason: { type: string, example: NO_MATCHING_ASSET_CODE }

    CalendarIntegration:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        facility_id: { type: [string, 'null'], format: uuid }
        provider: { type: string, enum: [MS365, GOOGLE] }
        status: { type: string, enum: [PENDING_CONSENT, ACTIVE, REVOKED, ERROR] }
        ms_tenant_id: { type: [string, 'null'], description: 'Microsoft 365 專用：客戶的 Azure AD 租戶 GUID' }
        sync_cron: { type: string, example: '*/5 * * * *' }
        last_synced_at: { type: [string, 'null'], format: date-time }
        last_sync_error: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        admin_consent_url:
          type: string
          description: |
            只在建立回應（`POST`）且 `provider: MS365` 時出現。給客戶的
            M365 系統管理員完成 admin consent 用——完成後客戶會拿到自己的
            Azure AD 租戶 id，須另外提供給我們填入 `ms_tenant_id`（見
            `registerCalendarIntegration` 的說明，目前沒有自動回呼）。

    CalendarIntegrationCreate:
      type: object
      required: [provider]
      properties:
        provider: { type: string, enum: [MS365, GOOGLE] }
        ms_tenant_id:
          type: string
          description: 留空時整合停在 PENDING_CONSENT，填了才會變成 ACTIVE。

    AttributeDefinition:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: [string, 'null'], format: uuid }
        target_entity: { type: string }
        applies_to_type: { type: [string, 'null'] }
        attribute_key: { type: string }
        label: { type: string }
        data_type: { type: string }
        is_required: { type: boolean }
        is_searchable: { type: boolean }
        default_value: {}
        validation_schema:
          type: object
          description: |
            JSON Schema。POST /assets 拿它驗 attributes ——
            **在 API 層，不是資料庫觸發器**。
        ui_hints: { type: object }
        display_order: { type: integer }
        is_active: { type: boolean }
    AssetCategory:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenant_id:
          type: [string, 'null']
          format: uuid
          description: null = 平台分類（所有租戶共用）
        parent_id: { type: [string, 'null'], format: uuid }
        code: { type: string }
        name: { type: string }
        category_path:
          type: string
          description: ltree 路徑。前端要畫樹的話這比逐層查父節點便宜得多
        depth: { type: integer, description: 根 = 0 }
        domain: { type: string }
        default_criticality: { type: string }
        is_active: { type: boolean }
        asset_count:
          type: integer
          description: |
            **含子分類**的設備數。只算自己的話中間層永遠是 0，看起來像沒人用。
    AssetWorkOrderHistoryRow:
      type: object
      properties:
        id: { type: string, format: uuid }
        wo_no: { type: string }
        work_order_type: { type: string }
        source: { type: string }
        title: { type: string }
        status: { type: string }
        priority: { type: string }
        created_at: { type: string, format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
        labor_minutes: { type: integer }
        labor_cost:
          type: [number, 'null']
          description: null 代表明細列沒有費率 —— 成本未知，不是 0
        parts_cost: { type: [number, 'null'] }
    AssetStatusChange:
      type: object
      properties:
        id: { type: integer, format: int64 }
        from_status: { type: [string, 'null'] }
        to_status: { type: string }
        reason: { type: [string, 'null'] }
        work_order_id: { type: [string, 'null'], format: uuid }
        work_order_no: { type: [string, 'null'] }
        changed_by:
          type: [string, 'null']
          format: uuid
          description: |
            **null = 系統依規則自動改的**（例如計量規則把設備降為 DEGRADED），
            不是缺漏 —— 那與「某個人手動改的」是不同的事實。
        changed_by_name: { type: [string, 'null'] }
        changed_at: { type: string, format: date-time }
    AssetMeterReading:
      type: object
      properties:
        id: { type: integer, format: int64 }
        reading_at: { type: string, format: date-time }
        value: { type: number }
        source:
          type: string
          enum: [MANUAL, IOT, IMPORT, ESTIMATED]
          description: ESTIMATED 的值不該拿去算合約用的用量
        recorded_by: { type: [string, 'null'], format: uuid }
        delta:
          type: [number, 'null']
          description: |
            與時間上前一筆的差值（視窗函式在分頁之前算，頁邊界那一筆也有值）。
            計量表是累計值，而人們要的通常是「這段期間用了多少」。
    AssetModel:
      type: object
      properties:
        id: { type: string, format: uuid }
        is_platform: { type: boolean }
        category_code: { type: string }
        manufacturer: { type: string }
        model_no: { type: string }
        name: { type: string }
        specifications: { type: object, additionalProperties: true }
        supported_protocols:
          type: array
          items: { type: string }
        expected_life_months: { type: [integer, 'null'] }

    Asset:
      type: object
      properties:
        id: { type: string, format: uuid }
        facility_id: { type: string, format: uuid }
        spatial_node_id: { type: [string, 'null'], format: uuid }
        spatial_node_path: { type: [string, 'null'] }
        asset_code: { type: string }
        name: { type: string }
        serial_no: { type: [string, 'null'] }
        category_code: { type: string }
        asset_model_id: { type: [string, 'null'], format: uuid }
        parent_asset_id: { type: [string, 'null'], format: uuid }
        criticality: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL] }
        status: { type: string }
        install_date: { type: [string, 'null'], format: date }
        warranty_end_date: { type: [string, 'null'], format: date }
        health_score: { type: [number, 'null'] }
        last_telemetry_at: { type: [string, 'null'], format: date-time }
        open_work_order_count: { type: integer }
        active_alarm_count: { type: integer }
        specifications: { type: object, additionalProperties: true }
        attributes: { type: object, additionalProperties: true }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AssetCreate:
      type: object
      required: [facility_id, asset_code, name, category_code]
      properties:
        facility_id: { type: string, format: uuid }
        spatial_node_id: { type: string, format: uuid }
        parent_asset_id: { type: string, format: uuid }
        asset_model_id: { type: string, format: uuid }
        category_code: { type: string }
        asset_code: { type: string }
        name: { type: string }
        serial_no: { type: string }
        criticality: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL] }
        status: { type: string }
        install_date: { type: string, format: date }
        warranty_end_date: { type: string, format: date }
        purchase_cost: { type: number }
        currency: { type: string, minLength: 3, maxLength: 3 }
        custodian_user_id: { type: string, format: uuid }
        specifications: { type: object, additionalProperties: true }
        attributes:
          type: object
          additionalProperties: true
          description: 依 attribute_definitions 動態驗證

    AssetDetail:
      allOf:
        - $ref: '#/components/schemas/Asset'
        - type: object
          properties:
            children:
              type: array
              items: { $ref: '#/components/schemas/Asset' }
            relations:
              type: array
              items:
                type: object
                properties:
                  relation_type: { type: string }
                  direction: { type: string, enum: [upstream, downstream] }
                  asset: { $ref: '#/components/schemas/Asset' }
                  impact_level: { type: string }
            meters:
              type: array
              items:
                type: object
                properties:
                  meter_code: { type: string }
                  name: { type: string }
                  unit: { type: string }
                  last_value: { type: [number, 'null'] }
                  last_read_at: { type: [string, 'null'], format: date-time }
            maintenance_plans:
              type: array
              items: { $ref: '#/components/schemas/MaintenancePlan' }
            # getAsset 的 include 說明本來就列出 open_work_orders，
            # 但 AssetDetail 沒有對應欄位 —— 客戶端寫程式看的是 schema，
            # 兩邊不一致等於這個值不可用。補上並沿用既有的 WorkOrder schema
            # （不新造形狀）。伺服器端待工單模組實作後才提供。
            open_work_orders:
              type: array
              items: { $ref: '#/components/schemas/WorkOrder' }

    DependencyGraph:
      type: object
      properties:
        nodes:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              asset_code: { type: string }
              name: { type: string }
              category_code: { type: string }
              status: { type: string }
              criticality: { type: string }
        edges:
          type: array
          items:
            type: object
            properties:
              from: { type: string, format: uuid }
              to: { type: string, format: uuid }
              relation_type: { type: string }
              impact_level: { type: string }

    MaintenanceTemplate:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenant_id:
          type: [string, 'null']
          format: uuid
          description: null = 平台範本（所有租戶共用）。目前 0 筆
        code: { type: string }
        name: { type: string }
        description: { type: [string, 'null'] }
        applies_to_category_id: { type: [string, 'null'], format: uuid }
        applies_to_model_id: { type: [string, 'null'], format: uuid }
        maintenance_type:
          type: string
          enum: [PREVENTIVE, INSPECTION, CALIBRATION, DEEP_CLEAN, STATUTORY, PREDICTIVE]
        checklist: { type: array, items: { type: object } }
        estimated_minutes: { type: integer }
        required_skill_codes:
          type: array
          items: { type: string }
          description: |
            做這件保養需要的證照。建立時會驗證代碼存在，但**尚未**在派工時
            檢查執行者是否真的持有且未過期。
        required_part_codes: { type: array, items: { type: string } }
        safety_notes: { type: [string, 'null'] }
        requires_permit: { type: boolean }
        requires_shutdown: { type: boolean }
        is_active: { type: boolean }
        plan_count:
          type: integer
          description: 有幾個計畫在用這份範本。0 代表建了沒人用
        created_at: { type: string, format: date-time }
    MaintenanceOccurrence:
      type: object
      properties:
        id: { type: string, format: uuid }
        plan_id: { type: string, format: uuid }
        plan_code: { type: string }
        plan_name: { type: string }
        facility_id: { type: [string, 'null'], format: uuid }
        asset_id: { type: [string, 'null'], format: uuid }
        asset_code: { type: [string, 'null'] }
        scheduled_for: { type: string, format: date-time }
        status:
          type: string
          enum: [PLANNED, GENERATED, SKIPPED, COMPLETED, MISSED]
          description: |
            **永遠不會是 MISSED。** 那個值在 CHECK 裡但沒有任何東西寫它 ——
            「保養沒做」是一件沒有發生的事，所以由 is_missed 算出來。
        work_order_id: { type: [string, 'null'], format: uuid }
        work_order_no: { type: [string, 'null'] }
        skip_reason: { type: [string, 'null'] }
        generated_at: { type: [string, 'null'], format: date-time }
        completed_at:
          type: [string, 'null']
          format: date-time
          description: 由 migration 063 的觸發器從工單的 completed_at 同步而來
        grace_days:
          type: integer
          description: 計畫的容許窗。三個判定都用它算，所以一併回傳
        deadline: { type: string, format: date-time }
        is_missed:
          type: boolean
          description: 算出來的：過了容許窗而仍未完成
        is_late:
          type: boolean
          description: 已完成但超過容許窗
        days_late: { type: [number, 'null'] }
        created_at: { type: string, format: date-time }
    GroupRollupRow:
      type: object
      properties:
        org_id: { type: string, format: uuid }
        org_name: { type: string }
        org_path: { type: string, description: ltree 路徑 }
        depth: { type: integer }
        facility_count: { type: integer }
        work_orders_total: { type: integer }
        work_orders_open: { type: integer }
        work_orders_overdue: { type: integer }
        pm_scheduled: { type: integer }
        pm_on_time: { type: integer }
        pm_on_time_rate:
          type: [number, 'null']
          description: 分母為 0 時 null，不是 0
        total_cost: { type: number }
        chargeback_cost: { type: number }
    AssetReliabilityRow:
      type: object
      properties:
        asset_id: { type: string, format: uuid }
        asset_code: { type: string }
        asset_name: { type: string }
        facility_id: { type: string, format: uuid }
        criticality: { type: string }
        failure_count:
          type: integer
          description: 進入 DOWN／DEGRADED 的次數。與 mtbf_hours 一起看才分得開「還不知道」與「很可靠」
        corrective_orders: { type: integer }
        mttr_hours: { type: [number, 'null'], description: 來自工單 }
        mtbf_hours:
          type: [number, 'null']
          description: |
            來自 asset_status_history。**一次故障是 null 而不是 0** ——
            算不出間隔；0 會看起來像設備一直在壞。
        downtime_hours: { type: number }
        repair_cost: { type: number }
        history_since:
          type: [string, 'null']
          format: date-time
          description: 這台設備的歷程從什麼時候開始有（migration 064 之後）
    SpaceUtilizationRow:
      type: object
      properties:
        resource_id: { type: string, format: uuid }
        resource_name: { type: string }
        resource_type: { type: string }
        facility_id: { type: string, format: uuid }
        capacity: { type: [integer, 'null'] }
        reservations_total: { type: integer }
        booked_hours: { type: number }
        available_hours: { type: number, description: 可預約時數，不是 24 小時 }
        utilization_rate: { type: [number, 'null'] }
        hours_basis:
          type: string
          enum: [resource.opening_hours, facility.operating_hours, assumed_24h]
          description: assumed_24h 那一列的百分比不可與有設定的比較
        checkin_required:
          type: integer
          description: >-
            no-show 的分母 —— 只含 reservations.requires_check_in 為真的預約
            （與產生 NO_SHOW 的背景作業同一欄，不是資源上的現值）
        no_shows: { type: integer }
        no_show_rate:
          type: [number, 'null']
          description: checkin_required 為 0 時 null，不是 0
        cancelled: { type: integer }
    ServiceVolumeRow:
      type: object
      properties:
        group_key: { type: [string, 'null'] }
        group_label: { type: [string, 'null'] }
        requests: { type: integer }
        completed: { type: integer }
        labor_minutes: { type: integer }
        labor_cost: { type: number }
        parts_cost: { type: number }
        other_cost: { type: number }
        total_cost: { type: number }
        chargeback_requests: { type: integer }
        chargeback_cost: { type: number }
        work_orders_without_rate:
          type: integer
          description: |
            有工時但工時成本為 0 的張數 —— **費率未知，不是免費**。
            > 0 時這一列的金額是下限。
    PmComplianceRow:
      type: object
      properties:
        group_key: { type: [string, 'null'] }
        group_label: { type: [string, 'null'] }
        scheduled_total:
          type: integer
          description: 主分母 —— 只含已經有結果的期次（準時／逾時／漏做）
        completed_on_time: { type: integer }
        completed_late: { type: integer }
        missed:
          type: integer
          description: 算出來的，不是資料庫裡的狀態
        excluded_in_window:
          type: integer
          description: 還在容許窗內、尚無結果。不進分母 —— 它們還有機會
        excluded_skipped:
          type: integer
          description: 被跳過的。不進分母，但必須看得見
        skip_reasons:
          type: object
          description: 跳過理由的分佈。「全部跳過卻 100%」時唯一能解釋的東西
        avg_days_late: { type: [number, 'null'] }
        on_time_rate:
          type: [number, 'null']
          description: |
            **分母為 0 時是 null，不是 0。**「沒有任何期次」與「全部沒做」
            是完全不同的兩件事。
    MaintenancePlan:
      type: object
      properties:
        id: { type: string, format: uuid }
        facility_id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        template_id: { type: string, format: uuid }
        template_name: { type: string }
        target:
          type: object
          properties:
            type: { type: string, enum: [ASSET, SPATIAL_NODE, CATEGORY] }
            id: { type: string, format: uuid }
            label: { type: string }
        trigger_type: { type: string, enum: [CALENDAR, METER, CONDITION, HYBRID] }
        rrule: { type: [string, 'null'] }
        meter_code: { type: [string, 'null'] }
        meter_threshold: { type: [number, 'null'] }
        generate_lead_days: { type: integer }
        priority: { type: string }
        assigned_team_id: { type: [string, 'null'], format: uuid }
        next_due_at: { type: [string, 'null'], format: date-time }
        is_active: { type: boolean }

    MaintenancePlanCreate:
      type: object
      required: [facility_id, template_id, code, name, trigger_type]
      properties:
        facility_id: { type: string, format: uuid }
        template_id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        asset_id: { type: string, format: uuid }
        spatial_node_id: { type: string, format: uuid }
        category_code: { type: string }
        trigger_type: { type: string, enum: [CALENDAR, METER, CONDITION, HYBRID] }
        rrule: { type: string, example: FREQ=MONTHLY;INTERVAL=3;BYMONTHDAY=5 }
        meter_code: { type: string }
        meter_threshold: { type: number }
        generate_lead_days: { type: integer, default: 7 }
        priority: { type: string, default: MEDIUM }
        assigned_team_id: { type: string, format: uuid }
        sla_policy_id: { type: string, format: uuid }

    ServiceItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        facility_id: { type: [string, 'null'], format: uuid }
        category: { type: string }
        code: { type: string }
        name: { type: string }
        description: { type: [string, 'null'] }
        lead_time_minutes: { type: integer }
        default_duration_minutes: { type: integer }
        relative_offset_minutes:
          type: integer
          description: 相對於預約開始時間的偏移；-15 表示會議前 15 分鐘執行
        is_attachable_to_reservation: { type: boolean }
        is_standalone_requestable: { type: boolean }
        requires_approval: { type: boolean }
        chargeable: { type: boolean }
        unit_price: { type: [number, 'null'] }
        currency: { type: [string, 'null'] }
        unit_label: { type: [string, 'null'] }
        max_quantity: { type: [integer, 'null'] }
        form_schema:
          type: object
          additionalProperties: true
          description: JSON Schema，前端據此渲染動態表單
        sla:
          type: object
          properties:
            response_minutes: { type: integer }
            resolution_minutes: { type: integer }
        icon: { type: [string, 'null'] }
        display_order: { type: integer }

    WorkOrder:
      type: object
      properties:
        id: { type: string, format: uuid }
        wo_no: { type: string, example: WO-2026-000482 }
        facility_id: { type: string, format: uuid }
        work_order_type: { type: string }
        source: { type: string }
        title: { type: string }
        description: { type: [string, 'null'] }
        status: { type: string }
        status_category: { type: string, enum: [OPEN, IN_PROGRESS, WAITING, TERMINAL] }
        priority: { type: string }
        asset:
          type: [object, 'null']
          properties:
            id: { type: string, format: uuid }
            asset_code: { type: string }
            name: { type: string }
        location:
          type: [object, 'null']
          properties:
            spatial_node_id: { type: string, format: uuid }
            name: { type: string }
            node_path: { type: string }
        service_item_id: { type: [string, 'null'], format: uuid }
        reservation_id: { type: [string, 'null'], format: uuid }
        alarm_id: { type: [string, 'null'], format: uuid }
        requester:
          type: [object, 'null']
          properties:
            id: { type: string, format: uuid }
            display_name: { type: string }
        assignee:
          type: [object, 'null']
          properties:
            id: { type: string, format: uuid }
            display_name: { type: string }
        team_id: { type: [string, 'null'], format: uuid }
        payload: { type: object, additionalProperties: true }
        scheduled_start_at: { type: [string, 'null'], format: date-time }
        scheduled_end_at: { type: [string, 'null'], format: date-time }
        actual_start_at: { type: [string, 'null'], format: date-time }
        actual_end_at: { type: [string, 'null'], format: date-time }
        response_due_at: { type: [string, 'null'], format: date-time }
        resolution_due_at: { type: [string, 'null'], format: date-time }
        sla_state: { type: string }
        labor_minutes: { type: integer }
        total_cost: { type: [number, 'null'] }
        satisfaction_score: { type: [integer, 'null'] }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }

    WorkOrderCreate:
      type: object
      required: [facility_id, work_order_type, title]
      properties:
        facility_id: { type: string, format: uuid }
        work_order_type: { type: string, enum: [MAINTENANCE, SERVICE, INSPECTION, CORRECTIVE, PROJECT] }
        title: { type: string, maxLength: 250 }
        description: { type: string }
        asset_id: { type: string, format: uuid }
        spatial_node_id: { type: string, format: uuid }
        service_item_id:
          type: string
          format: uuid
          description: work_order_type=SERVICE 時必填
        reservation_id: { type: string, format: uuid }
        priority: { type: string, enum: [LOW, MEDIUM, HIGH, URGENT, CRITICAL], default: MEDIUM }
        requested_start_at: { type: string, format: date-time }
        payload:
          type: object
          additionalProperties: true
          description: 依 service_items.form_schema 驗證
        team_id: { type: string, format: uuid }
        assignee_id: { type: string, format: uuid }
        as_draft: { type: boolean, default: false }
        attachment_ids:
          type: array
          items: { type: string, format: uuid }

    WorkOrderUpdate:
      type: object
      properties:
        title: { type: string }
        description: { type: string }
        priority: { type: string }
        team_id: { type: string, format: uuid }
        scheduled_start_at: { type: string, format: date-time }
        scheduled_end_at: { type: string, format: date-time }
        payload: { type: object, additionalProperties: true }
        is_chargeback: { type: boolean }
        chargeback_org_id: { type: string, format: uuid }

    WorkOrderTransitionRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          example: ASSIGN
          description: 由狀態機定義；見 /work-orders/{id}/available-actions
        assignee_id: { type: string, format: uuid }
        team_id: { type: string, format: uuid }
        scheduled_start_at: { type: string, format: date-time }
        reason: { type: string }
        resolution_notes: { type: string }
        close_code: { type: string }
        root_cause: { type: string }
        labor_minutes: { type: integer }
        parts_used:
          type: array
          items:
            type: object
            properties:
              part_id: { type: string, format: uuid }
              quantity: { type: number }
        metadata: { type: object, additionalProperties: true }

    WorkOrderTask:
      type: object
      properties:
        id: { type: string, format: uuid }
        seq: { type: integer }
        title: { type: string }
        input_type: { type: string, enum: [CHECKBOX, NUMBER, TEXT, PHOTO, SIGNATURE, SELECT] }
        unit: { type: [string, 'null'] }
        min_value: { type: [number, 'null'] }
        max_value: { type: [number, 'null'] }
        is_required: { type: boolean }
        result_value: {}
        is_pass: { type: [boolean, 'null'] }
        completed_at: { type: [string, 'null'], format: date-time }

    WorkOrderDetail:
      allOf:
        - $ref: '#/components/schemas/WorkOrder'
        - type: object
          properties:
            tasks:
              type: array
              items: { $ref: '#/components/schemas/WorkOrderTask' }
            comments:
              type: array
              items:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  author_name: { type: string }
                  visibility: { type: string }
                  body: { type: string }
                  created_at: { type: string, format: date-time }
            transitions:
              type: array
              items:
                type: object
                properties:
                  from_status: { type: [string, 'null'] }
                  action: { type: string }
                  to_status: { type: string }
                  actor_name: { type: [string, 'null'] }
                  reason: { type: [string, 'null'] }
                  occurred_at: { type: string, format: date-time }
            parts:
              type: array
              items:
                type: object
                properties:
                  part_code: { type: string }
                  name: { type: string }
                  quantity_used: { type: number }
                  total_cost: { type: [number, 'null'] }
            # getWorkOrder 的 include 說明列出 labor，但 WorkOrderDetail
            # 原本沒有對應欄位（與 open_work_orders 同一類不一致）。
            # `cost` 目前一律為 null：全 schema 沒有工時費率來源。
            labor:
              type: array
              items:
                type: object
                properties:
                  user_name: { type: [string, 'null'] }
                  started_at: { type: string, format: date-time }
                  ended_at: { type: [string, 'null'], format: date-time }
                  minutes: { type: [integer, 'null'] }
                  cost: { type: [number, 'null'] }
                  is_overtime: { type: boolean }
            attachments:
              type: array
              items: { $ref: '#/components/schemas/Attachment' }

    Attachment:
      type: object
      properties:
        id: { type: string, format: uuid }
        purpose: { type: string }
        file_name: { type: string }
        mime_type: { type: [string, 'null'] }
        size_bytes: { type: [integer, 'null'] }
        download_url:
          type: string
          description: 短期有效的預簽網址
        created_at: { type: string, format: date-time }

    ResourceAvailability:
      type: object
      properties:
        resource_id:
          type: string
          format: uuid
          description: >-
            底層資源本身（SpatialNode.id / Asset.id），不是 BookableResource.id
            ——同 ReservationCreate.resource_id 的說明。
        resource_type: { type: string, enum: [SPATIAL_NODE, ASSET] }
        display_name: { type: string }
        capacity: { type: integer }
        opening_hours: { type: object, additionalProperties: true }
        rules:
          type: object
          properties:
            min_duration_minutes: { type: integer }
            max_duration_minutes: { type: integer }
            slot_granularity_minutes: { type: integer }
            requires_approval: { type: boolean }
            advance_booking_days: { type: integer }
        busy:
          type: array
          items:
            type: object
            properties:
              start_at: { type: string, format: date-time }
              end_at: { type: string, format: date-time }
              kind: { type: string, enum: [RESERVATION, HOLD, BLACKOUT, BUFFER, MAINTENANCE] }
              reason: { type: [string, 'null'] }
        free_slots:
          type: array
          items:
            type: object
            properties:
              start_at: { type: string, format: date-time }
              end_at: { type: string, format: date-time }

    Reservation:
      type: object
      properties:
        id: { type: string, format: uuid }
        reservation_no: { type: string }
        facility_id: { type: string, format: uuid }
        resource_id:
          type: string
          format: uuid
          description: >-
            底層資源本身（SpatialNode.id / Asset.id），不是 BookableResource.id
            ——同 ReservationCreate.resource_id 的說明。
        resource_name: { type: string }
        resource_type: { type: string }
        title: { type: [string, 'null'] }
        purpose: { type: [string, 'null'] }
        party_size: { type: integer }
        start_at: { type: string, format: date-time }
        end_at: { type: string, format: date-time }
        status: { type: string }
        organizer:
          type: [object, 'null']
          description: |
            **私人預約對無權查看者為 `null`。** 見下方 `is_private`。

            為什麼整個物件為 null 而不是只遮 `display_name`：保留 `id` 仍可以
            拿去 `GET /users/{userId}` 換回姓名 —— 一個只多一次請求的遮罩
            比沒有遮罩更糟，因為它讓人以為問題解決了。
          properties:
            id: { type: string, format: uuid }
            display_name: { type: string }
        approval_required: { type: boolean }
        requires_check_in: { type: boolean }
        checked_in_at: { type: [string, 'null'], format: date-time }
        auto_release_at: { type: [string, 'null'], format: date-time }
        recurrence_group_id: { type: [string, 'null'], format: uuid }
        created_via: { type: string }
        version: { type: integer }
        is_private:
          type: boolean
          description: |
            私人預約。`sql/011` 的規格：非本人／非管理員只看得到「已預約」
            與時段，看不到標題、與會者與備註。

            **為真且呼叫端無權查看時，`title`／`purpose`／`organizer` 皆為
            `null`。** 有權查看的是「本人」（`organizer` 或代訂對象）與持有
            `reservation:view_private` 的角色（預設為 PLATFORM_ADMIN／
            TENANT_ADMIN／ORG_MANAGER／FACILITY_ADMIN，可由角色設定調整）。

            **無論遮罩與否都回傳這個旗標** —— 客戶端要靠它決定渲染「已預約」
            還是標題。`is_private && title == null` 是「被遮罩」，
            `is_private && title != null` 是「我有權看」。

            `start_at`／`end_at`／`status`／`resource_name` 永不遮罩：
            那正是規格說看得到的部分，也是行事曆可用的前提。

            **沒有遮的殘留**（011 未提及，且對「這個時段有人用」是必要資訊）：
            `party_size`、`reservation_no`、`resource_id`。

            **目前無法從 API 設定這個旗標** —— `ReservationCreate` 沒有這個
            屬性（011 加欄位時沒有一併開寫入面）。讀取面的遮罩已生效，
            寫入面要改契約，是另一件事。

    ReservationCreate:
      type: object
      required: [resource_id, start_at, end_at]
      properties:
        resource_id:
          type: string
          format: uuid
          description: >-
            指向底層資源本身——即 SpatialNode.id 或 Asset.id，**不是**
            BookableResource.id。從 `GET .../bookable-resources` 拿到列表後，
            要填的是該列的 `resource_id` 欄位，不是該列自己的 `id`。
        title: { type: string }
        purpose: { type: string }
        party_size: { type: integer, minimum: 1, default: 1 }
        start_at: { type: string, format: date-time }
        end_at: { type: string, format: date-time }
        on_behalf_of_id:
          type: string
          format: uuid
          description: 代訂時填入實際使用者；需 reservation:create 於該 scope
        is_private:
          type: boolean
          default: false
          description: |
            私人預約（`sql/011`）。**不需要額外權限** —— 隱私是主辦人對自己
            會議的選擇，而建立者就是主辦人。

            設為 `true` 之後，`title`／`purpose`／`organizer` 對非本人且未持有
            `reservation:view_private` 的呼叫端一律為 `null`（`Reservation`
            的 `is_private` 有完整說明）。佔用地圖與封鎖時段的衝突清單同樣遮罩。

            有 `recurrence_rule` 時整個系列一起套用。
        hold_token:
          type: string
          description: >-
            若先取得佔位則帶入，伺服端會消耗該 hold。**不能與 recurrence_rule
            同時帶**——兩者同時出現會回 422 VALIDATION_ERROR（hold 只對應單一
            時段，跟「展開成多筆」互斥）。週期預約請直接帶 recurrence_rule，
            不要先走 hold→create 兩階段。
        recurrence_rule:
          type: string
          description: >-
            RFC 5545 RRULE；伺服端展開為多筆預約並回傳 recurrence_group_id。
            **不能與 hold_token 同時帶**，理由同 hold_token 的說明。
        participants:
          type: array
          items:
            type: object
            properties:
              user_id: { type: string, format: uuid }
              external_email: { type: string, format: email }
              role: { type: string, enum: [ATTENDEE, OPTIONAL] }
        services:
          type: array
          description: 附加的軟性服務；建立成功後由事件驅動產生對應工單
          items:
            type: object
            required: [service_item_id]
            properties:
              service_item_id: { type: string, format: uuid }
              quantity: { type: number, default: 1 }
              payload: { type: object, additionalProperties: true }
              notes: { type: string }
        external_event_id: { type: string }
        attributes: { type: object, additionalProperties: true }

    ReservationUpdate:
      type: object
      properties:
        title: { type: string }
        purpose: { type: string }
        party_size: { type: integer }
        start_at: { type: string, format: date-time }
        end_at: { type: string, format: date-time }
        is_private:
          type: boolean
          description: |
            私人預約旗標。可以事後打開（訂完才想到要設為私人）或關閉。

            **改它的條件比改其他欄位嚴格：403 除非呼叫端是本人（`organizer`
            或代訂對象）或持有 `reservation:view_private`。**

            理由：PATCH 對非主辦人只要求 `reservation:update`，而把旗標從
            `true` 改成 `false` 的效果就是揭露內容 —— 沒有這道額外的閘門，
            任何有 update 權限的人都能改完旗標再讀一次，整個遮罩被繞過。

            判定重用遮罩自己的條件（「看得到遮罩後內容的人不能改它」），
            因此兩者不可能漂移。回 403 而不是靜默忽略：忽略會回 200 而旗標
            沒變，呼叫端會以為改了。
        apply_scope:
          type: string
          enum: [THIS, THIS_AND_FOLLOWING, ALL]
          default: THIS
          description: >-
            週期預約的編輯範圍。`THIS_AND_FOLLOWING`／`ALL` 只對
            `title`／`purpose`／`party_size`／`is_private` 生效——同時帶
            `start_at`／`end_at` 會回 422（時段是每一次各自的，「整個系列
            一起改時間」沒有單一定義的語意）。目標預約必須屬於某個週期系列
            （`recurrence_group_id` 非空），否則回 422。這個範圍內的批次更新
            **不做逐列版本比對**——`If-Match` 仍然檢查你正在看的這一筆，但
            系列裡其他場次沒有個別的版本可比對。
        services:
          type: array
          description: 完整覆寫附加服務清單；已產生的工單會依差異取消或新增
          items:
            type: object
            properties:
              service_item_id: { type: string, format: uuid }
              quantity: { type: number }
              payload: { type: object, additionalProperties: true }

    ReservationDetail:
      allOf:
        - $ref: '#/components/schemas/Reservation'
        - type: object
          properties:
            services:
              type: array
              items:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  service_item_id: { type: string, format: uuid }
                  service_name: { type: string }
                  quantity: { type: number }
                  payload: { type: object, additionalProperties: true }
                  service_start_at: { type: [string, 'null'], format: date-time }
                  status: { type: string }
                  work_order:
                    type: [object, 'null']
                    properties:
                      id: { type: string, format: uuid }
                      wo_no: { type: string }
                      status: { type: string }
            participants:
              type: array
              items:
                type: object
                properties:
                  user_id: { type: [string, 'null'], format: uuid }
                  display_name: { type: [string, 'null'] }
                  external_email: { type: [string, 'null'] }
                  role: { type: string }
                  response: { type: string }

    TelemetryBatch:
      type: object
      required: [readings]
      properties:
        gateway_code: { type: string }
        readings:
          type: array
          maxItems: 1000
          items:
            type: object
            required: [observed_at]
            properties:
              device_code: { type: string }
              point_code: { type: string }
              telemetry_point_id: { type: string, format: uuid }
              observed_at: { type: string, format: date-time }
              value_num: { type: number }
              value_bool: { type: boolean }
              value_text: { type: string }
              quality: { type: string, enum: [GOOD, UNCERTAIN, BAD, STALE], default: GOOD }

    Device:
      type: object
      properties:
        id: { type: string, format: uuid }
        facility_id: { type: string, format: uuid }
        facility_name: { type: string }
        gateway_id: { type: [string, 'null'], format: uuid }
        asset_id: { type: [string, 'null'], format: uuid }
        asset_code: { type: [string, 'null'] }
        spatial_node_id: { type: [string, 'null'], format: uuid }
        location_name: { type: [string, 'null'] }
        device_code: { type: string }
        name: { type: string }
        device_type:
          type: string
          enum: [SENSOR, METER, CONTROLLER, ACCESS_PANEL, CAMERA, OCCUPANCY, ENVIRONMENT, GATEWAY]
        address: { type: [string, 'null'] }
        heartbeat_interval_seconds: { type: integer }
        offline_alarm_after_seconds:
          type: integer
          description: 管理者設定的離線門檻。connectivity 是用它算的
        last_seen_at: { type: [string, 'null'], format: date-time }
        status:
          type: string
          enum: [ONLINE, OFFLINE, FAULT, MAINTENANCE, UNKNOWN, DISABLED]
          description: |
            **儲存的**狀態，不是現在的連線狀態。ingest 會把它翻成 ONLINE，
            而沒有任何東西把它翻回 OFFLINE —— 要問連線狀態看 connectivity。
        connectivity:
          type: string
          enum: [ONLINE, OFFLINE, NEVER_SEEN, MAINTENANCE, DISABLED]
          description: |
            **算出來的**連線狀態，基準是資料庫的現在與這台裝置的
            offline_alarm_after_seconds。DISABLED／MAINTENANCE 直接透傳 ——
            那是行政狀態，不該被「它沒在回報」蓋掉。
        seconds_since_seen:
          type: [integer, 'null']
          description: 距上次回報幾秒。從未回報過是 null，不是 0
        point_count: { type: integer }
        created_at: { type: string, format: date-time }
    TelemetryPoint:
      type: object
      properties:
        id: { type: string, format: uuid }
        point_code: { type: string }
        name: { type: string }
        data_type:
          type: string
          enum: [NUMBER, BOOLEAN, STRING, ENUM]
        unit: { type: [string, 'null'] }
        scale_factor: { type: number }
        offset_value: { type: number }
        valid_min: { type: [number, 'null'] }
        valid_max: { type: [number, 'null'] }
        asset_meter_id:
          type: [string, 'null']
          format: uuid
          description: 有值代表這個點位餵給某個設備計量，計量型 PM 跟著它走
        is_active: { type: boolean }
        last_observed_at: { type: [string, 'null'], format: date-time }
        last_value_num: { type: [number, 'null'] }
        last_value_bool: { type: [boolean, 'null'] }
        last_value_text: { type: [string, 'null'] }
        last_quality: { type: [string, 'null'] }
    TelemetryLatest:
      type: object
      properties:
        telemetry_point_id: { type: string, format: uuid }
        point_code: { type: string }
        point_name: { type: string }
        unit: { type: [string, 'null'] }
        device_id: { type: string, format: uuid }
        device_code: { type: string }
        facility_id: { type: string, format: uuid }
        asset_id: { type: [string, 'null'], format: uuid }
        observed_at: { type: string, format: date-time }
        value_num: { type: [number, 'null'] }
        value_bool: { type: [boolean, 'null'] }
        value_text: { type: [string, 'null'] }
        quality:
          type: string
          enum: [GOOD, UNCERTAIN, BAD, STALE]
        age_seconds: { type: integer }
        is_stale:
          type: boolean
          description: |
            超過裝置自己的 offline_alarm_after_seconds。**必須看** ——
            把三天前的讀數顯示成當前值比顯示「無資料」危險。
    TelemetryBucket:
      type: object
      properties:
        telemetry_point_id: { type: string, format: uuid }
        bucket_start: { type: string, format: date-time }
        sample_count:
          type: integer
          description: 桶內原始筆數。1 表示這段只採到一筆，avg/min/max 會相同
        avg_value: { type: [number, 'null'] }
        min_value: { type: [number, 'null'] }
        max_value:
          type: [number, 'null']
          description: 越界是 max 的問題，不是 avg 的 —— 只用 avg 畫圖會漏掉尖峰
        last_observed_at: { type: string, format: date-time }
        last_value_num: { type: [number, 'null'] }
        last_value_bool: { type: [boolean, 'null'] }
        last_value_text: { type: [string, 'null'] }
        has_suspect_quality:
          type: boolean
          description: 桶內混有非 GOOD 的讀數，這個平均值不能當事實用
    AlarmRule:
      type: object
      properties:
        id: { type: string, format: uuid }
        facility_id: { type: [string, 'null'], format: uuid }
        facility_name: { type: [string, 'null'] }
        code: { type: string }
        name: { type: string }
        description: { type: [string, 'null'] }
        telemetry_point_id: { type: [string, 'null'], format: uuid }
        point_code: { type: [string, 'null'] }
        asset_category_id: { type: [string, 'null'], format: uuid }
        rule_type:
          type: string
          enum: [THRESHOLD, RATE_OF_CHANGE, DEVIATION, FLATLINE, DEVICE_OFFLINE, BOOLEAN_STATE, COMPOSITE]
        condition:
          type: object
          example: { op: ">", value: 28 }
        severity:
          type: string
          enum: [INFO, WARNING, MINOR, MAJOR, CRITICAL]
        debounce_seconds: { type: integer }
        auto_clear: { type: boolean }
        auto_create_work_order: { type: boolean }
        wo_work_order_type: { type: [string, 'null'] }
        wo_priority: { type: [string, 'null'] }
        wo_team_id: { type: [string, 'null'], format: uuid }
        wo_sla_policy_id: { type: [string, 'null'], format: uuid }
        dedupe_window_minutes: { type: integer }
        notify_role_codes:
          type: array
          items: { type: string }
        is_active: { type: boolean }
        covered_point_count:
          type: integer
          description: |
            這條規則現在管到幾個點位。**0 是最重要的一個值** ——
            point_code 打錯就會這樣，而規則會安靜地什麼都不管。
        evaluable:
          type: boolean
          description: |
            057 的評估器現在能不能用單筆讀數評估它。false 代表
            **它現在不會響**（非 THRESHOLD 或 condition 有 for_seconds）。
        created_at: { type: string, format: date-time }
    Alarm:
      type: object
      properties:
        id: { type: string, format: uuid }
        alarm_no: { type: string }
        facility_id: { type: string, format: uuid }
        rule_code: { type: [string, 'null'] }
        severity: { type: string, enum: [INFO, WARNING, MINOR, MAJOR, CRITICAL] }
        status: { type: string, enum: [ACTIVE, ACKNOWLEDGED, SUPPRESSED, CLEARED, CLOSED] }
        message: { type: string }
        trigger_value: { type: [number, 'null'] }
        threshold_value: { type: [number, 'null'] }
        occurrence_count: { type: integer }
        asset:
          type: [object, 'null']
          properties:
            id: { type: string, format: uuid }
            asset_code: { type: string }
            name: { type: string }
        location:
          type: [object, 'null']
          properties:
            spatial_node_id: { type: string, format: uuid }
            name: { type: string }
        work_order:
          type: [object, 'null']
          properties:
            id: { type: string, format: uuid }
            wo_no: { type: string }
            status: { type: string }
        first_seen_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        acknowledged_at: { type: [string, 'null'], format: date-time }
        cleared_at: { type: [string, 'null'], format: date-time }
        suppressed_until:
          type: [string, 'null']
          format: date-time
          description: |
            抑制到什麼時候。`status = SUPPRESSED` 時必有值。

            值班畫面必須看得出「到幾點為止」，否則「這則為什麼沒響」沒有答案。

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        employee_no: { type: [string, 'null'] }
        username: { type: string }
        email: { type: [string, 'null'], format: email }
        display_name: { type: string }
        phone: { type: [string, 'null'] }
        job_title: { type: [string, 'null'] }
        user_type: { type: string }
        primary_org_id: { type: [string, 'null'], format: uuid }
        default_facility_id: { type: [string, 'null'], format: uuid }
        status: { type: string }
        identity_sources:
          type: array
          items:
            type: object
            properties:
              provider_code: { type: string }
              provider_type: { type: string }
              external_upn: { type: [string, 'null'] }
        skills:
          type: array
          items:
            type: object
            properties:
              skill_code: { type: string }
              level: { type: integer }
              expires_at: { type: [string, 'null'], format: date }
        last_login_at: { type: [string, 'null'], format: date-time }

    UserCreate:
      type: object
      required: [username, display_name]
      properties:
        username: { type: string }
        display_name: { type: string }
        email: { type: [string, 'null'], format: email }
        given_name: { type: [string, 'null'] }
        family_name: { type: [string, 'null'] }
        employee_no: { type: [string, 'null'] }
        phone: { type: [string, 'null'] }
        job_title: { type: [string, 'null'] }
        user_type:
          type: string
          enum: [EMPLOYEE, CONTRACTOR, VENDOR, TENANT_USER, SERVICE_ACCOUNT, KIOSK]
          default: EMPLOYEE
        primary_org_id: { type: [string, 'null'], format: uuid }
        default_facility_id: { type: [string, 'null'], format: uuid }
        locale: { type: [string, 'null'] }
        timezone: { type: [string, 'null'] }
    UserPatch:
      type: object
      description: >
        省略欄位 = 不動；明確給 null = 清空。username 與 status 不可改
        （前者是身分，後者走 suspend）。
      properties:
        display_name: { type: string }
        email: { type: [string, 'null'], format: email }
        given_name: { type: [string, 'null'] }
        family_name: { type: [string, 'null'] }
        employee_no: { type: [string, 'null'] }
        phone: { type: [string, 'null'] }
        job_title: { type: [string, 'null'] }
        user_type:
          type: string
          enum: [EMPLOYEE, CONTRACTOR, VENDOR, TENANT_USER, SERVICE_ACCOUNT, KIOSK]
        primary_org_id: { type: [string, 'null'], format: uuid }
        default_facility_id: { type: [string, 'null'], format: uuid }
        locale: { type: [string, 'null'] }
        timezone: { type: [string, 'null'] }
    RoleAssignment:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        role_code: { type: string }
        role_name: { type: string }
        scope_type: { type: string }
        scope_id: { type: [string, 'null'], format: uuid }
        scope_label: { type: [string, 'null'] }
        source: { type: string, enum: [MANUAL, DIRECTORY_SYNC, SCIM, JIT, SYSTEM] }
        valid_until: { type: [string, 'null'], format: date-time }

    Skill:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenant_id:
          type: [string, 'null']
          format: uuid
          description: null 代表平台技能（所有租戶共用）
        code: { type: string }
        name: { type: string }
        domain: { type: [string, 'null'] }
        requires_certification:
          type: boolean
          description: 法規要求執業證照 —— 決定 expires_at 是不是必要
        reminder_days_before:
          type: integer
          minimum: 1
          maximum: 365
          description: |
            到期前幾天開始提醒（migration 059）。**由管理者定義**，不是
            後端寫死的數字：電氣／電梯／鍋爐執照換證要送審，平台目錄給 60 天；
            消防與高空作業 45 天；其餘預設 30 天。
    UserSkill:
      type: object
      properties:
        skill_id: { type: string, format: uuid }
        skill_code: { type: string }
        skill_name: { type: string }
        requires_certification: { type: boolean }
        level: { type: integer, minimum: 1, maximum: 5 }
        certified_at: { type: [string, 'null'], format: date }
        expires_at: { type: [string, 'null'], format: date }
        certificate_no: { type: [string, 'null'] }
        days_until_expiry:
          type: [integer, 'null']
          description: 負數代表已過期。expires_at 為 null 時是 null
        status:
          type: string
          enum: [VALID, EXPIRING, EXPIRED, NOT_APPLICABLE]
          description: |
            **算出來的，不是存的** —— 存下來的話它會在沒有人更新的那天開始說謊。
            `NOT_APPLICABLE` 代表這項技能不需要證照且沒有到期日。

    FloorViewNode:
      type: object
      properties:
        id: { type: string, format: uuid }
        parent_id: { type: [string, 'null'], format: uuid }
        code: { type: string }
        name: { type: string }
        node_type_code: { type: string }
        node_path: { type: string }
        depth: { type: integer }
        floor_level: { type: [integer, 'null'] }
        floor_label: { type: [string, 'null'] }
        area_sqm: { type: [number, 'null'] }
        capacity: { type: integer }
        is_bookable: { type: boolean }
        geometry:
          type: object
          description: |
            `{}` = 沒有幾何，畫不出來（不是「沒有形狀」，見 `meta.nodes_without_geometry`）。

            目前只有一種形狀：
            ```json
            { "type": "bbox", "min": [x, y], "max": [x, y] }
            ```
            * `min`／`max`：BIM 模型世界座標系（IFC 檔案自己的原點與比例，
              不是地理座標）投影到 XY 平面後的邊界框，單位是**公尺**。
              不做完整多邊形足跡——bbox 是 v1 唯一的形狀。
            * 手動匯入（非 BIM 解析）的節點沒有 `geometry`：`{}`。
            * 同一場域內的節點共用同一個世界座標系，因此可以直接用
              `min`／`max` 換算相對位置畫圖，不需要額外的座標轉換。
        bim_element_id: { type: [string, 'null'] }
        asset_count: { type: integer }
        open_work_orders: { type: integer }
        active_alarms: { type: integer }
        worst_alarm_severity:
          type: [string, 'null']
          description: |
            max(severity) 是字典序 —— 照 meta.alarm_severity_order 排。
            只需要顯示文字時用這個；要排序或決定顏色深淺請用 `worst_alarm_rank`。
        worst_alarm_rank:
          type: [integer, 'null']
          description: |
            已經排好序的嚴重度（1=INFO…5=CRITICAL，`array_position` 是
            Postgres 的 1-based 索引）。沒有未結告警是 `null`。
            不用查 `meta.alarm_severity_order` 就能直接排序或做顏色漸層。
        occupancy_state:
          type: [string, 'null']
          enum: [FREE, OCCUPIED, RESERVED, HELD, null]
          description: |
            即時佔用狀態，與 `GET /facilities/{facilityId}/occupancy` 同一份判定。
            `null` 代表這個節點不是可預約資源（走廊、樓層本身之類）——
            不是「目前沒有資料」，是「這個問題對它沒有意義」。刻意不回
            `title`／`organizer_name`：這裡不檢查 `reservation:read`，回那些
            欄位會繞過私人預約的遮罩。
        occupancy_start_at:
          type: [string, 'null']
          format: date-time
          description: |
            目前這筆佔用（預約或 hold）的開始時刻。`occupancy_state` 為
            `null` 或 `FREE` 時這欄也是 `null`。時間本身不是遮罩對象——
            私人預約一樣照回，與 `GET /occupancy` 的行為一致。
        occupancy_end_at:
          type: [string, 'null']
          format: date-time
          description: 目前這筆佔用預期結束的時刻，語意同 `occupancy_start_at`。
        device_count:
          type: integer
          description: |
            掛在這個節點下的設備數（直接掛節點，或透過位於此節點的資產）。

            **`device_count - devices_offline_count` 不等於「在線設備數」**——
            `device_count` 也包含 `NEVER_SEEN`／`DISABLED`／`MAINTENANCE`
            狀態的設備，那些既不算「離線」（見 `devices_offline_count`）也
            不算「在線」。要拿到真正的在線數，得逐一呼叫 `GET /devices`
            用 `connectivity` 欄位過濾，這裡刻意不做這個相減，避免看起來
            像一個可以直接信任的數字。
        devices_offline_count:
          type: integer
          description: |
            上述設備中連線狀態為 OFFLINE 的數量（見 `fms.device_connectivity()`，
            與 `GET /devices` 的 `connectivity` 欄位同一份判定）。不含
            NEVER_SEEN／DISABLED／MAINTENANCE——那些不是「斷線」。

