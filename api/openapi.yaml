  # ---------------------------------------------------------------------------
  # Spatial
  # ---------------------------------------------------------------------------
  /facilities/{facilityId}/spatial-nodes:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/FacilityIdPath'
    get:
      tags: [Spatial]
